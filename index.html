<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Tutor - CICLO DE LECTURAS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="pixel-bg">

    <header class="pixel-header text-center py-3">
        <h1 class="pixel-title" style="font-size: 1.2rem;">PANEL DEL TUTOR</h1>
    </header>

    <!-- Login Tutor -->
    <main id="loginTutor" class="container mt-5">
        <section class="pixel-panel p-4 text-center" style="max-width: 400px; margin: auto;">
            <h2 class="panel-title mb-4">ACCESO TUTOR</h2>
            <input type="password" id="txtCodigoTutor" class="pixel-input mb-3" placeholder="CÓDIGO DE ACCESO">
            <button id="btnLoginTutor" class="pixel-btn">INGRESAR</button>
        </section>
    </main>

    <!-- Panel Admin -->
    <main id="panelAdmin" class="container-fluid mt-3 mb-5" style="display: none;">
        <ul class="nav nav-tabs pixel-nav mb-4" id="adminTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link pixel-nav-link active" data-bs-toggle="tab" data-bs-target="#tabEstudiantes">ESTUDIANTES</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link pixel-nav-link" data-bs-toggle="tab" data-bs-target="#tabLibros">LIBROS</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link pixel-nav-link" data-bs-toggle="tab" data-bs-target="#tabValoraciones">VALORACIONES</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link pixel-nav-link" data-bs-toggle="tab" data-bs-target="#tabEstadisticas">ESTADÍSTICAS</button>
            </li>
        </ul>

        <div class="tab-content">
            <!-- Estudiantes -->
            <div class="tab-pane fade show active" id="tabEstudiantes">
                <div class="pixel-panel p-4" id="moduloEstudiantes"></div>
            </div>
            <!-- Libros -->
            <div class="tab-pane fade" id="tabLibros">
                <div class="pixel-panel p-4" id="moduloLibros"></div>
            </div>
            <!-- Valoraciones -->
            <div class="tab-pane fade" id="tabValoraciones">
                <div class="pixel-panel p-4" id="moduloValoraciones"></div>
            </div>
            <!-- Estadísticas -->
            <div class="tab-pane fade" id="tabEstadisticas">
                <div class="pixel-panel p-4" id="moduloEstadisticas"></div>
            </div>
        </div>
    </main>

    <!-- Modal Genérico para Formularios -->
    <div class="modal fade" id="modalFormulario" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content pixel-modal-content">
                <div class="modal-header pixel-modal-header">
                    <h5 class="modal-title" id="tituloModalForm"></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body pixel-modal-body" id="cuerpoModalForm">
                    <!-- Contenido dinámico -->
                </div>
                <div class="modal-footer pixel-modal-footer">
                    <button id="btnGuardarModal" class="pixel-btn">GUARDAR</button>
                </div>
            </div>
        </div>
    </div>

    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        <div id="pixelToast" class="toast pixel-toast" role="alert">
            <div class="toast-body" id="pixelToastMsg"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/estudiantes.js"></script>
    <script src="js/libros.js"></script>
    <script src="js/valoraciones.js"></script>
    <script src="js/rankings.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btnLoginTutor').addEventListener('click', () => {
                const code = document.getElementById('txtCodigoTutor').value;
                if(code === '1998') {
                    document.getElementById('loginTutor').style.display = 'none';
                    document.getElementById('panelAdmin').style.display = 'block';
                    initAdminModules();
                } else {
                    mostrarToast('Código incorrecto');
                }
            });
        });
    </script>
</body>
</html>
