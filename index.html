<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#0a0a0a}
::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#dc2626}
body{font-family:'Cinzel',serif;background:#050505;color:#e5e5e5;overflow-x:hidden}
.font-gothic{font-family:'UnifrakturMaguntia',serif}
.font-cinzel{font-family:'Cinzel',serif}

/* Splash */
.splash-screen{position:fixed;inset:0;z-index:9999;background:#050505;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s,visibility .8s}
.splash-screen.hide{opacity:0;visibility:hidden;pointer-events:none}
.glitch-text{font-family:'UnifrakturMaguntia',serif;font-size:clamp(3rem,12vw,8rem);color:#fff;position:relative;animation:glitchIn 1.5s ease-out forwards}
.glitch-text::before,.glitch-text::after{content:attr(data-text);position:absolute;top:0;left:0;width:100%;height:100%}
.glitch-text::before{color:#dc2626;animation:glitch1 2s infinite;clip-path:inset(0 0 70% 0)}
.glitch-text::after{color:#3b82f6;animation:glitch2 2.5s infinite;clip-path:inset(70% 0 0 0)}
@keyframes glitchIn{0%{opacity:0;transform:scale(.8)translateY(20px);filter:blur(10px)}50%{opacity:.6;transform:scale(1.05);filter:blur(2px)}100%{opacity:1;transform:scale(1)translateY(0);filter:blur(0)}}
@keyframes glitch1{0%,100%{transform:translate(0)}20%{transform:translate(-3px,2px)}40%{transform:translate(3px,-2px)}60%{transform:translate(-2px,-1px)}80%{transform:translate(2px,1px)}}
@keyframes glitch2{0%,100%{transform:translate(0)}20%{transform:translate(2px,-2px)}40%{transform:translate(-2px,2px)}60%{transform:translate(2px,1px)}80%{transform:translate(-2px,-1px)}}
.subtitle-anim{opacity:0;animation:fadeUp 1s ease-out forwards;animation-delay:1.5s}
.tagline-anim{opacity:0;animation:fadeUp 1s ease-out forwards;animation-delay:2.5s}
@keyframes fadeUp{0%{opacity:0;transform:translateY(15px)}100%{opacity:1;transform:translateY(0)}}

/* Smoke particles */
.smoke-container{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.smoke{position:absolute;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(220,38,38,.06)0%,transparent 70%);filter:blur(40px);animation:smokeDrift 8s infinite}
@keyframes smokeDrift{0%{transform:translateY(100vh)scale(.5);opacity:0}30%{opacity:1}70%{opacity:.5}100%{transform:translateY(-20vh)scale(1.5);opacity:0}}

/* Cards & Components */
.card-dark{background:linear-gradient(135deg,#111 0%,#1a1a1a 100%);border:1px solid #2a2a2a;border-radius:12px;transition:all .3s}
.card-dark:hover{border-color:#dc2626;box-shadow:0 0 20px rgba(220,38,38,.1)}
.btn-blood{background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;border:none;border-radius:8px;padding:10px 20px;font-family:'Cinzel',serif;font-weight:600;cursor:pointer;transition:all .3s;text-transform:uppercase;letter-spacing:1px;font-size:.8rem}
.btn-blood:hover{box-shadow:0 0 25px rgba(220,38,38,.4);transform:translateY(-1px)}
.btn-blood:active{transform:scale(.97)}
.btn-ghost{background:transparent;color:#999;border:1px solid #333;border-radius:8px;padding:8px 16px;font-family:'Cinzel',serif;font-weight:600;cursor:pointer;transition:all .3s;font-size:.75rem}
.btn-ghost:hover{border-color:#dc2626;color:#dc2626}
.input-dark{background:#111;border:1px solid #2a2a2a;border-radius:8px;padding:10px 14px;color:#e5e5e5;font-family:'Cinzel',serif;font-size:.85rem;width:100%;transition:border-color .3s}
.input-dark:focus{outline:none;border-color:#dc2626;box-shadow:0 0 0 2px rgba(220,38,38,.15)}
.input-dark::placeholder{color:#555}

/* Toast */
.toast-container{position:fixed;bottom:20px;right:20px;z-index:8000;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{padding:14px 18px;border-radius:10px;color:#fff;font-size:.8rem;font-weight:600;display:flex;align-items:center;gap:10px;animation:toastIn .4s ease-out;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast-success{background:linear-gradient(135deg,#166534,#14532d);border:1px solid #22c55e}
.toast-error{background:linear-gradient(135deg,#991b1b,#7f1d1d);border:1px solid #ef4444}
.toast-info{background:linear-gradient(135deg,#1e3a5f,#172554);border:1px solid #3b82f6}
.toast-warning{background:linear-gradient(135deg,#713f12,#612f0c);border:1px solid #f59e0b}
@keyframes toastIn{0%{opacity:0;transform:translateX(40px)}100%{opacity:1;transform:translateX(0)}}
@keyframes toastOut{0%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(40px)}}

/* Modal */
.modal-overlay{position:fixed;inset:0;z-index:7000;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s}
.modal-box{background:#111;border:1px solid #2a2a2a;border-radius:16px;padding:28px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;animation:modalIn .3s}
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
@keyframes modalIn{0%{opacity:0;transform:scale(.9)translateY(20px)}100%{opacity:1;transform:scale(1)translateY(0)}}

/* Sidebar */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:#0a0a0a;border-right:1px solid #1a1a1a;z-index:5000;transition:transform .3s;overflow-y:auto}
@media(max-width:768px){.sidebar{transform:translateX(-100%);width:280px}.sidebar.open{transform:translateX(0)}}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:4999;display:none}
@media(max-width:768px){.sidebar-overlay.open{display:block}}

/* Mobile bottom nav */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;border-top:1px solid #1a1a1a;z-index:4000;padding:6px 0 env(safe-area-inset-bottom)}
@media(max-width:768px){.bottom-nav{display:flex;justify-content:space-around;align-items:center}}
.bottom-nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;color:#555;font-size:.6rem;cursor:pointer;transition:color .2s}
.bottom-nav-item.active{color:#dc2626}

/* Registration buttons */
.reg-btn{padding:6px 12px;border-radius:6px;font-size:.7rem;font-weight:700;cursor:pointer;transition:all .2s;border:1px solid #2a2a2a;background:#1a1a1a;color:#ccc;text-transform:uppercase;letter-spacing:.5px}
.reg-btn:hover{border-color:#dc2626;color:#dc2626;transform:scale(1.03)}
.reg-btn:active{transform:scale(.95)}
.reg-btn.recorded{background:rgba(220,38,38,.15);border-color:#dc2626;color:#dc2626}

/* Status indicators */
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.status-high{background:#22c55e;box-shadow:0 0 6px #22c55e}
.status-mid{background:#eab308;box-shadow:0 0 6px #eab308}
.status-low{background:#ef4444;box-shadow:0 0 6px #ef4444}

/* Sync indicator */
.sync-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.sync-on{background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.5);animation:pulse 2s infinite}
.sync-sav{background:#eab308;box-shadow:0 0 8px rgba(234,179,8,.5);animation:pulse 1s infinite}
.sync-off{background:#ef4444;box-shadow:0 0 8px rgba(239,68,68,.5)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Live mode */
.live-mode{position:fixed;inset:0;z-index:6000;background:#050505;overflow-y:auto}

/* Print styles */
@media print{.no-print{display:none!important}.print-only{display:block!important}}

/* Undo float */
.undo-float{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:5500;background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;padding:12px 24px;border-radius:50px;font-size:.8rem;font-weight:700;cursor:pointer;box-shadow:0 4px 20px rgba(220,38,38,.4);animation:undoIn .3s}
@keyframes undoIn{0%{opacity:0;transform:translateX(-50%)translateY(20px)}100%{opacity:1;transform:translateX(-50%)translateY(0)}}

/* Calendar */
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #1a1a1a;border-radius:6px;cursor:pointer;transition:all .2s;font-size:.8rem;position:relative}
.cal-day:hover{border-color:#dc2626}
.cal-day.today{border-color:#dc2626;background:rgba(220,38,38,.1)}
.cal-day.has-activity::after{content:'';position:absolute;bottom:4px;width:6px;height:6px;border-radius:50%;background:#dc2626}

/* Chart container responsive */
.chart-wrap{position:relative;width:100%;max-width:100%}
.chart-wrap canvas{max-width:100%!important}

/* Floating action button */
.fab{position:fixed;bottom:80px;right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;border:none;font-size:1.5rem;cursor:pointer;box-shadow:0 4px 20px rgba(220,38,38,.4);z-index:3000;transition:all .3s;display:flex;align-items:center;justify-content:center}
.fab:hover{transform:scale(1.1)}
@media(min-width:769px){.fab{bottom:30px}}

.hamburger{display:none;cursor:pointer;padding:8px;z-index:5001}
@media(max-width:768px){.hamburger{display:block}}

/* Participation bar */
.part-bar{height:6px;border-radius:3px;background:#1a1a1a;overflow:hidden;flex:1}
.part-bar-fill{height:100%;border-radius:3px;transition:width .5s}
</style>

<script>
// Inicializar Firebase
const firebaseConfig={apiKey:"AIzaSyCDmWUBk7bpTI-sIEYqHn_sTCaYTSuekLA",authDomain:"celulakmt.firebaseapp.com",databaseURL:"https://celulakmt-default-rtdb.firebaseio.com",projectId:"celulakmt",storageBucket:"celulakmt.firebasestorage.app",messagingSenderId:"623088700057",appId:"1:623088700057:web:fffb8fccbae5ff6d834608",measurementId:"G-CY1HY229XX"};
firebase.initializeApp(firebaseConfig);
let firebaseUid=null;
firebase.auth().signInAnonymously().then(cred=>{firebaseUid=cred.user.uid;console.log('Firebase auth OK:',firebaseUid)}).catch(e=>console.warn('Auth error:',e));
const dbRef=firebase.database().ref('klis123');

// Chart.js defaults
Chart.defaults.color='#888';

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo,createContext,useContext}=React;

// ============ CONTEXTO GLOBAL ============
const AppContext=createContext();
const useApp=()=>useContext(AppContext);

const DEFAULT_BUTTONS=['Participó','Expuso','Entregó tarea','Respondió','Leyó','Investigó','Presentó trabajo'];
const STORAGE_PREFIX='klis123_';

// Utilidades
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const now=()=>{const d=new Date();return{date:d.toISOString().split('T')[0],time:d.toTimeString().slice(0,8),timestamp:d.getTime()}};
const loadLocal=(key,fallback)=>{try{const v=localStorage.getItem(STORAGE_PREFIX+key);return v?JSON.parse(v):fallback}catch{return fallback}};
const saveLocal=(key,val)=>{try{localStorage.setItem(STORAGE_PREFIX+key,JSON.stringify(val))}catch{}};

// Proveedor de datos
function AppProvider({children}){
  const [courses,setCourses]=useState(()=>loadLocal('courses',[]));
  const [students,setStudents]=useState(()=>loadLocal('students',[]));
  const [records,setRecords]=useState(()=>loadLocal('records',[]));
  const [observations,setObservations]=useState(()=>loadLocal('observations',[]));
  const [customButtons,setCustomButtons]=useState(()=>loadLocal('customButtons',[]));
  const [settings,setSettings]=useState(()=>loadLocal('settings',{teacherName:'',secondaryColor:'#dc2626',animations:true,sound:false,fontSize:14}));
  const [syncStatus,setSyncStatus]=useState('offline');
  const [undoStack,setUndoStack]=useState([]);

  // Persistir en localStorage
  useEffect(()=>{saveLocal('courses',courses)},[courses]);
  useEffect(()=>{saveLocal('students',students)},[students]);
  useEffect(()=>{saveLocal('records',records)},[records]);
  useEffect(()=>{saveLocal('observations',observations)},[observations]);
  useEffect(()=>{saveLocal('customButtons',customButtons)},[customButtons]);
  useEffect(()=>{saveLocal('settings',settings)},[settings]);

  // Sincronizar con Firebase
  useEffect(()=>{
    if(!firebaseUid)return;
    setSyncStatus('saving');
    const data={courses,students,records,observations,customButtons,settings,updatedAt:Date.now()};
    dbRef.child('data').set(data).then(()=>setSyncStatus('synced')).catch(()=>setSyncStatus('error'));
  },[courses,students,records,observations,customButtons,settings]);

  // Cargar desde Firebase al inicio
  useEffect(()=>{
    if(!firebaseUid)return;
    dbRef.child('data').once('value').then(snap=>{
      const d=snap.val();
      if(d){
        if(d.courses&&d.courses.length)setCourses(d.courses);
        if(d.students&&d.students.length)setStudents(d.students);
        if(d.records&&d.records.length)setRecords(d.records);
        if(d.observations&&d.observations.length)setObservations(d.observations);
        if(d.customButtons&&d.customButtons.length)setCustomButtons(d.customButtons);
        if(d.settings)setSettings(s=>({...s,...d.settings}));
        setSyncStatus('synced');
      }
    }).catch(()=>setSyncStatus('error'));
  },[]);

  // Operaciones CRUD
  const addCourse=c=>setCourses(p=>[...p,{...c,id:uid(),createdAt:Date.now()}]);
  const updateCourse=(id,data)=>setCourses(p=>p.map(c=>c.id===id?{...c,...data}:c));
  const deleteCourse=id=>{setCourses(p=>p.filter(c=>c.id!==id));setStudents(p=>p.filter(s=>s.courseId!==id));setRecords(p=>p.filter(r=>r.courseId!==id));setObservations(p=>p.filter(o=>o.courseId!==id))};
  const duplicateCourse=id=>{const c=courses.find(x=>x.id===id);if(!c)return;const nc={...c,id:uid(),name:c.name+' (copia)',createdAt:Date.now()};setCourses(p=>[...p,nc]);const ss=students.filter(s=>s.courseId===id).map(s=>({...s,id:uid(),courseId:nc.id}));setStudents(p=>[...p,...ss])};

  const addStudent=s=>setStudents(p=>[...p,{...s,id:uid(),createdAt:Date.now()}]);
  const updateStudent=(id,data)=>setStudents(p=>p.map(s=>s.id===id?{...s,...data}:s));
  const deleteStudent=id=>{setStudents(p=>p.filter(s=>s.id!==id));setRecords(p=>p.filter(r=>r.studentId!==id));setObservations(p=>p.filter(o=>o.studentId!==id))};

  const addRecord=(r,skipUndo)=>{
    // Anti duplicado
    const{timestamp}=now();
    const isDup=records.some(x=>x.studentId===r.studentId&&x.courseId===r.courseId&&x.type===r.type&&Math.abs(x.timestamp-timestamp)<5000);
    if(isDup)return'duplicate';
    const rec={...r,id:uid(),...now()};
    setRecords(p=>[...p,rec]);
    if(!skipUndo)setUndoStack(p=>[...p,{type:'addRecord',id:rec.id}]);
    return rec.id;
  };
  const deleteRecord=id=>{const rec=records.find(r=>r.id===id);if(rec)setUndoStack(p=>[...p,{type:'deleteRecord',data:rec}]);setRecords(p=>p.filter(r=>r.id!==id))};
  const undoLast=()=>{if(!undoStack.length)return;const last=undoStack[undoStack.length-1];setUndoStack(p=>p.slice(0,-1));if(last.type==='addRecord'){setRecords(p=>p.filter(r=>r.id!==last.id))}else if(last.type==='deleteRecord'){setRecords(p=>[...p,last.data])}return true};

  const addObservation=o=>setObservations(p=>[...p,{...o,id:uid(),...now()}]);
  const updateObservation=(id,data)=>setObservations(p=>p.map(o=>o.id===id?{...o,...data}:o));
  const deleteObservation=id=>setObservations(p=>p.filter(o=>o.id!==id));

  const addCustomButton=name=>setCustomButtons(p=>[...p,{id:uid(),name}]);
  const removeCustomButton=id=>setCustomButtons(p=>p.filter(b=>b.id!==id));

  const updateSettings=data=>setSettings(p=>({...p,...data}));

  const getStudentRecords=(sid,cid)=>records.filter(r=>r.studentId===sid&&(!cid||r.courseId===cid));
  const getStudentObservations=(sid)=>observations.filter(o=>o.studentId===sid);
  const getCourseStudents=(cid)=>students.filter(s=>s.courseId===cid).sort((a,b)=>(a.listNumber||0)-(b.listNumber||0));
  const getCourseRecords=(cid)=>records.filter(r=>r.courseId===cid);
  const getParticipationCount=(sid,cid)=>records.filter(r=>r.studentId===sid&&r.courseId===cid).length;
  const getParticipationLevel=(sid,cid)=>{const c=getParticipationCount(sid,cid);if(c>=8)return'high';if(c>=3)return'mid';return'low'};

  const value={courses,students,records,observations,customButtons,settings,syncStatus,undoStack,
    addCourse,updateCourse,deleteCourse,duplicateCourse,
    addStudent,updateStudent,deleteStudent,
    addRecord,deleteRecord,undoLast,
    addObservation,updateObservation,deleteObservation,
    addCustomButton,removeCustomButton,updateSettings,
    getStudentRecords,getStudentObservations,getCourseStudents,getCourseRecords,getParticipationCount,getParticipationLevel};
  return <AppContext.Provider value={value}>{children}</AppContext.Provider>
}

// ============ TOAST SYSTEM ============
const ToastContext=createContext();
function ToastProvider({children}){
  const[toasts,setToasts]=useState([]);
  const addToast=(msg,type='success',action=null,duration=4000)=>{
    const id=uid();setToasts(p=>[...p,{id,msg,type,action}]);
    if(duration>0)setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),duration);
  };
  const removeToast=id=>setToasts(p=>p.filter(t=>t.id!==id));
  return <ToastContext.Provider value={{addToast,removeToast}}>
    {children}
    <div className="toast-container">{toasts.map(t=>(
      <div key={t.id} className={`toast toast-${t.type}`}>
        <i className={`fa-solid ${t.type==='success'?'fa-check-circle':t.type==='error'?'fa-exclamation-circle':t.type==='warning'?'fa-triangle-exclamation':'fa-info-circle'}`}></i>
        <span style={{flex:1}}>{t.msg}</span>
        {t.action&&<button onClick={t.action.fn} style={{background:'rgba(255,255,255,.15)',border:'none',color:'#fff',padding:'4px 12px',borderRadius:'4px',cursor:'pointer',fontFamily:'Cinzel',fontWeight:700,fontSize:'.7rem'}}>{t.action.label}</button>}
        <button onClick={()=>removeToast(t.id)} style={{background:'none',border:'none',color:'#888',cursor:'pointer',fontSize:'1rem'}}>&times;</button>
      </div>
    ))}</div>
  </ToastContext.Provider>
}
const useToast=()=>useContext(ToastContext);

// ============ COMPONENTES UI ============

function ConfirmModal({open,title,message,onConfirm,onCancel}){
  if(!open)return null;
  return <div className="modal-overlay" onClick={onCancel}>
    <div className="modal-box" onClick={e=>e.stopPropagation()}>
      <h3 className="font-cinzel text-lg font-bold mb-3" style={{color:'#dc2626'}}>{title||'Confirmar'}</h3>
      <p className="text-sm mb-6" style={{color:'#999'}}>{message||'¿Seguro que deseas continuar?'}</p>
      <div className="flex gap-3 justify-end">
        <button className="btn-ghost" onClick={onCancel}>Cancelar</button>
        <button className="btn-blood" onClick={onConfirm}>Confirmar</button>
      </div>
    </div>
  </div>
}

function FormModal({open,title,onClose,children}){
  if(!open)return null;
  return <div className="modal-overlay" onClick={onClose}>
    <div className="modal-box" onClick={e=>e.stopPropagation()} style={{maxWidth:480}}>
      <div className="flex justify-between items-center mb-5">
        <h3 className="font-cinzel text-lg font-bold" style={{color:'#dc2626'}}>{title}</h3>
        <button onClick={onClose} style={{background:'none',border:'none',color:'#666',cursor:'pointer',fontSize:'1.2rem'}}><i className="fa-solid fa-xmark"/></button>
      </div>
      {children}
    </div>
  </div>
}

function SyncIndicator(){
  const{syncStatus}=useApp();
  const cls=syncStatus==='synced'?'sync-on':syncStatus==='saving'?'sync-sav':'sync-off';
  const lbl=syncStatus==='synced'?'Sincronizado':syncStatus==='saving'?'Guardando':'Sin conexión';
  return <div className="flex items-center gap-2 text-xs" style={{color:'#666'}}><span className={`sync-dot ${cls}`}></span>{lbl}</div>
}

// ============ SPLASH SCREEN ============
function SplashScreen({onDone}){
  const[phase,setPhase]=useState(0);
  useEffect(()=>{
    const t1=setTimeout(()=>setPhase(1),600);
    const t2=setTimeout(()=>setPhase(2),1800);
    const t3=setTimeout(()=>setPhase(3),2800);
    const t4=setTimeout(()=>onDone(),4200);
    return()=>{clearTimeout(t1);clearTimeout(t2);clearTimeout(t3);clearTimeout(t4)}
  },[]);
  const smokes=Array.from({length:6},(_,i)=>i);
  return <div className={`splash-screen ${phase>=3?'hide':''}`}>
    <div className="smoke-container">
      {smokes.map(i=><div key={i} className="smoke" style={{left:`${10+i*16}%`,animationDelay:`${i*1.3}s`,animationDuration:`${6+i}s`}}/>)}
    </div>
    <div style={{position:'relative',zIndex:2,textAlign:'center'}}>
      <div className="glitch-text" data-text="KLIS123" style={{opacity:phase>=0?1:0}}>KLIS123</div>
      <div className="font-gothic subtitle-anim" style={{fontSize:'clamp(2rem,8vw,5rem)',color:'#dc2626',letterSpacing:'6px',opacity:phase>=1?undefined:0}}>CLLASKM</div>
      <div className="tagline-anim font-cinzel" style={{fontSize:'clamp(.7rem,2vw,1rem)',color:'#666',letterSpacing:'4px',textTransform:'uppercase',marginTop:'20px',opacity:phase>=2?undefined:0}}>Control Docente Inteligente</div>
    </div>
  </div>
}

function getCourseStudentsSimple(students,cid){return students.filter(s=>s.courseId===cid).sort((a,b)=>(a.listNumber||0)-(b.listNumber||0))}

// ============ DETALLE DE CURSO ============
function CourseDetail({courseId,setCurrent}){
  const{courses,students,records,observations,customButtons,addStudent,updateStudent,deleteStudent,addRecord,deleteRecord,addObservation,deleteObservation,addCustomButton,removeCustomButton,getParticipationCount,getParticipationLevel}=useApp();
  const{addToast}=useToast();
  const course=courses.find(c=>c.id===courseId);
  const cStudents=getCourseStudentsSimple(students,courseId);
  const[studentModal,setStudentModal]=useState(false);
  const[editStudent,setEditStudent]=useState(null);
  const[form,setForm]=useState({listNumber:'',fullName:'',obs:''});
  const[obsModal,setObsModal]=useState(null);
  const[obsText,setObsText]=useState('');
  const[histModal,setHistModal]=useState(null);
  const[confirmDel,setConfirmDel]=useState({open:false,id:null,type:''});
  const[search,setSearch]=useState('');
  const[filter,setFilter]=useState('all');
  const[liveMode,setLiveMode]=useState(false);
  const[customBtnModal,setCustomBtnModal]=useState(false);
  const[newBtnName,setNewBtnName]=useState('');
  const[undoInfo,setUndoInfo]=useState(null);
  const undoTimer=useRef(null);

  const allButtons=[...DEFAULT_BUTTONS,...customButtons.map(b=>b.name)];

  const filtered=cStudents.filter(s=>{
    if(search&&!s.fullName.toLowerCase().includes(search.toLowerCase()))return false;
    if(filter==='today'){const t=new Date().toISOString().split('T')[0];return records.some(r=>r.studentId===s.id&&r.date===t)}
    if(filter==='week'){const now2=Date.now();return records.some(r=>r.studentId===s.id&&now2-r.timestamp<7*86400000)}
    if(filter==='month'){const now2=Date.now();return records.some(r=>r.studentId===s.id&&now2-r.timestamp<30*86400000)}
    if(filter==='nopart')return getParticipationCount(s.id,courseId)===0;
    if(filter==='obs')return observations.some(o=>o.studentId===s.id);
    if(filter==='low')return getParticipationLevel(s.id,courseId)==='low';
    return true;
  });

  const saveStudent=()=>{
    if(!form.fullName.trim()){addToast('Nombre obligatorio','error');return}
    if(editStudent){updateStudent(editStudent.id,{listNumber:parseInt(form.listNumber)||0,fullName:form.fullName});if(form.obs?.trim())addObservation({studentId:editStudent.id,courseId,obsType:'initial',text:form.obs});addToast('Estudiante actualizado','success')}
    else{const sid=addStudent({listNumber:parseInt(form.listNumber)||0,fullName:form.fullName,courseId});if(form.obs?.trim())addObservation({studentId:sid,courseId,obsType:'initial',text:form.obs});addToast('Estudiante agregado','success')}
    setStudentModal(false);
  };

  const handleRecord=(sid,type)=>{
    const result=addRecord({studentId:sid,courseId,type});
    if(result==='duplicate'){addToast('Registro duplicado detectado','warning');return}
    const s=students.find(x=>x.id===sid);
    addToast(`Registro guardado: ${type}`,  'success',
      {label:'DESHACER',fn:()=>{deleteRecord(result);addToast('Registro deshecho','info')}},8000);
    setUndoInfo({id:result,type});
    clearTimeout(undoTimer.current);
    undoTimer.current=setTimeout(()=>setUndoInfo(null),8000);
  };

  const addObs=()=>{
    if(!obsText.trim())return;
    addObservation({studentId:obsModal,courseId,text:obsText});
    setObsText('');setObsModal(null);addToast('Observación guardada','success');
  };

  const addCustBtn=()=>{
    if(!newBtnName.trim())return;
    addCustomButton(newBtnName.trim());
    setNewBtnName('');setCustomBtnModal(false);addToast('Botón personalizado agregado','success');
  };

  const exportCSV=()=>{
    const hdr='Nro,Nombre,'+allButtons.join(',')+',Total\n';
    const rows=cStudents.map(s=>{
      const counts=allButtons.map(b=>records.filter(r=>r.studentId===s.id&&r.courseId===courseId&&r.type===b).length);
      return `${s.listNumber||''},${s.fullName},${counts.join(',')},${getParticipationCount(s.id,courseId)}`
    }).join('\n');
    const blob=new Blob(['\ufeff'+hdr+rows],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${course?.name||'curso'}_registros.csv`;a.click();
    addToast('CSV exportado','success');
  };

  const exportPDF=()=>{
    const{jsPDF}=window.jspdf;
    const doc=new jsPDF();
    doc.setFillColor(10,10,10);doc.rect(0,0,220,300,'F');
    doc.setFont('helvetica','bold');doc.setTextColor(220,38,38);doc.setFontSize(28);
    doc.text('KLIS123',105,25,{align:'center'});
    doc.setFontSize(14);doc.text('CLLASKM',105,35,{align:'center'});
    doc.setFontSize(8);doc.setTextColor(150);doc.text('Control Docente Inteligente',105,42,{align:'center'});
    doc.setDrawColor(220,38,38);doc.line(20,46,190,46);
    doc.setTextColor(200);doc.setFontSize(12);
    doc.text(`${course?.name||'Curso'}`,105,56,{align:'center'});
    doc.setFontSize(8);doc.setTextColor(130);
    doc.text([course?.parallel,course?.level,course?.subject].filter(Boolean).join(' · ')||'',105,63,{align:'center'});
    doc.text(`Fecha: ${new Date().toLocaleDateString()}`,105,69,{align:'center'});

    const tData=cStudents.map(s=>{
      const counts=allButtons.map(b=>records.filter(r=>r.studentId===s.id&&r.courseId===courseId&&r.type===b).length);
      return[s.listNumber||'',s.fullName,...counts,getParticipationCount(s.id,courseId)]
    });
    doc.autoTable({
      startY:76,
      head:[['Nro','Nombre',...allButtons,'Total']],
      body:tData,
      theme:'grid',
      styles:{fillColor:[17,17,17],textColor:[200,200,200],fontSize:7,font:'helvetica',cellPadding:2},
      headStyles:{fillColor:[40,10,10],textColor:[220,38,38],fontStyle:'bold'},
      alternateRowStyles:{fillColor:[22,22,22]},
    });
    doc.save(`KLIS123_${course?.name||'curso'}_reporte.pdf`);
    addToast('PDF exportado','success');
  };

  if(!course)return <div className="card-dark p-8 text-center"><p style={{color:'#555'}}>Curso no encontrado</p><button className="btn-blood mt-4" onClick={()=>setCurrent('courses')}>Volver a Cursos</button></div>;

  // MODO CLASE EN VIVO
  if(liveMode)return <div className="live-mode">
    <div style={{padding:'12px 16px',background:'#0a0a0a',borderBottom:'1px solid #1a1a1a',display:'flex',justifyContent:'space-between',alignItems:'center',position:'sticky',top:0,zIndex:10}}>
      <div><span className="font-cinzel font-bold" style={{color:'#e5e5e5',fontSize:'.9rem'}}>{course.name}</span><span style={{color:'#dc2626',marginLeft:'8px',fontSize:'.7rem',fontWeight:700}}>EN VIVO</span></div>
      <button className="btn-ghost" style={{fontSize:'.7rem',padding:'6px 12px'}} onClick={()=>setLiveMode(false)}><i className="fa-solid fa-xmark" style={{marginRight:'4px'}}/>Salir</button>
    </div>
    <div style={{padding:'12px'}}>
      {cStudents.map(s=>{
        const level=getParticipationLevel(s.id,courseId);
        return <div key={s.id} className="card-dark p-3 mb-2">
          <div className="flex items-center gap-3 mb-2">
            <span className={`status-dot status-${level}`}/>
            <span style={{fontSize:'.85rem',color:'#e5e5e5',fontWeight:600}}>{s.fullName}</span>
            <span className="font-cinzel font-bold" style={{color:'#dc2626',fontSize:'.75rem',marginLeft:'auto'}}>{getParticipationCount(s.id,courseId)}</span>
          </div>
          <div className="flex gap-2 flex-wrap">
            {allButtons.map(b=><button key={b} className="reg-btn" onClick={()=>handleRecord(s.id,b)}>{b}</button>)}
          </div>
        </div>
      })}
    </div>
  </div>;

  return <div>
    <div className="flex items-center gap-3 mb-5 flex-wrap">
      <button className="btn-ghost" onClick={()=>setCurrent('courses')}><i className="fa-solid fa-arrow-left" style={{marginRight:'4px'}}/>Cursos</button>
      <div style={{flex:1}}>
        <h2 className="font-cinzel text-lg font-bold" style={{color:'#e5e5e5'}}>{course.name}</h2>
        <div style={{fontSize:'.7rem',color:'#666'}}>{[course.parallel,course.level,course.subject].filter(Boolean).join(' · ')}</div>
      </div>
      <button className="btn-blood" onClick={()=>setLiveMode(true)}><i className="fa-solid fa-bolt" style={{marginRight:'4px'}}/>Modo en Vivo</button>
    </div>

    {/* Controles */}
    <div className="flex gap-3 mb-4 flex-wrap items-center">
      <button className="btn-blood" onClick={()=>{setForm({listNumber:'',fullName:'',obs:''});setEditStudent(null);setStudentModal(true)}}><i className="fa-solid fa-user-plus" style={{marginRight:'4px'}}/>Agregar Estudiante</button>
      <button className="btn-ghost" onClick={exportPDF}><i className="fa-solid fa-file-pdf" style={{marginRight:'4px'}}/>PDF</button>
      <button className="btn-ghost" onClick={exportCSV}><i className="fa-solid fa-file-csv" style={{marginRight:'4px'}}/>CSV</button>
      <button className="btn-ghost" onClick={()=>setCustomBtnModal(true)}><i className="fa-solid fa-plus" style={{marginRight:'4px'}}/>Botón</button>
    </div>

    {/* Búsqueda y filtros */}
    <div className="flex gap-3 mb-4 flex-wrap">
      <div style={{flex:1,minWidth:'200px',position:'relative'}}>
        <i className="fa-solid fa-search" style={{position:'absolute',left:'12px',top:'50%',transform:'translateY(-50%)',color:'#555',fontSize:'.8rem'}}/>
        <input className="input-dark" style={{paddingLeft:'36px'}} placeholder="Buscar estudiante..." value={search} onChange={e=>setSearch(e.target.value)}/>
      </div>
      <select className="input-dark" style={{width:'auto',minWidth:'140px'}} value={filter} onChange={e=>setFilter(e.target.value)}>
        <option value="all">Todos</option>
        <option value="today">Hoy</option>
        <option value="week">Esta semana</option>
        <option value="month">Este mes</option>
        <option value="nopart">Sin participación</option>
        <option value="obs">Con observaciones</option>
        <option value="low">Baja participación</option>
      </select>
    </div>

    {/* Lista de estudiantes - Escritorio: tabla, Móvil: tarjetas */}
    <div className="hidden md:block">
      <div className="card-dark overflow-x-auto">
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead>
            <tr style={{borderBottom:'1px solid #222'}}>
              <th style={{padding:'10px 12px',textAlign:'left',fontSize:'.65rem',color:'#666',textTransform:'uppercase',letterSpacing:'1px'}}>Nro</th>
              <th style={{padding:'10px 12px',textAlign:'left',fontSize:'.65rem',color:'#666',textTransform:'uppercase',letterSpacing:'1px'}}>Nombre</th>
              <th style={{padding:'10px 12px',textAlign:'left',fontSize:'.65rem',color:'#666',textTransform:'uppercase',letterSpacing:'1px'}}>Estado</th>
              <th style={{padding:'10px 12px',textAlign:'left',fontSize:'.65rem',color:'#666',textTransform:'uppercase',letterSpacing:'1px'}}>Part.</th>
              <th style={{padding:'10px 12px',textAlign:'left',fontSize:'.65rem',color:'#666',textTransform:'uppercase',letterSpacing:'1px'}}>Registros</th>
              <th style={{padding:'10px 12px',textAlign:'center',fontSize:'.65rem',color:'#666',textTransform:'uppercase',letterSpacing:'1px'}}>Acciones</th>
            </tr>
          </thead>
          <tbody>
            {filtered.map(s=>{
              const level=getParticipationLevel(s.id,courseId);
              const count=getParticipationCount(s.id,courseId);
              const maxCount=Math.max(1,...cStudents.map(cs=>getParticipationCount(cs.id,courseId)));
              return <tr key={s.id} style={{borderBottom:'1px solid #1a1a1a'}}>
                <td style={{padding:'8px 12px',fontSize:'.8rem',color:'#666'}}>{s.listNumber||'-'}</td>
                <td style={{padding:'8px 12px',fontSize:'.8rem',color:'#e5e5e5',fontWeight:600}}>{s.fullName}</td>
                <td style={{padding:'8px 12px'}}><span className={`status-dot status-${level}`}/></td>
                <td style={{padding:'8px 12px'}}>
                  <div className="flex items-center gap-2">
                    <div className="part-bar"><div className="part-bar-fill" style={{width:`${(count/Math.max(1,maxCount))*100}%`,background:level==='high'?'#22c55e':level==='mid'?'#eab308':'#ef4444'}}/></div>
                    <span className="font-cinzel font-bold" style={{fontSize:'.75rem',color:'#ccc'}}>{count}</span>
                  </div>
                </td>
                <td style={{padding:'8px 12px'}}>
                  <div className="flex gap-1 flex-wrap" style={{maxWidth:'320px'}}>
                    {allButtons.slice(0,4).map(b=><button key={b} className="reg-btn" style={{fontSize:'.6rem',padding:'3px 6px'}} onClick={()=>handleRecord(s.id,b)}>{b}</button>)}
                    {allButtons.length>4&&<button className="reg-btn" style={{fontSize:'.6rem',padding:'3px 6px'}} onClick={()=>setHistModal(s.id)}>+Más</button>}
                  </div>
                </td>
                <td style={{padding:'8px 12px',textAlign:'center'}}>
                  <div className="flex gap-1 justify-center">
                    <button title="Observaciones" style={{background:'none',border:'none',color:'#666',cursor:'pointer',padding:'4px'}} onClick={()=>{setObsModal(s.id);setObsText('')}}><i className="fa-solid fa-comment-dots"/></button>
                    <button title="Historial" style={{background:'none',border:'none',color:'#666',cursor:'pointer',padding:'4px'}} onClick={()=>setHistModal(s.id)}><i className="fa-solid fa-clock-rotate-left"/></button>
                    <button title="Editar" style={{background:'none',border:'none',color:'#666',cursor:'pointer',padding:'4px'}} onClick={()=>{setForm({listNumber:s.listNumber||'',fullName:s.fullName,obs:''});setEditStudent(s);setStudentModal(true)}}><i className="fa-solid fa-pen"/></button>
                    <button title="Eliminar" style={{background:'none',border:'none',color:'#991b1b',cursor:'pointer',padding:'4px'}} onClick={()=>setConfirmDel({open:true,id:s.id,type:'student'})}><i className="fa-solid fa-trash"/></button>
                  </div>
                </td>
              </tr>
            })}
          </tbody>
        </table>
        {filtered.length===0&&<div className="p-8 text-center" style={{color:'#555',fontSize:'.8rem'}}>Sin resultados</div>}
      </div>
    </div>

    {/* Vista móvil: tarjetas */}
    <div className="md:hidden flex flex-col gap-3 mb-24">
      {filtered.map(s=>{
        const level=getParticipationLevel(s.id,courseId);
        const count=getParticipationCount(s.id,courseId);
        return <div key={s.id} className="card-dark p-4">
          <div className="flex items-center gap-3 mb-3">
            <span className={`status-dot status-${level}`}/>
            <span style={{flex:1,fontWeight:700,fontSize:'.85rem',color:'#e5e5e5'}}>{s.fullName}</span>
            <span className="font-cinzel font-bold" style={{color:'#dc2626',fontSize:'.85rem'}}>{count}</span>
          </div>
          <div className="flex gap-1.5 flex-wrap mb-2">
            {allButtons.map(b=><button key={b} className="reg-btn" style={{fontSize:'.6rem',padding:'5px 8px'}} onClick={()=>handleRecord(s.id,b)}>{b}</button>)}
          </div>
          <div className="flex gap-2 mt-2">
            <button className="btn-ghost" style={{fontSize:'.6rem',padding:'4px 8px'}} onClick={()=>{setObsModal(s.id);setObsText('')}}><i className="fa-solid fa-comment-dots" style={{marginRight:'2px'}}/>Obs</button>
            <button className="btn-ghost" style={{fontSize:'.6rem',padding:'4px 8px'}} onClick={()=>setHistModal(s.id)}><i className="fa-solid fa-clock-rotate-left" style={{marginRight:'2px'}}/>Hist</button>
            <button className="btn-ghost" style={{fontSize:'.6rem',padding:'4px 8px'}} onClick={()=>{setForm({listNumber:s.listNumber||'',fullName:s.fullName,obs:''});setEditStudent(s);setStudentModal(true)}}><i className="fa-solid fa-pen" style={{marginRight:'2px'}}/>Edit</button>
            <button className="btn-ghost" style={{fontSize:'.6rem',padding:'4px 8px',borderColor:'#991b1b',color:'#ef4444'}} onClick={()=>setConfirmDel({open:true,id:s.id,type:'student'})}><i className="fa-solid fa-trash"/></button>
          </div>
        </div>
      })}
      {filtered.length===0&&<div className="card-dark p-8 text-center" style={{color:'#555'}}>Sin resultados</div>}
    </div>

    {/* Modal: Agregar/Editar estudiante */}
    <FormModal open={studentModal} title={editStudent?'Editar Estudiante':'Agregar Estudiante'} onClose={()=>setStudentModal(false)}>
      <div className="flex flex-col gap-4">
        <div><label style={{fontSize:'.7rem',color:'#888',display:'block',marginBottom:'4px'}}>Numero de lista</label><input className="input-dark" type="number" value={form.listNumber} onChange={e=>setForm(p=>({...p,listNumber:e.target.value}))} placeholder="Ej: 1"/></div>
        <div><label style={{fontSize:'.7rem',color:'#888',display:'block',marginBottom:'4px'}}>Nombre completo</label><input className="input-dark" value={form.fullName} onChange={e=>setForm(p=>({...p,fullName:e.target.value}))} placeholder="Ej: Juan Pérez"/></div>
        <div><label style={{fontSize:'.7rem',color:'#888',display:'block',marginBottom:'4px'}}>Observación inicial (opcional)</label><textarea className="input-dark" rows="2" value={form.obs} onChange={e=>setForm(p=>({...p,obs:e.target.value}))} placeholder="Observación..."/></div>
        <button className="btn-blood w-full" onClick={saveStudent}>{editStudent?'Guardar':'Agregar'}</button>
      </div>
    </FormModal>

    {/* Modal: Observaciones */}
    <FormModal open={!!obsModal} title="Observaciones" onClose={()=>setObsModal(null)}>
      <div className="mb-4">
        <textarea className="input-dark" rows="3" value={obsText} onChange={e=>setObsText(e.target.value)} placeholder="Escribir observación..."/>
        <button className="btn-blood w-full mt-2" onClick={addObs}>Guardar Observación</button>
      </div>
      <div style={{maxHeight:'200px',overflowY:'auto'}}>
        {observations.filter(o=>o.studentId===obsModal).map(o=>(
          <div key={o.id} style={{padding:'8px 0',borderBottom:'1px solid #1a1a1a'}}>
            <div className="flex justify-between items-start">
              <span style={{fontSize:'.8rem',color:'#ccc',flex:1}}>{o.text}</span>
              <button style={{background:'none',border:'none',color:'#991b1b',cursor:'pointer',fontSize:'.7rem'}} onClick={()=>{deleteObservation(o.id);addToast('Observación eliminada','info')}}><i className="fa-solid fa-trash"/></button>
            </div>
            <div style={{fontSize:'.6rem',color:'#555',marginTop:'2px'}}>{o.date} {o.time}</div>
          </div>
        ))}
        {observations.filter(o=>o.studentId===obsModal).length===0&&<p style={{color:'#555',fontSize:'.75rem',textAlign:'center',padding:'16px'}}>Sin observaciones</p>}
      </div>
    </FormModal>

    {/* Modal: Historial */}
    <FormModal open={!!histModal} title="Historial de Registros" onClose={()=>setHistModal(null)}>
      <div style={{maxHeight:'400px',overflowY:'auto'}}>
        {(()=>{const sRecs=records.filter(r=>r.studentId===histModal).sort((a,b)=>b.timestamp-a.timestamp);const s=students.find(x=>x.id===histModal);
          return sRecs.length?sRecs.map(r=>(
            <div key={r.id} style={{padding:'8px 0',borderBottom:'1px solid #1a1a1a',display:'flex',alignItems:'center',gap:'8px'}}>
              <span style={{fontSize:'.75rem',color:'#dc2626',fontWeight:700,minWidth:'100px'}}>{r.type}</span>
              <span style={{fontSize:'.7rem',color:'#888',flex:1}}>{r.date} {r.time}</span>
              <button style={{background:'none',border:'none',color:'#991b1b',cursor:'pointer',fontSize:'.7rem'}} onClick={()=>{deleteRecord(r.id);addToast('Registro eliminado','info')}}><i className="fa-solid fa-trash"/></button>
            </div>
          )):<p style={{color:'#555',fontSize:'.75rem',textAlign:'center',padding:'16px'}}>Sin registros</p>
        })()}
      </div>
    </FormModal>

    {/* Modal: Botón personalizado */}
    <FormModal open={customBtnModal} title="Botones de Registro" onClose={()=>setCustomBtnModal(false)}>
      <div className="flex gap-2 mb-4">
        <input className="input-dark" style={{flex:1}} placeholder="Nombre del botón" value={newBtnName} onChange={e=>setNewBtnName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addCustBtn()}/>
        <button className="btn-blood" onClick={addCustBtn}>Agregar</button>
      </div>
      <div style={{fontSize:'.7rem',color:'#666',marginBottom:'8px'}}>Botones predeterminados:</div>
      {DEFAULT_BUTTONS.map(b=><div key={b} style={{padding:'6px 0',fontSize:'.8rem',color:'#888',borderBottom:'1px solid #1a1a1a'}}>{b}</div>)}
      <div style={{fontSize:'.7rem',color:'#666',margin:'8px 0'}}>Botones personalizados:</div>
      {customButtons.map(b=><div key={b.id} className="flex items-center justify-between" style={{padding:'6px 0',borderBottom:'1px solid #1a1a1a'}}>
        <span style={{fontSize:'.8rem',color:'#ccc'}}>{b.name}</span>
        <button style={{background:'none',border:'none',color:'#991b1b',cursor:'pointer'}} onClick={()=>{removeCustomButton(b.id);addToast('Botón eliminado','info')}}><i className="fa-solid fa-trash"/></button>
      </div>)}
    </FormModal>

    <ConfirmModal open={confirmDel.open} title="Eliminar" message="Esta acción no se puede deshacer." onConfirm={()=>{if(confirmDel.type==='student')deleteStudent(confirmDel.id);setConfirmDel({open:false,id:null,type:''});addToast('Eliminado','success')}} onCancel={()=>setConfirmDel({open:false,id:null,type:''})}/>

    {/* Botón deshacer flotante móvil */}
    {undoInfo&&<div className="undo-float" onClick={()=>{deleteRecord(undoInfo.id);setUndoInfo(null);addToast('Registro deshecho','info')}}>DESHACER <i className="fa-solid fa-rotate-left" style={{marginLeft:'6px'}}/></div>}
  </div>
}

// ============ CALENDARIO ============
function CalendarPage(){
  const{records,students}=useApp();
  const[year,setYear]=useState(new Date().getFullYear());
  const[month,setMonth]=useState(new Date().getMonth());
  const[selectedDay,setSelectedDay]=useState(null);

  const daysInMonth=new Date(year,month+1,0).getDate();
  const firstDay=new Date(year,month,1).getDay();
  const monthNames=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const dayNames=['Do','Lu','Ma','Mi','Ju','Vi','Sa'];
  const today=new Date().toISOString().split('T')[0];

  const getRecordsForDay=day=>{
    const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    return records.filter(r=>r.date===dateStr);
  };

  const days=[];
  for(let i=0;i<firstDay;i++)days.push(null);
  for(let d=1;d<=daysInMonth;d++)days.push(d);

  const selectedRecords=selectedDay?getRecordsForDay(selectedDay):[];

  return <div>
    <h2 className="font-cinzel text-xl font-bold mb-6">Calendario</h2>
    <div className="card-dark p-4 md:p-6">
      <div className="flex items-center justify-between mb-4">
        <button className="btn-ghost" onClick={()=>{if(month===0){setMonth(11);setYear(y=>y-1)}else setMonth(m=>m-1)}}><i className="fa-solid fa-chevron-left"/></button>
        <h3 className="font-cinzel font-bold" style={{color:'#e5e5e5'}}>{monthNames[month]} {year}</h3>
        <button className="btn-ghost" onClick={()=>{if(month===11){setMonth(0);setYear(y=>y+1)}else setMonth(m=>m+1)}}><i className="fa-solid fa-chevron-right"/></button>
      </div>
      <div className="grid grid-cols-7 gap-1 mb-2">
        {dayNames.map(d=><div key={d} style={{textAlign:'center',fontSize:'.65rem',color:'#555',padding:'4px'}}>{d}</div>)}
      </div>
      <div className="grid grid-cols-7 gap-1">
        {days.map((d,i)=>{
          if(!d)return <div key={`e${i}`}/>;
          const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          const recs=getRecordsForDay(d);
          const isToday=dateStr===today;
          return <div key={d} className={`cal-day ${isToday?'today':''} ${recs.length?'has-activity':''}`} onClick={()=>setSelectedDay(d)}>
            <span style={{color:isToday?'#dc2626':'#aaa',fontWeight:isToday?700:400}}>{d}</span>
            {recs.length>0&&<span style={{fontSize:'.5rem',color:'#dc2626'}}>{recs.length}</span>}
          </div>
        })}
      </div>
    </div>

    {selectedDay&&<div className="card-dark p-4 mt-4 mb-20">
      <h3 className="font-cinzel font-bold mb-3" style={{color:'#e5e5e5',fontSize:'.9rem'}}>Registros del {selectedDay} de {monthNames[month]}</h3>
      {selectedRecords.length?selectedRecords.map(r=>{
        const s=students.find(x=>x.id===r.studentId);
        return <div key={r.id} className="flex items-center gap-3 py-2" style={{borderBottom:'1px solid #1a1a1a'}}>
          <span style={{fontSize:'.8rem',color:'#ccc',flex:1}}>{s?.fullName||'Estudiante'}</span>
          <span style={{fontSize:'.7rem',color:'#dc2626',fontWeight:700}}>{r.type}</span>
          <span style={{fontSize:'.65rem',color:'#555'}}>{r.time}</span>
        </div>
      }):<p style={{color:'#555',fontSize:'.8rem',textAlign:'center',padding:'12px'}}>Sin registros este día</p>}
    </div>}
  </div>
}

// ============ ESTADÍSTICAS ============
function StatsPage(){
  const{courses,students,records}=useApp();
  const[selectedCourse,setSelectedCourse]=useState('all');
  const chartRef1=useRef(null);const chartRef2=useRef(null);const chartRef3=useRef(null);
  const chart1=useRef(null);const chart2=useRef(null);const chart3=useRef(null);

  const filteredRecords=selectedCourse==='all'?records:records.filter(r=>r.courseId===selectedCourse);
  const filteredStudents=selectedCourse==='all'?students:students.filter(s=>s.courseId===selectedCourse||courses.some(c=>students.filter(st=>st.courseId===c.id).includes(s)));

  // Datos para gráficas
  const rankingData=useMemo(()=>{
    const counts={};
    filteredRecords.forEach(r=>{counts[r.studentId]=(counts[r.studentId]||0)+1});
    return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([sid,c])=>{
      const s=students.find(x=>x.id===sid);
      return{name:s?.fullName||'?',count:c}
    });
  },[filteredRecords,students]);

  const typeData=useMemo(()=>{
    const counts={};
    filteredRecords.forEach(r=>{counts[r.type]=(counts[r.type]||0)+1});
    return Object.entries(counts).map(([type,c])=>({type,count:c}));
  },[filteredRecords]);

  const weeklyData=useMemo(()=>{
    const now2=Date.now();const weeks=[];
    for(let i=6;i>=0;i--){
      const start=now2-(i+1)*7*86400000;const end=now2-i*7*86400000;
      const count=filteredRecords.filter(r=>r.timestamp>=start&&r.timestamp<end).length;
      const d=new Date(start);weeks.push({label:`${d.getDate()}/${d.getMonth()+1}`,count});
    }
    return weeks;
  },[filteredRecords]);

  useEffect(()=>{
    if(chart1.current)chart1.current.destroy();
    if(chart2.current)chart2.current.destroy();
    if(chart3.current)chart3.current.destroy();

    const ctx1=chartRef1.current?.getContext('2d');
    const ctx2=chartRef2.current?.getContext('2d');
    const ctx3=chartRef3.current?.getContext('2d');

    if(ctx1){
      chart1.current=new Chart(ctx1,{type:'bar',data:{labels:rankingData.map(d=>d.name.slice(0,15)),datasets:[{label:'Participaciones',data:rankingData.map(d=>d.count),backgroundColor:'rgba(220,38,38,.7)',borderColor:'#dc2626',borderWidth:1,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{grid:{color:'#1a1a1a'},ticks:{color:'#666',font:{size:10}}},y:{grid:{display:false},ticks:{color:'#999',font:{size:10,family:'Cinzel'}}}}}});
    }
    if(ctx2){
      chart2.current=new Chart(ctx2,{type:'doughnut',data:{labels:typeData.map(d=>d.type),datasets:[{data:typeData.map(d=>d.count),backgroundColor:['#dc2626','#ef4444','#f87171','#991b1b','#7f1d1d','#b91c1c','#fca5a5'],borderColor:'#111',borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#888',font:{size:10,family:'Cinzel'},padding:8}}}}});
    }
    if(ctx3){
      chart3.current=new Chart(ctx3,{type:'line',data:{labels:weeklyData.map(d=>d.label),datasets:[{label:'Registros',data:weeklyData.map(d=>d.count),borderColor:'#dc2626',backgroundColor:'rgba(220,38,38,.1)',fill:true,tension:.4,pointBackgroundColor:'#dc2626',pointRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'#1a1a1a'},ticks:{color:'#666',font:{size:10}}},y:{grid:{color:'#1a1a1a'},ticks:{color:'#666',font:{size:10}},beginAtZero:true}}}});
    }

    return()=>{chart1.current?.destroy();chart2.current?.destroy();chart3.current?.destroy()};
  },[rankingData,typeData,weeklyData]);

  return <div>

// ============ REPORTES ============
function ReportsPage(){
  const{courses,students,records,observations}=useApp();
  const{addToast}=useToast();
  const[selectedCourse,setSelectedCourse]=useState('');

  const exportPDF=()=>{
    const c=courses.find(x=>x.id===selectedCourse);
    if(!c){addToast('Selecciona un curso','error');return}
    const cStudents=getCourseStudentsSimple(students,c.id);
    const cRecords=records.filter(r=>r.courseId===c.id);
    const{jsPDF}=window.jspdf;
    const doc=new jsPDF();

    doc.setFillColor(10,10,10);doc.rect(0,0,220,300,'F');
    doc.setFont('helvetica','bold');doc.setTextColor(220,38,38);doc.setFontSize(28);
    doc.text('KLIS123',105,22,{align:'center'});
    doc.setFontSize(14);doc.text('CLLASKM',105,32,{align:'center'});
    doc.setFontSize(7);doc.setTextColor(150);doc.text('Control Docente Inteligente',105,39,{align:'center'});
    doc.setDrawColor(220,38,38);doc.line(20,43,190,43);
    doc.setTextColor(220);doc.setFontSize(11);doc.text(c.name,105,52,{align:'center'});
    doc.setFontSize(7);doc.setTextColor(130);
    doc.text([c.parallel,c.level,c.subject].filter(Boolean).join(' · '),105,58,{align:'center'});
    doc.text(`Generado: ${new Date().toLocaleString()}`,105,63,{align:'center'});

    const btns=DEFAULT_BUTTONS;
    const tData=cStudents.map(s=>{
      const counts=btns.map(b=>cRecords.filter(r=>r.studentId===s.id&&r.type===b).length);
      const total=counts.reduce((a,b)=>a+b,0);
      const obs=observations.filter(o=>o.studentId===s.id).map(o=>o.text).join('; ');
      return[s.listNumber||'',s.fullName,...counts,total,obs]
    });
    doc.autoTable({
      startY:70,
      head:[['Nro','Nombre',...btns,'Total','Observaciones']],
      body:tData,
      theme:'grid',
      styles:{fillColor:[17,17,17],textColor:[200,200,200],fontSize:6,font:'helvetica',cellPadding:1.5},
      headStyles:{fillColor:[40,10,10],textColor:[220,38,38],fontStyle:'bold',fontSize:5.5},
      alternateRowStyles:{fillColor:[22,22,22]},
      columnStyles:{[btns.length+2]:{fontStyle:'bold',textColor:[220,38,38]}}
    });
    doc.save(`KLIS123_${c.name}_reporte.pdf`);
    addToast('PDF exportado correctamente','success');
  };

  const exportCSV=()=>{
    const c=courses.find(x=>x.id===selectedCourse);
    if(!c){addToast('Selecciona un curso','error');return}
    const cStudents=getCourseStudentsSimple(students,c.id);
    const cRecords=records.filter(r=>r.courseId===c.id);
    const hdr='Nro,Nombre,'+DEFAULT_BUTTONS.join(',')+',Total,Observaciones\n';
    const rows=cStudents.map(s=>{
      const counts=DEFAULT_BUTTONS.map(b=>cRecords.filter(r=>r.studentId===s.id&&r.type===b).length);
      const total=counts.reduce((a,b)=>a+b,0);
      const obs=observations.filter(o=>o.studentId===s.id).map(o=>`"${o.text}"`).join('; ');
      return `${s.listNumber||''},"${s.fullName}",${counts.join(',')},${total},"${obs}"`
    }).join('\n');
    const blob=new Blob(['\ufeff'+hdr+rows],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${c.name}_reporte.csv`;a.click();
    addToast('CSV exportado','success');
  };

  return <div>
    <h2 className="font-cinzel text-xl font-bold mb-6">Reportes</h2>
    <div className="card-dark p-6">
      <div className="mb-4">
        <label style={{fontSize:'.7rem',color:'#888',display:'block',marginBottom:'4px'}}>Seleccionar Curso</label>
        <select className="input-dark" value={selectedCourse} onChange={e=>setSelectedCourse(e.target.value)}>
          <option value="">-- Seleccionar --</option>
          {courses.map(c=><option key={c.id} value={c.id}>{c.name} ({[c.parallel,c.level].filter(Boolean).join(' - ')})</option>)}
        </select>
      </div>
      <div className="flex gap-3 flex-wrap">
        <button className="btn-blood" onClick={exportPDF}><i className="fa-solid fa-file-pdf" style={{marginRight:'6px'}}/>Exportar PDF</button>
        <button className="btn-ghost" onClick={exportCSV}><i className="fa-solid fa-file-csv" style={{marginRight:'6px'}}/>Exportar CSV</button>
      </div>
      {selectedCourse&&(()=>{
        const c=courses.find(x=>x.id===selectedCourse);
        const cStudents=getCourseStudentsSimple(students,selectedCourse);
        const cRecords=records.filter(r=>r.courseId===selectedCourse);
        return <div className="mt-6" style={{borderTop:'1px solid #1a1a1a',paddingTop:'16px'}}>
          <div className="grid gap-3" style={{gridTemplateColumns:'repeat(auto-fit,minmax(120px,1fr))'}}>
            <div style={{textAlign:'center'}}><div style={{fontSize:'.6rem',color:'#666',textTransform:'uppercase'}}>Estudiantes</div><div className="font-cinzel font-bold" style={{color:'#dc2626',fontSize:'1.5rem'}}>{cStudents.length}</div></div>
            <div style={{textAlign:'center'}}><div style={{fontSize:'.6rem',color:'#666',textTransform:'uppercase'}}>Registros</div><div className="font-cinzel font-bold" style={{color:'#22c55e',fontSize:'1.5rem'}}>{cRecords.length}</div></div>
            <div style={{textAlign:'center'}}><div style={{fontSize:'.6rem',color:'#666',textTransform:'uppercase'}}>Promedio</div><div className="font-cinzel font-bold" style={{color:'#3b82f6',fontSize:'1.5rem'}}>{cStudents.length?(cRecords.length/cStudents.length).toFixed(1):'0'}</div></div>
          </div>
        </div>
      })()}
    </div>
  </div>
}

// ============ HISTORIAL ============
function HistoryPage(){
  const{records,students,courses}=useApp();
  const[filterCourse,setFilterCourse]=useState('all');
  const[filterType,setFilterType]=useState('all');
  const[search,setSearch]=useState('');

  const filtered=records.filter(r=>{
    if(filterCourse!=='all'&&r.courseId!==filterCourse)return false;
    if(filterType!=='all'&&r.type!==filterType)return false;
    if(search){const s=students.find(x=>x.id===r.studentId);if(!s||!s.fullName.toLowerCase().includes(search.toLowerCase()))return false}
    return true;
  }).sort((a,b)=>b.timestamp-a.timestamp);

  const types=[...new Set(records.map(r=>r.type))];

  return <div>
    <h2 className="font-cinzel text-xl font-bold mb-6">Historial</h2>
    <div className="flex gap-3 mb-4 flex-wrap">
      <input className="input-dark" style={{flex:1,minWidth:'180px'}} placeholder="Buscar estudiante..." value={search} onChange={e=>setSearch(e.target.value)}/>
      <select className="input-dark" style={{width:'auto'}} value={filterCourse} onChange={e=>setFilterCourse(e.target.value)}>
        <option value="all">Todos los cursos</option>
        {courses.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
      </select>
      <select className="input-dark" style={{width:'auto'}} value={filterType} onChange={e=>setFilterType(e.target.value)}>
        <option value="all">Todos los tipos</option>
        {types.map(t=><option key={t} value={t}>{t}</option>)}
      </select>
    </div>
    <div className="card-dark">
      {filtered.slice(0,50).map(r=>{
        const s=students.find(x=>x.id===r.studentId);
        const c=courses.find(x=>x.id===r.courseId);
        return <div key={r.id} className="flex items-center gap-3 p-3" style={{borderBottom:'1px solid #1a1a1a'}}>
          <span className="status-dot status-high"/>
          <div style={{flex:1}}>
            <div style={{fontSize:'.8rem',color:'#ccc'}}>{s?.fullName||'Estudiante'}</div>
            <div style={{fontSize:'.65rem',color:'#555'}}>{c?.name||'Curso'}</div>
          </div>
          <span style={{fontSize:'.7rem',color:'#dc2626',fontWeight:700}}>{r.type}</span>
          <span style={{fontSize:'.65rem',color:'#555',minWidth:'80px',textAlign:'right'}}>{r.date?.slice(5)} {r.time}</span>
        </div>
      })}
      {filtered.length===0&&<div className="p-8 text-center" style={{color:'#555'}}>Sin registros</div>}
      {filtered.length>50&&<div className="p-3 text-center" style={{color:'#555',fontSize:'.7rem'}}>Mostrando 50 de {filtered.length}</div>}
    </div>
    <div style={{height:'80px'}}/>
  </div>
}

// ============ APP PRINCIPAL ============
function MainApp(){
  const[splashDone,setSplashDone]=useState(false);
  const[page,setPage]=useState('dashboard');
  const[courseId,setCourseId]=useState(null);
  const[sidebarOpen,setSidebarOpen]=useState(false);
  const{undoLast}=useApp();
  const{addToast}=useToast();

  // Atajos de teclado
  useEffect(()=>{
    const handler=e=>{
      if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
      if(e.ctrlKey&&e.key==='z'){e.preventDefault();if(undoLast())addToast('Acción deshecha','info');return}
      if(e.ctrlKey&&e.key==='p'){e.preventDefault();setPage('reports');return}
      if(e.key==='n'){setPage('courses');return}
      if(e.key==='c'&&!e.ctrlKey){setPage('courses');return}
      if(e.key==='r'){setPage('courses');return}
    };
    window.addEventListener('keydown',handler);
    return()=>window.removeEventListener('keydown',handler);
  },[undoLast]);

  const renderPage=()=>{
    switch(page){
      case 'dashboard':return <Dashboard setCurrent={setPage} setCourseId={setCourseId}/>;
      case 'courses':return <CoursesPage setCurrent={setPage} setCourseId={setCourseId}/>;
      case 'courseDetail':return <CourseDetail courseId={courseId} setCurrent={setPage}/>;
      case
