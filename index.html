<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#0d0d0d}::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
body{font-family:'Cinzel',serif;background:#080808;color:#e0e0e0;overflow-x:hidden;min-height:100vh}
.font-gothic{font-family:'UnifrakturMaguntia',serif!important}
.font-cinzel{font-family:'Cinzel',serif!important}

/* ===== SPLASH ===== */
#splash{position:fixed;inset:0;z-index:9999;background:#080808;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s ease,visibility .8s ease}
#splash.done{opacity:0;visibility:hidden;pointer-events:none}
.glitch{font-family:'UnifrakturMaguntia',serif;font-size:clamp(3rem,13vw,8rem);color:#fff;position:relative;opacity:0;animation:glitchIn 1.2s ease-out forwards}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;top:0;left:0;width:100%;height:100%}
.glitch::before{color:#dc2626;animation:g1 .15s infinite;clip-path:inset(0 0 65% 0)}
.glitch::after{color:#440000;animation:g2 .2s infinite;clip-path:inset(65% 0 0 0)}
@keyframes glitchIn{0%{opacity:0;transform:scale(.7);filter:blur(12px)}60%{opacity:.7;transform:scale(1.04);filter:blur(2px)}100%{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes g1{0%,100%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}}
@keyframes g2{0%,100%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}}
.sub-anim{opacity:0;animation:fadeUp .8s ease-out forwards}
.tag-anim{opacity:0;animation:fadeUp .8s ease-out forwards}
@keyframes fadeUp{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}

.smoke{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(220,38,38,.07)0%,transparent 70%);filter:blur(50px);animation:drift 7s infinite ease-out;pointer-events:none}
@keyframes drift{0%{transform:translateY(60vh)scale(.4);opacity:0}25%{opacity:1}100%{transform:translateY(-20vh)scale(1.3);opacity:0}}

/* ===== COMPONENTS ===== */
.card{background:linear-gradient(145deg,#141414,#1a1a1a);border:1px solid #2a2a2a;border-radius:12px;transition:border-color .3s,box-shadow .3s}
.card:hover{border-color:#dc262644;box-shadow:0 0 20px rgba(220,38,38,.06)}
.btn-r{background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;border:none;border-radius:8px;padding:10px 20px;font-family:'Cinzel',serif;font-weight:700;cursor:pointer;transition:all .25s;text-transform:uppercase;letter-spacing:1px;font-size:.78rem}
.btn-r:hover{box-shadow:0 0 28px rgba(220,38,38,.35);transform:translateY(-1px)}
.btn-r:active{transform:scale(.96)}
.btn-g{background:transparent;color:#888;border:1px solid #2e2e2e;border-radius:8px;padding:8px 16px;font-family:'Cinzel',serif;font-weight:600;cursor:pointer;transition:all .25s;font-size:.72rem}
.btn-g:hover{border-color:#dc2626;color:#dc2626}
.inp{background:#111;border:1px solid #2a2a2a;border-radius:8px;padding:10px 14px;color:#e0e0e0;font-family:'Cinzel',serif;font-size:.82rem;width:100%;transition:border-color .3s}
.inp:focus{outline:none;border-color:#dc2626;box-shadow:0 0 0 2px rgba(220,38,38,.12)}
.inp::placeholder{color:#444}

/* Toast */
#toasts{position:fixed;bottom:24px;right:16px;z-index:8888;display:flex;flex-direction:column;gap:8px;max-width:340px;pointer-events:none}
.tst{padding:13px 16px;border-radius:10px;color:#fff;font-size:.78rem;font-weight:600;display:flex;align-items:center;gap:10px;animation:tstIn .35s ease-out;box-shadow:0 6px 25px rgba(0,0,0,.5);pointer-events:auto}
.tst-s{background:linear-gradient(135deg,#166534,#14532d);border:1px solid #22c55e55}
.tst-e{background:linear-gradient(135deg,#991b1b,#7f1d1d);border:1px solid #ef444455}
.tst-w{background:linear-gradient(135deg,#713f12,#612f0c);border:1px solid #f59e0b55}
.tst-i{background:linear-gradient(135deg,#1e3a5f,#172554);border:1px solid #3b82f655}
@keyframes tstIn{0%{opacity:0;transform:translateX(30px)}100%{opacity:1;transform:translateX(0)}}

/* Modal */
.mdl-bg{position:fixed;inset:0;z-index:7777;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s}
.mdl{background:#131313;border:1px solid #2a2a2a;border-radius:14px;padding:24px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;animation:mdlIn .25s}
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
@keyframes mdlIn{0%{opacity:0;transform:scale(.92)translateY(16px)}100%{opacity:1;transform:scale(1)translateY(0)}}

/* Sidebar */
.sb{position:fixed;left:0;top:0;bottom:0;width:250px;background:#0b0b0b;border-right:1px solid #1a1a1a;z-index:5000;transition:transform .3s;overflow-y:auto;padding-bottom:60px}
@media(max-width:768px){.sb{transform:translateX(-100%);width:280px}.sb.open{transform:translateX(0)}}
.sb-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:4999;display:none}
.sb-ov.open{display:block}

/* Bottom nav */
.bn{display:none;position:fixed;bottom:0;left:0;right:0;background:#0b0b0b;border-top:1px solid #1a1a1a;z-index:4000;padding:5px 0 env(safe-area-inset-bottom)}
@media(max-width:768px){.bn{display:flex;justify-content:space-around;align-items:center}}
.bn-i{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 10px;color:#555;font-size:.55rem;cursor:pointer;transition:color .2s;font-family:'Cinzel',serif}
.bn-i.act{color:#dc2626}

/* Registro btn */
.rb{padding:5px 10px;border-radius:5px;font-size:.65rem;font-weight:700;cursor:pointer;transition:all .2s;border:1px solid #2a2a2a;background:#181818;color:#bbb;text-transform:uppercase;letter-spacing:.5px;font-family:'Cinzel',serif}
.rb:hover{border-color:#dc2626;color:#dc2626;transform:scale(1.03)}
.rb:active{transform:scale(.94)}

/* Status */
.sd{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.sd-h{background:#22c55e;box-shadow:0 0 6px #22c55e88}
.sd-m{background:#eab308;box-shadow:0 0 6px #eab30888}
.sd-l{background:#ef4444;box-shadow:0 0 6px #ef444488}

/* Sync */
.sy{width:9px;height:9px;border-radius:50%;display:inline-block}
.sy-on{background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.5);animation:pls 2s infinite}
.sy-sv{background:#eab308;box-shadow:0 0 8px rgba(234,179,8,.5);animation:pls 1s infinite}
.sy-er{background:#ef4444;box-shadow:0 0 8px rgba(239,68,68,.5)}
@keyframes pls{0%,100%{opacity:1}50%{opacity:.35}}

/* Live mode */
.live{position:fixed;inset:0;z-index:6000;background:#080808;overflow-y:auto}

/* Undo */
.undo-f{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);z-index:5500;background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;padding:11px 22px;border-radius:50px;font-size:.78rem;font-weight:700;cursor:pointer;box-shadow:0 4px 22px rgba(220,38,38,.35);animation:tstIn .3s;font-family:'Cinzel',serif}

/* Cal */
.cd{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #1e1e1e;border-radius:6px;cursor:pointer;transition:all .2s;font-size:.78rem;position:relative;gap:1px}
.cd:hover{border-color:#dc262688}
.cd.td{border-color:#dc2626;background:rgba(220,38,38,.08)}
.cd.ha::after{content:'';position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:#dc2626}

/* Hamburger */
.ham{display:none;cursor:pointer;padding:8px;z-index:5001;color:#999;font-size:1.2rem}
@media(max-width:768px){.ham{display:block}}

.pb{height:5px;border-radius:3px;background:#1a1a1a;overflow:hidden;flex:1}
.pbf{height:100%;border-radius:3px;transition:width .5s}

@media print{.no-print{display:none!important}}
</style>
</head>

<div id="toasts"></div>

<!-- SPLASH -->
<div id="splash">
  <div style="position:absolute;inset:0;overflow:hidden;pointer-events:none" id="smoke-box"></div>
  <div style="position:relative;z-index:2;text-align:center">
    <div class="glitch" data-text="KLIS123" id="gl1">KLIS123</div>
    <div class="font-gothic sub-anim" id="sub1" style="font-size:clamp(2rem,8vw,5rem);color:#dc2626;letter-spacing:6px;opacity:0">CLLASKM</div>
    <div class="tag-anim font-cinzel" id="tag1" style="font-size:clamp(.65rem,1.8vw,.9rem);color:#666;letter-spacing:3px;text-transform:uppercase;margin-top:18px;opacity:0">Control Docente Inteligente</div>
  </div>
</div>

<script>
// Firebase init
const fbConfig={apiKey:"AIzaSyCDmWUBk7bpTI-sIEYqHn_sTCaYTSuekLA",authDomain:"celulakmt.firebaseapp.com",databaseURL:"https://celulakmt-default-rtdb.firebaseio.com",projectId:"celulakmt",storageBucket:"celulakmt.firebasestorage.app",messagingSenderId:"623088700057",appId:"1:623088700057:web:fffb8fccbae5ff6d834608",measurementId:"G-CY1HY229XX"};
firebase.initializeApp(fbConfig);
let fbUid=null;
firebase.auth().signInAnonymously().then(c=>{fbUid=c.user.uid;console.log('FB OK:',fbUid)}).catch(e=>console.warn('FB err:',e));
const dbR=firebase.database().ref('klis123');

// Chart defaults
Chart.defaults.color='#777';Chart.defaults.borderColor='#222';Chart.defaults.font.family='Cinzel';

// Splash smoke + timing
(function(){
  const sb=document.getElementById('smoke-box');
  for(let i=0;i<5;i++){const s=document.createElement('div');s.className='smoke';s.style.cssText=`left:${8+i*18}%;width:${160+i*30}px;height:${160+i*30}px;animation-delay:${i*1.4}s;animation-duration:${5+i}s`;sb.appendChild(s)}
  setTimeout(()=>{const el=document.getElementById('sub1');if(el)el.style.opacity='1'},1400);
  setTimeout(()=>{const el=document.getElementById('tag1');if(el)el.style.opacity='1'},2400);
  setTimeout(()=>{const sp=document.getElementById('splash');if(sp)sp.classList.add('done')},4000);

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo,createContext,useContext}=React;

// ========== CONSTANTES ==========
const DEF_BTNS=['Participo','Expuso','Entrego Tarea','Respondio','Leyo','Investigo','Presento Trabajo'];
const SP='klis123_';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const now=()=>{const d=new Date();return{date:d.toISOString().split('T')[0],time:d.toTimeString().slice(0,8),timestamp:d.getTime()}};
const ll=(k,f)=>{try{const v=localStorage.getItem(SP+k);return v?JSON.parse(v):f}catch{return f}};
const sl=(k,v)=>{try{localStorage.setItem(SP+k,JSON.stringify(v))}catch{}};

// ========== TOAST GLOBAL ==========
function toast(msg,type='s',action=null,dur=4000){
  const c=document.getElementById('toasts');if(!c)return;
  const id=uid();const d=document.createElement('div');
  d.className=`tst tst-${type}`;d.id='t'+id;
  const ic=type==='s'?'fa-check-circle':type==='e'?'fa-circle-exclamation':type==='w'?'fa-triangle-exclamation':'fa-circle-info';
  let h=`<i class="fa-solid ${ic}" style="flex-shrink:0"></i><span style="flex:1">${msg}</span>`;
  if(action)h+=`<button onclick="${action.fn}" style="background:rgba(255,255,255,.12);border:none;color:#fff;padding:3px 10px;border-radius:4px;cursor:pointer;font-family:Cinzel;font-weight:700;font-size:.68rem">${action.label}</button>`;
  h+=`<button onclick="this.parentElement.remove()" style="background:none;border:none;color:#777;cursor:pointer;font-size:1.1rem;margin-left:4px">&times;</button>`;
  d.innerHTML=h;c.appendChild(d);
  if(dur>0)setTimeout(()=>{if(document.getElementById('t'+id))d.remove()},dur);
}

// ========== CONTEXTO ==========
const Ctx=createContext();
const useA=()=>useContext(Ctx);

function Prov({children}){
  const[courses,setCourses]=useState(()=>ll('courses',[]));
  const[students,setStudents]=useState(()=>ll('students',[]));
  const[records,setRecords]=useState(()=>ll('records',[]));
  const[obs,setObs]=useState(()=>ll('obs',[]));
  const[cBtns,setCBtns]=useState(()=>ll('cBtns',[]));
  const[settings,setSettings]=useState(()=>ll('settings',{teacherName:'',fontSize:14}));
  const[syncSt,setSyncSt]=useState('off');
  const[undoSt,setUndoSt]=useState([]);

  useEffect(()=>sl('courses',courses),[courses]);
  useEffect(()=>sl('students',students),[students]);
  useEffect(()=>sl('records',records),[records]);
  useEffect(()=>sl('obs',obs),[obs]);
  useEffect(()=>sl('cBtns',cBtns),[cBtns]);
  useEffect(()=>sl('settings',settings),[settings]);

  // Firebase sync
  useEffect(()=>{
    if(!fbUid)return;
    setSyncSt('sv');
    const data={courses,students,records,obs,cBtns,settings,updatedAt:Date.now()};
    dbR.child('data').set(data).then(()=>setSyncSt('on')).catch(()=>setSyncSt('er'));
  },[courses,students,records,obs,cBtns,settings]);

  useEffect(()=>{
    if(!fbUid)return;
    dbR.child('data').once('value').then(snap=>{
      const d=snap.val();if(!d)return;
      if(d.courses?.length)setCourses(d.courses);
      if(d.students?.length)setStudents(d.students);
      if(d.records?.length)setRecords(d.records);
      if(d.obs?.length)setObs(d.obs);
      if(d.cBtns?.length)setCBtns(d.cBtns);
      if(d.settings)setSettings(p=>({...p,...d.settings}));
      setSyncSt('on');
    }).catch(()=>setSyncSt('er'));
  },[]);

  const addCourse=c=>setCourses(p=>[...p,{...c,id:uid(),createdAt:Date.now()}]);
  const updCourse=(id,d)=>setCourses(p=>p.map(c=>c.id===id?{...c,...d}:c));
  const delCourse=id=>{setCourses(p=>p.filter(c=>c.id!==id));setStudents(p=>p.filter(s=>s.courseId!==id));setRecords(p=>p.filter(r=>r.courseId!==id));setObs(p=>p.filter(o=>o.courseId!==id))};
  const dupCourse=id=>{const c=courses.find(x=>x.id===id);if(!c)return;const nc={...c,id:uid(),name:c.name+' (copia)',createdAt:Date.now()};setCourses(p=>[...p,nc]);const ss=students.filter(s=>s.courseId===id).map(s=>({...s,id:uid(),courseId:nc.id}));setStudents(p=>[...p,...ss])};

  const addStud=s=>{const id=uid();setStudents(p=>[...p,{...s,id,createdAt:Date.now()}]);return id};
  const updStud=(id,d)=>setStudents(p=>p.map(s=>s.id===id?{...s,...d}:s));
  const delStud=id=>{setStudents(p=>p.filter(s=>s.id!==id));setRecords(p=>p.filter(r=>r.studentId!==id));setObs(p=>p.filter(o=>o.studentId!==id))};

  const addRec=r=>{
    const t=Date.now();
    if(records.some(x=>x.studentId===r.studentId&&x.courseId===r.courseId&&x.type===r.type&&Math.abs(x.timestamp-t)<5000))return'dup';
    const rec={...r,id:uid(),...now()};
    setRecords(p=>[...p,rec]);
    setUndoSt(p=>[...p,{type:'add',id:rec.id}]);
    return rec.id;
  };
  const delRec=id=>{const rec=records.find(r=>r.id===id);if(rec)setUndoSt(p=>[...p,{type:'del',data:rec}]);setRecords(p=>p.filter(r=>r.id!==id))};
  const undoLast=()=>{if(!undoSt.length)return false;const last=undoSt[undoSt.length-1];setUndoSt(p=>p.slice(0,-1));if(last.type==='add')setRecords(p=>p.filter(r=>r.id!==last.id));else if(last.type==='del')setRecords(p=>[...p,last.data]);return true};

  const addObs=o=>setObs(p=>[...p,{...o,id:uid(),...now()}]);
  const delObs=id=>setObs(p=>p.filter(o=>o.id!==id));

  const addCBtn=n=>setCBtns(p=>[...p,{id:uid(),name:n}]);
  const rmCBtn=id=>setCBtns(p=>p.filter(b=>b.id!==id));
  const updSet=d=>setSettings(p=>({...p,...d}));

  const cStuds=cid=>students.filter(s=>s.courseId===cid).sort((a,b)=>(a.listNumber||0)-(b.listNumber||0));
  const partCnt=(sid,cid)=>records.filter(r=>r.studentId===sid&&r.courseId===cid).length;
  const partLvl=(sid,cid)=>{const c=partCnt(sid,cid);return c>=8?'h':c>=3?'m':'l'};

  const val={courses,students,records,obs,cBtns,settings,syncSt,undoSt,
    addCourse,updCourse,delCourse,dupCourse,addStud,updStud,delStud,
    addRec,delRec,undoLast,addObs,delObs,addCBtn,rmCBtn,updSet,cStuds,partCnt,partLvl};
  return <Ctx.Provider value={val}>{children}</Ctx.Provider>
}

// ========== CONFIRM MODAL ==========
function Cfm({open,title,msg,onOk,onNo}){
  if(!open)return null;
  return <div className="mdl-bg" onClick={onNo}>
    <div className="mdl" onClick={e=>e.stopPropagation()}>
      <h3 className="font-cinzel" style={{fontSize:'1rem',fontWeight:700,color:'#dc2626',marginBottom:10}}>{title||'Confirmar'}</h3>
      <p style={{fontSize:'.8rem',color:'#999',marginBottom:20}}>{msg||'Deseas continuar?'}</p>
      <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
        <button className="btn-g" onClick={onNo}>Cancelar</button>
        <button className="btn-r" onClick={onOk}>Confirmar</button>
      </div>
    </div>
  </div>
}

// ========== FORM MODAL ==========
function Fm({open,title,onClose,children}){
  if(!open)return null;
  return <div className="mdl-bg" onClick={onClose}>
    <div className="mdl" onClick={e=>e.stopPropagation()}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <h3 className="font-cinzel" style={{fontSize:'1rem',fontWeight:700,color:'#dc2626'}}>{title}</h3>
        <button onClick={onClose} style={{background:'none',border:'none',color:'#666',cursor:'pointer',fontSize:'1.2rem'}}><i className="fa-solid fa-xmark"/></button>
      </div>
      {children}
    </div>
  </div>
}

// ========== SYNC INDICATOR ==========
function SyncInd(){
  const{syncSt}=useA();
  const cls=syncSt==='on'?'sy-on':syncSt==='sv'?'sy-sv':'sy-er';
  const lbl=syncSt==='on'?'Sincronizado':syncSt==='sv'?'Guardando':'Sin conexion';
  return <div style={{display:'flex',alignItems:'center',gap:6,fontSize:'.65rem',color:'#555'}}><span className={`sy ${cls}`}/>{lbl}</div>
}

// ========== SIDEBAR ==========
function Sidebar({page,setPage,open,setOpen}){
  const{settings}=useA();
  const items=[
    {id:'dashboard',ic:'fa-gauge-high',lb:'Dashboard'},
    {id:'courses',ic:'fa-book-open',lb:'Cursos'},
    {id:'calendar',ic:'fa-calendar-days',lb:'Calendario'},
    {id:'stats',ic:'fa-chart-bar',lb:'Estadisticas'},
    {id:'reports',ic:'fa-file-export',lb:'Reportes'},
    {id:'history',ic:'fa-clock-rotate-left',lb:'Historial'},
    {id:'settings',ic:'fa-gear',lb:'Configuracion'},
  ];
  return <>
    <div className={`sb-ov ${open?'open':''}`} onClick={()=>setOpen(false)}/>
    <aside className={`sb ${open?'open':''}`}>
      <div style={{padding:'18px 14px',borderBottom:'1px solid #1a1a1a'}}>
        <div className="font-gothic" style={{fontSize:'1.5rem',color:'#fff'}}>KLIS123</div>
        <div className="font-gothic" style={{fontSize:'.85rem',color:'#dc2626',letterSpacing:3}}>CLLASKM</div>
        <div style={{fontSize:'.5rem',color:'#444',letterSpacing:2,textTransform:'uppercase',marginTop:3}}>Control Docente Inteligente</div>
      </div>
      <nav style={{padding:'10px 6px'}}>
        {items.map(it=>(
          <div key={it.id} onClick={()=>{setPage(it.id);setOpen(false)}}
            style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderRadius:7,cursor:'pointer',transition:'all .2s',
              background:page===it.id?'rgba(220,38,38,.08)':'transparent',

        const cr=records.filter(r=>r.courseId===c.id);
        const lr=cr.length?cr[cr.length-1]:null;
        return <div key={c.id} className="card" style={{padding:14,cursor:'pointer'}} onClick={()=>{setCid(c.id);setPage('courseDetail')}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:6}}>
            <div><div className="font-cinzel" style={{fontSize:'.88rem',fontWeight:700,color:'#e0e0e0'}}>{c.name}</div>
            <div style={{fontSize:'.62rem',color:'#555'}}>{[c.parallel,c.level,c.subject].filter(Boolean).join(' · ')}</div></div>

    {top.length>0&&<div style={{marginBottom:24}}>

      <div className="card" style={{padding:14}}>
        {top.map((s,i)=>(
          <div key={s.id} style={{display:'flex',alignItems:'center',gap:10,padding:'7px 0',borderBottom:i<top.length-1?'1px solid #1a1a1a':'none'}}>

          <div key={r.id} style={{display:'flex',alignItems:'center',gap:8,padding:'5px 0',borderBottom:'1px solid #1a1a1a'}}>
            <span className="sd sd-h"/><span style={{flex:1,fontSize:'.72rem',color:'#bbb'}}>{s?.fullName||'Estudiante'}</span>
            <span style={{fontSize:'.62rem',color:'#dc2626',fontWeight:700}}>{r.type}</span>
            <span style={{fontSize:'.56rem',color:'#444'}}>{r.date?.slice(5)}</span>
          </div>
        )})}
      </div>
    </div>}

    {alerts.length>0&&<div>
      <h2 className="font-cinzel" style={{fontSize:'.8rem',fontWeight:700,color:'#777',letterSpacing:2,textTransform:'uppercase',marginBottom:10}}>Alertas Academicas</h2>
      <div className="card" style={{padding:14}}>
        {alerts.map(s=>(
          <div key={s.id} style={{display:'flex',alignItems:'center',gap:8,padding:'5px 0',borderBottom:'1px solid #1a1a1a'}}>
            <span className="sd sd-l"/><span style={{flex:1,fontSize:'.72rem',color:'#bbb'}}>{s.fullName}</span>
            <span style={{fontSize:'.58rem',color:'#ef4444'}}>Baja participacion</span>
          </div>
        ))}
      </div>
    </div>}
  </div>
}

// ========== CURSOS PAGE ==========
function CoursesPage({setPage,setCid}){
  const{courses,addCourse,updCourse,delCourse,dupCourse}=useA();
  const[mOpen,setMOpen]=useState(false);
  const[edit,setEdit]=useState(null);
  const[fm,setFm]=useState({name:'',parallel:'',level:'',subject:''});
  const[cfm,setCfm]=useState({open:false,id:null});

  const openNew=()=>{setFm({name:'',parallel:'',level:'',subject:''});setEdit(null);setMOpen(true)};
  const openEd=c=>{setFm({name:c.name,parallel:c.parallel||'',level:c.level||'',subject:c.subject||''});setEdit(c);setMOpen(true)};
  const save=()=>{
    if(!fm.name.trim()){toast('Nombre obligatorio','e');return}
    if(edit){updCourse(edit.id,fm);toast('Curso actualizado')}
    else{addCourse(fm);toast('Curso creado')}
    setMOpen(false);
  };

  return <div style={{paddingBottom:80}}>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:18,flexWrap:'wrap',gap:8}}>
      <h2 className="font-cinzel" style={{fontSize:'1.15rem',fontWeight:700}}>Cursos</h2>
      <button id="btn-nc" className="btn-r" onClick={openNew}><i className="fa-solid fa-plus" style={{marginRight:5}}/>Nuevo Curso</button>
    </div>
    {courses.length===0?<div className="card" style={{padding:40,textAlign:'center'}}>
      <i className="fa-solid fa-book-open" style={{fontSize:'2.5rem',color:'#222',marginBottom:10}}/>
      <p style={{color:'#444',fontSize:'.82rem'}}>Sin cursos</p>
    </div>:<div style={{display:'grid',gap:12,gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))'}}>
      {courses.map(c=>(
        <div key={c.id} className="card" style={{padding:16}}>
          <div style={{cursor:'pointer',marginBottom:10}} onClick={()=>{setCid(c.id);setPage('courseDetail')}}>
            <div className="font-cinzel" style={{fontWeight:700,color:'#e0e0e0',fontSize:'.9rem'}}>{c.name}</div>
            <div style={{fontSize:'.65rem',color:'#555',marginTop:2}}>{[c.parallel,c.level,c.subject].filter(Boolean).join(' · ')}</div>
          </div>
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            <button className="btn-g" style={{fontSize:'.6rem',padding:'4px 8px'}} onClick={()=>openEd(c)}><i className="fa-solid fa-pen" style={{marginRight:2}}/>Editar</button>
            <button className="btn-g" style={{fontSize:'.6rem',padding:'4px 8px'}} onClick={()=>{dupCourse(c.id);toast('Curso duplicado')}}><i className="fa-solid fa-copy" style={{marginRight:2}}/>Duplicar</button>
            <button className="btn-g" style={{fontSize:'.6rem',padding:'4px 8px',borderColor:'#991b1b',color:'#ef4444'}} onClick={()=>setCfm({open:true,id:c.id})}><i className="fa-solid fa-trash" style={{marginRight:2}}/>Eliminar</button>
          </div>
        </div>
      ))}
    </div>}
    <Fm open={mOpen} title={edit?'Editar Curso':'Nuevo Curso'} onClose={()=>setMOpen(false)}>
      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        <div><label style={{fontSize:'.66rem',color:'#777',display:'block',marginBottom:3}}>Nombre</label><input className="inp" value={fm.name} onChange={e=>setFm(p=>({...p,name:e.target.value}))} placeholder="Ej: Historia"/></div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
          <div><label style={{fontSize:'.66rem',color:'#777',display:'block',marginBottom:3}}>Paralelo</label><input className="inp" value={fm.parallel} onChange={e=>setFm(p=>({...p,parallel:e.target.value}))} placeholder="Ej: B"/></div>
          <div><label style={{fontSize:'.66rem',color:'#777',display:'block',marginBottom:3}}>Nivel</label><input className="inp" value={fm.level} onChange={e=>setFm(p=>({...p,level:e.target.value}))} placeholder="Ej: 4to Secundaria"/></div>
        </div>
        <div><label style={{fontSize:'.66rem',color:'#777',display:'block',marginBottom:3}}>Materia</label><input className="inp" value={fm.subject} onChange={e=>setFm(p=>({...p,subject:e.target.value}))} placeholder="Ej: Ciencias Sociales"/></div>
        <button className="btn-r" style={{width:'100%',marginTop:4}} onClick={save}>{edit?'Guardar':'Crear Curso'}</button>
      </div>
    </Fm>
    <Cfm open={cfm.open} title="Eliminar Curso" msg="Se eliminaran estudiantes, registros y observaciones." onOk={()=>{delCourse(cfm.id);setCfm({open:false,id:null});toast('Curso eliminado')}} onNo={()=>setCfm({open:false,id:null})}/>
  </div>
}

// ========== COURSE DETAIL ==========
function CourseDetail({courseId,setPage}){
  const{courses,students,records,obs,cBtns,addStud,updStud,delStud,addRec,delRec,addObs,delObs,addCBtn,rmCBtn,partCnt,partLvl}=useA();
  const course=courses.find(c=>c.id===courseId);
  const cSt=students.filter(s=>s.courseId===courseId).sort((a,b)=>(a.listNumber||0)-(b.listNumber||0));
  const[stModal,setStModal]=useState(false);
  const[editSt,setEditSt]=useState(null);
  const[fm,setFm]=useState({listNumber:'',fullName:'',obstxt:''});
  const[obsMo,setObsMo]=useState(null);
  const[obsTxt,setObsTxt]=useState('');
  const[histMo,setHistMo]=useState(null);
  const[cfmDel,setCfmDel]=useState({open:false,id:null});
  const[search,setSearch]=useState('');
  const[filter,setFilter]=useState('all');
  const[live,setLive]=useState(false);
  const[cbModal,setCbModal]=useState(false);
  const[newBn,setNewBn]=useState('');
  const[undoI,setUndoI]=useState(null);
  const ut=useRef(null);

  const allB=[...DEF_BTNS,...cBtns.map(b=>b.name)];

  const filtered=cSt.filter(s=>{
    if(search&&!s.fullName.toLowerCase().includes(search.toLowerCase()))return false;
    if(filter==='today'){const t=new Date().toISOString().split('T')[0];return records.some(r=>r.studentId===s.id&&r.date===t)}
    if(filter==='week'){const n=Date.now();return records.some(r=>r.studentId===s.id&&n-r.timestamp<604800000)}
    if(filter==='month'){const n=Date.now();return records.some(r=>r.studentId===s.id&&n-r.timestamp<2592000000)}
    if(filter==='nopart')return partCnt(s.id,courseId)===0;
    if(filter==='obs')return obs.some(o=>o.studentId===s.id);
    if(filter==='low')return partLvl(s.id,courseId)==='l';
    return true;
  });

  const saveSt=()=>{
    if(!fm.fullName.trim()){toast('Nombre obligatorio','e');return}
    if(editSt){updStud(editSt.id,{listNumber:parseInt(fm.listNumber)||0,fullName:fm.fullName});if(fm.obstxt?.trim())addObs({studentId:editSt.id,courseId,obsType:'initial',text:fm.obstxt});toast('Estudiante actualizado')}
    else{const sid=addStud({listNumber:parseInt(fm.listNumber)||0,fullName:fm.fullName,courseId});if(fm.obstxt?.trim())addObs({studentId:sid,courseId,obsType:'initial',text:fm.obstxt});toast('Estudiante agregado')}
    setStModal(false);
  };

  const doRec=(sid,type)=>{
    const r=addRec({studentId:sid,courseId,type});
    if(r==='dup'){toast('Registro duplicado detectado','w');return}
    toast(`Registro: ${type}`,'s',{label:'DESHACER',fn:`(function(){document.getElementById('undo-btn').click()})()`},8000);
    setUndoI(r);clearTimeout(ut.current);ut.current=setTimeout(()=>setUndoI(null),8000);
  };

  const doUndo=()=>{if(undoI){delRec(undoI);setUndoI(null);toast('Registro deshecho','i')}};

  const addOb=()=>{if(!obsTxt.trim())return;addObs({studentId:obsMo,courseId,text:obsTxt});setObsTxt('');setObsMo(null);toast('Observacion guardada')};
  const addCb=()=>{if(!newBn.trim())return;addCBtn(newBn.trim());setNewBn('');setCbModal(false);toast('Boton agregado')};

  const expCSV=()=>{
    const hdr='Nro,Nombre,'+allB.join(',')+',Total\n';
    const rows=cSt.map(s=>{const c=allB.map(b=>records.filter(r=>r.studentId===s.id&&r.courseId===courseId&&r.type===b).length);return`${s.listNumber||''},"${s.fullName}",${c.join(',')},${partCnt(s.id,courseId)}`}).join('\n');
    const b=new Blob(['\ufeff'+hdr+rows],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`${course?.name||'curso'}.csv`;a.click();toast('CSV exportado');
  };

  const expPDF=()=>{
    const{jsPDF}=window.jspdf;const doc=new jsPDF();
    doc.setFillColor(10,10,10);doc.rect(0,0,220,300,'F');
    doc.setFont('helvetica','bold');doc.setTextColor(220,38,38);doc.setFontSize(26);doc.text('KLIS123',105,22,{align:'center'});
    doc.setFontSize(13);doc.text('CLLASKM',105,32,{align:'center'});
    doc.setFontSize(7);doc.setTextColor(140);doc.text('Control Docente Inteligente',105,39,{align:'center'});
    doc.setDrawColor(220,38,38);doc.line(20,43,190,43);
    doc.setTextColor(210);doc.setFontSize(11);doc.text(course?.name||'Curso',105,53,{align:'center'});
    doc.setFontSize(7);doc.setTextColor(120);doc.text([course?.parallel,course?.level,course?.subject].filter(Boolean).join(' · ')||'',105,59,{align:'center'});
    doc.text('Fecha: '+new Date().toLocaleDateString(),105,64,{align:'center'});
    const td=cSt.map(s=>{const c=allB.map(b=>records.filter(r=>r.studentId===s.id&&r.courseId===courseId&&r.type===b).length);return[s.listNumber||'',s.fullName,...c,partCnt(s.id,courseId)]});
    doc.autoTable({startY:70,head:[['Nro','Nombre',...allB,'Total']],body:td,theme:'grid',styles:{fillColor:[15,15,15],textColor:[200,200,200],fontSize:6,font:'helvetica',cellPadding:1.5},headStyles:{fillColor:[40,10,10],textColor:[220,38,38],fontStyle:'bold'},alternateRowStyles:{fillColor:[20,20,20]}});
    doc.save(`KLIS123_${course?.name||'curso'}.pdf`);toast('PDF exportado');
  };

  if(!course)return <div className="card" style={{padding:30,textAlign:'center'}}><p style={{color:'#555'}}>Curso no encontrado</p><button className="btn-r" style={{marginTop:12}} onClick={()=>setPage('courses')}>Volver</button></div>;

  // LIVE MODE
  if(live)return <div className="live">
    <div style={{padding:'10px 14px',background:'#0b0b0b',borderBottom:'1px solid #1a1a1a',display:'flex',justifyContent:'space-between',alignItems:'center',position:'sticky',top:0,zIndex:10}}>
      <div><span className="font-cinzel" style={{fontWeight:700,color:'#e0e0e0',fontSize:'.85rem'}}>{course.name}</span><span style={{color:'#dc2626',marginLeft:8,fontSize:'.68rem',fontWeight:700}}>EN VIVO</span></div>
      <button className="btn-g" style={{fontSize:'.65rem',padding:'5px 10px'}} onClick={()=>setLive(false)}><i className="fa-solid fa-xmark" style={{marginRight:3}}/>Salir</button>
    </div>
    <div style={{padding:10}}>
      {cSt.map(s=>{const lv=partLvl(s.id,courseId);return(
        <div key={s.id} className="card" style={{padding:10,marginBottom:8}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
            <span className={`sd sd-${lv}`}/><span style={{fontSize:'.82rem',color:'#e0e0e0',fontWeight:600}}>{s.fullName}</span>
            <span className="font-cinzel" style={{color:'#dc2626',fontSize:'.75rem',fontWeight:700,marginLeft:'auto'}}>{partCnt(s.id,courseId)}</span>
          </div>
          <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>{allB.map(b=><button key={b} className="rb" onClick={()=>doRec(s.id,b)}>{b}</button>)}</div>
        </div>
      )})}
    </div>
  </div>;

  return <div style={{paddingBottom:80}}>
    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16,flexWrap:'wrap'}}>
      <button className="btn-g" onClick={()=>setPage('courses')}><i className="fa-solid fa-arrow-left" style={{marginRight:3}}/>Cursos</button>
      <div style={{flex:1}}>
        <h2 className="font-cinzel" style={{fontSize:'1.05rem',fontWeight:700,color:'#e0e0e0'}}>{course.name}</h2>
        <div style={{fontSize:'.65rem',color:'#555'}}>{[course.parallel,course.level,course.subject].filter(Boolean).join(' · ')}</div>
      </div>
      <button className="btn-r" onClick={()=>setLive(true)}><i className="fa-solid fa-bolt" style={{marginRight:4}}/>En Vivo</button>
    </div>

    <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap'}}>
      <button className="btn-r" style={{fontSize:'.7rem'}} onClick={()=>{setFm({listNumber:'',fullName:'',obstxt:''});setEditSt(null);setStModal(true)}}><i className="fa-solid fa-user-plus" style={{marginRight:3}}/>Agregar Estudiante</button>
      <button className="btn-g" style={{fontSize:'.65rem'}} onClick={expPDF}><i className="fa-solid fa-file-pdf" style={{marginRight:3}}/>PDF</button>
      <button className="btn-g" style={{fontSize:'.65rem'}} onClick={expCSV}><i className="fa-solid fa-file-csv" style={{marginRight:3}}/>CSV</button>
      <button className="btn-g" style={{fontSize:'.65rem'}} onClick={()=>setCbModal(true)}><i className="fa-solid fa-plus" style={{marginRight:3}}/>Boton</button>
    </div>

    <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap'}}>
      <div style={{flex:1,minWidth:180,position:'relative'}}>
        <i className="fa-solid fa-search" style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'#444',fontSize:'.75rem'}}/>
        <input className="inp" style={{paddingLeft:32}} placeholder="Buscar estudiante..." value={search} onChange={e=>setSearch(e.target.value)}/>
      </div>
      <select className="inp" style={{width:'auto',minWidth:130}} value={filter} onChange={e=>setFilter(e.target.value)}>
        <option value="all">Todos</option>
        <option value="today">Hoy</option>
        <option value="week">Esta semana</option>
        <option value="month">Este mes</option>
        <option value="nopart">Sin participacion</option>
        <option value="obs">Con observaciones</option>
        <option value="low">Baja participacion</option>
      </select>
    </div>

    {/* Desktop table */}

// ========== CALENDARIO ==========
function CalendarPage(){
  const{records,students}=useA();
  const[yr,setYr]=useState(new Date().getFullYear());
  const[mo,setMo]=useState(new Date().getMonth());
  const[selDay,setSelDay]=useState(null);

  const dim=new Date(yr,mo+1,0).getDate();
  const fd=new Date(yr,mo,1).getDay();
  const mn=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const dn=['Do','Lu','Ma','Mi','Ju','Vi','Sa'];
  const today=new Date().toISOString().split('T')[0];

  const recsFor=d=>{const ds=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;return records.filter(r=>r.date===ds)};
  const days=[];for(let i=0;i<fd;i++)days.push(null);for(let d=1;d<=dim;d++)days.push(d);
  const selRecs=selDay?recsFor(selDay):[];

  return <div style={{paddingBottom:80}}>
    <h2 className="font-cinzel" style={{fontSize:'1.15rem',fontWeight:700,marginBottom:16}}>Calendario</h2>
    <div className="card" style={{padding:14}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
        <button className="btn-g" onClick={()=>{if(mo===0){setMo(11);setYr(y=>y-1)}else setMo(m=>m-1)}}><i className="fa-solid fa-chevron-left"/></button>
        <h3 className="font-cinzel" style={{fontWeight:700,color:'#e0e0e0'}}>{mn[mo]} {yr}</h3>
        <button className="btn-g" onClick={()=>{if(mo===11){setMo(0);setYr(y=>y+1)}else setMo(m=>m+1)}}><i className="fa-solid fa-chevron-right"/></button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:3,marginBottom:4}}>
        {dn.map(d=><div key={d} style={{textAlign:'center',fontSize:'.6rem',color:'#444',padding:3}}>{d}</div>)}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:3}}>
        {days.map((d,i)=>{if(!d)return <div key={`e${i}`}/>;
          const ds=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          const rc=recsFor(d);const isTd=ds===today;
          return <div key={d} className={`cd ${isTd?'td':''} ${rc.length?'ha':''}`} onClick={()=>setSelDay(d)}>
            <span style={{color:isTd?'#dc2626':'#aaa',fontWeight:isTd?700:400,fontSize:'.75rem'}}>{d}</span>
            {rc.length>0&&<span style={{fontSize:'.48rem',color:'#dc2626'}}>{rc.length}</span>}
          </div>
        })}
      </div>
    </div>
    {selDay&&<div className="card" style={{padding:14,marginTop:10}}>
      <h3 className="font-cinzel" style={{fontWeight:700,color:'#e0e0e0',fontSize:'.85rem',marginBottom:8}}>Registros del {selDay} de {mn[mo]}</h3>
      {selRecs.length?selRecs.map(r=>{const s=students.find(x=>x.id===r.studentId);return(
        <div key={r.id} style={{display:'flex',alignItems:'center',gap:8,padding:'5px 0',borderBottom:'1px solid #1a1a1a'}}>
          <span style={{fontSize:'.75rem',color:'#ccc',flex:1}}>{s?.fullName||'Estudiante'}</span>
          <span style={{fontSize:'.65rem',color:'#dc2626',fontWeight:700}}>{r.type}</span>
          <span style={{fontSize:'.6rem',color:'#444'}}>{r.time}</span>
        </div>
      )):<p style={{color:'#444',fontSize:'.75rem',textAlign:'center',padding:10}}>Sin registros</p>}
    </div>}
  </div>
}

// ========== ESTADISTICAS ==========
function StatsPage(){
  const{courses,students,records}=useA();
  const[selC,setSelC]=useState('all');
  const r1=useRef(null),r2=useRef(null),r3=useRef(null);
  const c1=useRef(null),c2=useRef(null),c3=useRef(null);

  const fR=selC==='all'?records:records.filter(r=>r.courseId===selC);

  const rank=useMemo(()=>{const c={};fR.forEach(r=>{c[r.studentId]=(c[r.studentId]||0)+1});return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([sid,cnt])=>{const s=students.find(x=>x.id===sid);return{name:s?.fullName||'?',cnt}})},[fR,students]);
  const types=useMemo(()=>{const c={};fR.forEach(r=>{c[r.type]=(c[r.type]||0)+1});return Object.entries(c).map(([type,cnt])=>({type,cnt}))},[fR]);
  const weekly=useMemo(()=>{const n=Date.now();const w=[];for(let i=6;i>=0;i--){const s=n-(i+1)*604800000,e=n-i*604800000;const cnt=fR.filter(r=>r.timestamp>=s&&r.timestamp<e).length;const d=new Date(s);w.push({lb:`${d.getDate()}/${d.getMonth()+1}`,cnt})}return w},[fR]);

  useEffect(()=>{
    c1.current?.destroy();c2.current?.destroy();c3.current?.destroy();
    const x1=r1.current?.getContext('2d'),x2=r2.current?.getContext('2d'),x3=r3.current?.getContext('2d');
    if(x1)c1.current=new Chart(x1,{type:'bar',data:{labels:rank.map(d=>d.name.slice(0,14)),datasets:[{label:'Part.',data:rank.map(d=>d.cnt),backgroundColor:'rgba(220,38,38,.65)',borderColor:'#dc2626',borderWidth:1,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{grid:{color:'#1a1a1a'},ticks:{color:'#555',font:{size:9}}},y:{grid:{display:false},ticks:{color:'#888',font:{size:9,family:'Cinzel'}}}}}});
    if(x2)c2.current=new Chart(x2,{type:'doughnut',data:{labels:types.map(d=>d.type),datasets:[{data:types.map(d=>d.cnt),backgroundColor:['#dc2626','#ef4444','#f87171','#991b1b','#7f1d1d','#b91c1c','#fca5a5','#fecaca'],borderColor:'#111',borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#777',font:{size:9,family:'Cinzel'},padding:6}}}}});
    if(x3)c3.current=new Chart(x3,{type:'line',data:{labels:weekly.map(d=>d.lb),datasets:[{label:'Reg.',data:weekly.map(d=>d.cnt),borderColor:'#dc2626',backgroundColor:'rgba(220,38,38,.08)',fill:true,tension:.4,pointBackgroundColor:'#dc2626',pointRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'#1a1a1a'},ticks:{color:'#555',font:{size:9}}},y:{grid:{color:'#1a1a1a'},ticks:{color:'#555',font:{size:9}},beginAtZero:true}}}});
    return()=>{c1.current?.destroy();c2.current?.destroy();c3.current?.destroy()};
  },[rank,types,weekly]);

  return <div style={{paddingBottom:80}}>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:8}}>
      <h2 className="font-cinzel" style={{fontSize:'1.15rem',fontWeight:700}}>Estadisticas</h2>
      <select className="inp" style={{width:'auto'}} value={selC} onChange={e=>setSelC(e.target.value)}>
        <option value="all">Todos los cursos</option>
        {courses.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
      </select>
    </div>
    {fR.length===0?<div className="card" style={{padding:40,textAlign:'center'}}><i className="fa-solid fa-chart-bar" style={{fontSize:'2.5rem',color:'#222',marginBottom:10}}/><p style={{color:'#444'}}>Sin datos</p></div>
    :<div style={{display:'flex',flexDirection:'column',gap:16}}>
      <div className="card" style={{padding:14}}>
        <h3 className="font-cinzel" style={{fontSize:'.75rem',fontWeight:700,color:'#666',letterSpacing:1,marginBottom:10}}>Ranking</h3>
        <div style={{height:Math.max(180,rank.length*30)}}><canvas ref={r1}/></div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:16}}>
        <div className="card" style={{padding:14}}>
          <h3 className="font-cinzel" style={{fontSize:'.75rem',fontWeight:700,color:'#666',letterSpacing:1,marginBottom:10}}>Tipos de Registro</h3>
          <div style={{height:220}}><canvas ref={r2}/></div>
        </div>
        <div className="card" style={{padding:14}}>
          <h3 className="font-cinzel" style={{fontSize:'.75rem',fontWeight:700,color:'#666',letterSpacing:1,marginBottom:10}}>Evolucion Semanal</h3>
          <div style={{height:220}}><canvas ref={r3}/></div>
        </div>
      </div>
    </div>}
  </div>
}

// ========== REPORTES ==========
function ReportsPage(){
  const{courses,students,records,obs}=useA();
  const[selC,setSelC]=useState('');

  const expPDF=()=>{
    const c=courses.find(x=>x.id===selC);if(!c){toast('Selecciona un curso','e');return}
    const cs=students.filter(s=>s.courseId===c.id).sort((a,b)=>(a.listNumber||0)-(b.listNumber||0));
    const cr=records.filter(r=>r.courseId===c.id);
    const{jsPDF}=window.jspdf;const doc=new jsPDF();
    doc.setFillColor(10,10,10);doc.rect(0,0,220,300,'F');
    doc.setFont('helvetica','bold');doc.setTextColor(220,38,38);doc.setFontSize(26);doc.text('KLIS123',105,20,{align:'center'});
    doc.setFontSize(13);doc.text('CLLASKM',105,30,{align:'center'});
    doc.setFontSize(7);doc.setTextColor(140);doc.text('Control Docente Inteligente',105,37,{align:'center'});
    doc.setDrawColor(220,38,38);doc.line(20,41,190,41);
    doc.setTextColor(210);doc.setFontSize(11);doc.text(c.name,105,50,{align:'center'});
    doc.setFontSize(7);doc.setTextColor(120);
    doc.text([c.parallel,c.level,c.subject].filter(Boolean).join(' · '),105,56,{align:'center'});
    doc.text('Generado: '+new Date().toLocaleString(),105,61,{align:'center'});
    const td=cs.map(s=>{const c2=DEF_BTNS.map(b=>cr.filter(r=>r.studentId===s.id&&r.type===b).length);const t=c2.reduce((a,b)=>a+b,0);const o=obs.filter(x=>x.studentId===s.id).map(x=>x.text).join('; ');return[s.listNumber||'',s.fullName,...c2,t,o]});
    doc.autoTable({startY:67,head:[['Nro','Nombre',...DEF_BTNS,'Total','Obs']],body:td,theme:'grid',styles:{fillColor:[15,15,15],textColor:[200,200,200],fontSize:5.5,font:'helvetica',cellPadding:1.5},headStyles:{fillColor:[40,10,10],textColor:[220,38,38],fontStyle:'bold',fontSize:5},alternateRowStyles:{fillColor:[20,20,20]}});
    doc.save(`KLIS123_${c.name}.pdf`);toast('PDF exportado');
  };

  const expCSV=()=>{
    const c=courses.find(x=>x.id===selC);if(!c){toast('Selecciona un curso','e');return}
    const cs=students.filter(s=>s.courseId===c.id).sort((a,b)=>(a.listNumber||0)-(b.listNumber||0));
    const cr=records.filter(r=>r.courseId===c.id);
    const hdr='Nro,Nombre,'+DEF_BTNS.join(',')+',Total,Observaciones\n';
    const rows=cs.map(s=>{const c2=DEF_BTNS.map(b=>cr.filter(r=>r.studentId===s.id&&r.type===b).length);const t=c2.reduce((a,b)=>a+b,0);const o=obs.filter(x=>x.studentId===s.id).map(x=>`"${x.text}"`).join('; ');return`${s.listNumber||''},"${s.fullName}",${c2.join(',')},${t},"${o}"`}).join('\n');
    const b=new Blob(['\ufeff'+hdr+rows],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`${c.name}_reporte.csv`;a.click();toast('CSV exportado');
  };

  return <div style={{paddingBottom:80}}>
    <h2 className="font-cinzel" style={{fontSize:'1.15rem',fontWeight:700,marginBottom:16}}>Reportes</h2>
    <div className="card" style={{padding:18}}>
      <div style={{marginBottom:12}}>
        <label style={{fontSize:'.64rem',color:'#777',display:'block',marginBottom:3}}>Seleccionar Curso</label>
        <select className="inp" value={selC} onChange={e=>setSelC(e.target.value)}>
          <option value="">-- Seleccionar --</option>
          {courses.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
      </div>
      <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
        <button className="btn-r" onClick={expPDF}><i className="fa-solid fa-file-pdf" style={{marginRight:5}}/>Exportar PDF</button>
        <button className="btn-g" onClick={expCSV}><i className="fa-solid fa-file-csv" style={{marginRight:5}}/>Exportar CSV</button>
      </div>
      {selC&&(()=>{const c=courses.find(x=>x.id===selC);const cs=students.filter(s=>s.courseId===selC);const cr=records.filter(r=>r.courseId===selC);return(
        <div style={{marginTop:14,borderTop:'1px solid #1a1a1a',paddingTop:12}}>
          <div style={{display:'grid',gap:10,gridTemplateColumns:'repeat(auto-fit,minmax(100px,1fr))'}}>
            <div style={{textAlign:'center'}}><div style={{fontSize:'.56rem',color:'#555',textTransform:'uppercase'}}>Estudiantes</div><div className="font-cinzel" style={{color:'#dc2626',fontSize:'1.4rem',fontWeight:900}}>{cs.length}</div></div>
            <div style={{textAlign:'center'}}><div style={{fontSize:'.56rem',color:'#555',textTransform:'uppercase'}}>Registros</div><div className="font-cinzel" style={{color:'#22c55e',fontSize:'1.4rem',fontWeight:900}}>{cr.length}</div></div>
            <div style={{textAlign:'center'}}><div style={{fontSize:'.56rem',color:'#555',textTransform:'uppercase'}}>Promedio</div><div className="font-cinzel" style={{color:'#3b82f6',fontSize:'1.4rem',fontWeight:900}}>{cs.length?(cr.length/cs.length).toFixed(1):'0'}</div></div>
          </div>
        </div>
      )})()}
    </div>
  </div>
}

// ========== HISTORIAL ==========
function HistoryPage(){
  const{records,students,courses}=useA();
  const[fC,setFC]=useState('all');const[fT,setFT]=useState('all');const[search,setSearch]=useState('');

  const filtered=records.filter(r=>{
    if(fC!=='all'&&r.courseId!==fC)return false;
    if(fT!=='all'&&r.type!==fT)return false;
    if(search){const s=students.find(x=>x.id===r.studentId);if(!s||!s.fullName.toLowerCase().includes(search.toLowerCase()))return false}
    return true;
  }).sort((a,b)=>b.timestamp-a.timestamp);

  const types=[...new Set(records.map(r=>r.type))];

  return <div style={{paddingBottom:80}}>
    <h2 className="font-cinzel" style={{fontSize:'1.15rem',fontWeight:700,marginBottom:16}}>Historial</h2>
    <div style={{display:'flex',gap:6,marginBottom:12,flexWrap:'wrap'}}>
      <input className="inp" style={{flex:1,minWidth:160}} placeholder="Buscar..." value={search} onChange={e=>setSearch(e.target.value)}/>
      <select className="inp" style={{width:'auto'}} value={fC} onChange={e=>setFC(e.target.value)}>
        <option value="all">Todos los cursos</option>
        {courses.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
      </select>
      <select className="inp" style={{width:'auto'}} value={fT} onChange={e=>setFT(e.target.value)}>
        <option value="all">Todos</option>
        {types.map(t=><option key={t} value={t}>{t}</option>)}
      </select>
    </div>
    <div className="card">
      {filtered.slice(0,50).map(r=>{const s=students.find(x=>x.id===r.studentId);const c=courses.find(x=>x.id===r.courseId);return(
        <div key={r.id} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 12px',borderBottom:'1px solid #1a1a1a'}}>
          <span className="sd sd-h"/>
          <div style={{flex:1}}><div style={{fontSize:'.75rem',color:'#ccc'}}>{s?.fullName||'?'}</div><div style={{fontSize:'.58rem',color:'#444'}}>{c?.name||'?'}</div></div>
          <span style={{fontSize:'.65rem',color:'#dc2626',fontWeight:700}}>{r.type}</span>
          <span style={{fontSize:'.58rem',color:'#444',minWidth:70,textAlign:'right'}}>{r.date?.slice(5)} {r.time}</span>
        </div>
      ))}
      {filtered.length===0&&<div style={{padding:30,textAlign:'center',color:'#444'}}>Sin registros</div>}
      {filtered.length>50&&<div style={{padding:8,textAlign:'center',color:'#444',fontSize:'.65rem'}}>Mostrando 50 de {filtered.length}</div>}
    </div>
  </div>
}

// ========== CONFIGURACION ==========
function SettingsPage(){
  const{settings,updSettings,cBtns,addCBtn,rmCBtn}=useA();
  const[nb,setNb]=useState('');

  return <div style={{paddingBottom:80}}>
    <h2 className="font-cinzel" style={{fontSize:'1.15rem',fontWeight:700,marginBottom:16}}>Configuracion</h2>
    <div style={{display:'flex',flexDirection:'column',gap:12,maxWidth:460}}>
      <div className="card" style={{padding:16}}>
        <h3 className="font-cinzel" style={{fontSize:'.82rem',fontWeight:700,color:'#dc2626',marginBottom:12}}>General</h3>
        <div><label style={{fontSize:'.64rem',color:'#777',display:'block',marginBottom:3}}>Nombre del docente</label><input className="inp" value={settings.teacherName} onChange={e=>updSettings({teacherName:e.target.value})} placeholder="Tu nombre"/></div>
      </div>
      <div className="card" style={{padding:16}}>
        <h3 className="font-cinzel" style={{fontSize:'.82rem',fontWeight:700,color:'#dc2626',marginBottom:12}}>Botones de Registro</h3>
        <div style={{marginBottom:8}}>
          <div style={{fontSize:'.6rem',color:'#555',marginBottom:4}}>Predeterminados:</div>
          <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>{DEF_BTNS.map(b=><span key={b} className="rb" style={{cursor:'default'}}>{b}</span>)}</div>
        </div>
        <div style={{fontSize:'.6rem',color:'#555',marginBottom:4}}>Personalizados:</div>
        {cBtns.map(b=><div key={b.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'4px 0',borderBottom:'1px solid #1a1a1a'}}>
          <span style={{fontSize:'.75rem',color:'#ccc'}}>{b.name}</span>
          <button style={{background:'none',border:'none',color:'#991b1b',cursor:'pointer'}} onClick={()=>{rmCBtn(b.id);toast('Boton eliminado','i')}}><i className="fa-solid fa-trash"/></button>
        </div>)}
        <div style={{display:'flex',gap:6,marginTop:8}}>
          <input className="inp" style={{flex:1}} placeholder="Nuevo boton" value={nb} onChange={e=>setNb(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&nb.trim()){addCBtn(nb.trim());setNb('');toast('Boton agregado')}}}/>
          <button className="btn-r" onClick={()=>{if(nb.trim()){addCBtn(nb.trim());setNb('');toast('Boton agregado')}}}>Agregar</button>
        </div>
      </div>
      <div className="card" style={{padding:16}}>
        <h3 className="font-cinzel" style={{fontSize:'.82rem',fontWeight:700,color:'#dc2626',marginBottom:12}}>Atajos de Teclado</h3>
        <div style={{display:'flex',flexDirection:'column',gap:6,fontSize:'.72rem',color:'#777'}}>
          <div><kbd style={{background:'#1a1a1a',padding:'1px 5px',borderRadius:3,color:'#aaa',fontSize:'.65rem'}}>N</kbd> Nuevo estudiante</div>
          <div><kbd style={{background:'#1a1a1a',padding:'1px 5px',borderRadius:3,color:'#aaa',fontSize:'.65rem'}}>C</kbd> Nuevo curso</div>
          <div><kbd style={{background:'#1a1a1a',padding:'1px 5px',borderRadius:3,color:'#aaa',fontSize:'.65rem'}}>Ctrl+Z</kbd> Deshacer</div>
          <div><kbd style={{background:'#1a1a1a',padding:'1px 5px',borderRadius:3,color:'#aaa',fontSize:'.65rem'}}>Ctrl+P</kbd> Exportar</div>
        </div>
      </div>
      <div className="card" style={{padding:16}}>
        <h3 className="font-cinzel" style={{fontSize:'.82rem',fontWeight:700,color:'#dc2626',marginBottom:12}}>Datos</h3>
        <button className="btn-g" style={{width:'100%'}} onClick={()=>{if(confirm('Eliminar TODOS los datos locales?')){Object.keys(localStorage).filter(k=>k.startsWith(SP)).forEach(k=>localStorage.removeItem(k));window.location.reload()}}}><i className="fa-solid fa-trash" style={{marginRight:5}}/>Limpiar datos locales</button>
      </div>
    </div>
  </div>
}

// ========== APP ==========
function App(){
  const[page,setPage]=useState('dashboard');
  const[cid,setCid]=useState(null);
  const[sbOpen,setSbOpen]=useState(false);
  const{undoLast}=useA();

  // Responsive: mostrar tabla en desktop, tarjetas en mobile
  useEffect(()=>{
    const mq=window.matchMedia('(min-width:769px)');
    const dt=document.getElementById('dtable');
    const mc=document.getElementById('mcards');
    function check(){if(dt&&mc){if(mq.matches){dt.style.display='block';mc.style.display='none'}else{dt.style.display='none';mc.style.display='flex'}}}
    check();mq.addEventListener('change',check);
    return()=>mq.removeEventListener('change',check);
  },[page,cid]);

  // Keyboard shortcuts
  useEffect(()=>{
    const h=e=>{
      if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;
      if(e.ctrlKey&&e.key==='z'){e.preventDefault();if(undoLast())toast('Accion deshecha','i');return}
      if(e.ctrlKey&&e.key==='p'){e.preventDefault();setPage('reports');return}
      if(e.key==='n'){setPage('courses');return}
      if(e.key==='c'&&!e.ctrlKey){setPage('courses');return}
    };
    window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);
  },[undoLast]);

  const renderPage=()=>{
    switch(page){
      case 'dashboard':return <Dashboard setPage={setPage} setCid={setCid}/>;
      case 'courses':return <CoursesPage setPage={setPage} setCid={setCid}/>;
      case 'courseDetail':return <CourseDetail courseId={cid} setPage={setPage}/>;
      case 'calendar':return <CalendarPage/>;
      case 'stats':return <StatsPage/>;
      case 'reports':return <ReportsPage/>;
      case 'history':return <HistoryPage/>;
      case 'settings':return <SettingsPage/>;
      default:return <Dashboard setPage={setPage} setCid={setCid}/>;
    }
  };

  return <div style={{minHeight:'100vh',background:'#080808'}}>
    <Sidebar page={page} setPage={setPage} open={sbOpen} setOpen={setSbOpen}/>
    <div style={{marginLeft:0,padding:'0 16px 0 16px'}} className="md:ml-[250px]">
      <header className="no-print" style={{display:'flex',alignItems:'center',gap:10,padding:'12px 0',borderBottom:'1px solid #1a1a1a',marginBottom:16}}>
        <div className="ham" onClick={()=>setSbOpen(!sbOpen)}><i className="fa-solid fa-bars"/></div>
        <div style={{flex:1}} className="hidden md:block"/>
        <SyncInd/>
      </header>
      {renderPage()}
    </div>
    <BNav page={page} setPage={setPage}/>
  </div>
}

// ========== RENDER ==========
const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<Prov><App/></Prov>);
</script>
</body>
</html>
