<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLLASKM</title>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script>
tailwind.config={theme:{extend:{colors:{'cll':'#0A0A0A','cll2':'#111111','cll3':'#161616','cll4':'#1E1E1E','cllb':'#252525','cllr':'#DC2626','cllr2':'#EF4444','cllm':'#6B7280'},fontFamily:{'goth':['"UnifrakturCook"','cursive'],'sans':['Inter','sans-serif']}}}}
</script>
<style>
*{scrollbar-width:thin;scrollbar-color:#252525 #0A0A0A}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#0A0A0A}::-webkit-scrollbar-thumb{background:#252525;border-radius:3px}
body{background:#0A0A0A;color:#fff;font-family:'Inter',sans-serif;overflow-x:hidden}
.goth{font-family:'UnifrakturCook',cursive}
.red-glow{text-shadow:0 0 20px rgba(220,38,38,0.5),0 0 40px rgba(220,38,38,0.2)}
.red-box-glow{box-shadow:0 0 15px rgba(220,38,38,0.3),0 0 30px rgba(220,38,38,0.1)}
.card-hover{transition:all .3s ease}.card-hover:hover{box-shadow:0 0 20px rgba(220,38,38,0.2);transform:translateY(-2px);border-color:#DC2626}
.btn-cll{background:#DC2626;color:#fff;font-weight:600;padding:.5rem 1.25rem;transition:all .2s;border:none;cursor:pointer}
.btn-cll:hover{background:#EF4444;box-shadow:0 0 20px rgba(220,38,38,0.4)}
.btn-ghost{background:transparent;border:1px solid #252525;color:#fff;padding:.5rem 1.25rem;transition:all .2s;cursor:pointer}
.btn-ghost:hover{border-color:#DC2626;color:#DC2626}
.fade-in{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse-red{0%,100%{box-shadow:0 0 5px rgba(220,38,38,0.3)}50%{box-shadow:0 0 20px rgba(220,38,38,0.6)}}
.active-btn{animation:pulse-red 2s infinite}
.sidebar-item{transition:all .2s;border-left:3px solid transparent}
.sidebar-item:hover,.sidebar-item.active{background:rgba(220,38,38,0.1);border-left-color:#DC2626;color:#DC2626}
.modal-overlay{background:rgba(0,0,0,0.8);backdrop-filter:blur(4px)}
.toast-enter{animation:toastIn .3s ease}
.toast-exit{animation:toastOut .3s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(100px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(100px)}}
input,textarea,select{background:#161616;border:1px solid #252525;color:#fff;padding:.5rem .75rem;outline:none;transition:border-color .2s}
input:focus,textarea:focus,select:focus{border-color:#DC2626}
.reg-btn{padding:.35rem .75rem;font-size:.75rem;font-weight:600;border:1px solid #252525;background:#161616;color:#9CA3AF;cursor:pointer;transition:all .15s}
.reg-btn:hover{border-color:#6B7280;color:#fff}
.reg-btn.registered{background:#DC2626;border-color:#DC2626;color:#fff;animation:pulse-red 2s infinite}
.sidebar-mobile{transform:translateX(-100%);transition:transform .3s ease}
.sidebar-mobile.open{transform:translateX(0)}
canvas#gameCanvas{image-rendering:pixelated}
</style>
</head>
<body class="flex min-h-screen">

<!-- Sidebar -->
<aside id="sidebar" class="fixed lg:static z-50 w-64 min-h-screen bg-cll2 border-r border-cllb flex flex-col sidebar-mobile lg:transform-none">
<div class="p-6 border-b border-cllb">
<h1 class="goth text-4xl text-cllr red-glow tracking-wide">CLLASKM</h1>
<p class="text-[10px] text-cllm mt-1 tracking-[.3em] uppercase">Sistema Docente</p>
</div>
<nav class="flex-1 py-4" id="sidebar-nav">
<div class="sidebar-item active flex items-center gap-3 px-6 py-3 cursor-pointer text-sm" data-view="dashboard"><i class="fa-solid fa-grip w-5 text-center"></i>Dashboard</div>
<div class="sidebar-item flex items-center gap-3 px-6 py-3 cursor-pointer text-sm" data-view="courses"><i class="fa-solid fa-graduation-cap w-5 text-center"></i>Cursos</div>
<div class="sidebar-item flex items-center gap-3 px-6 py-3 cursor-pointer text-sm" data-view="calendar"><i class="fa-solid fa-calendar-days w-5 text-center"></i>Calendario</div>
<div class="sidebar-item flex items-center gap-3 px-6 py-3 cursor-pointer text-sm" data-view="statistics"><i class="fa-solid fa-chart-bar w-5 text-center"></i>Estadísticas</div>
<div class="sidebar-item flex items-center gap-3 px-6 py-3 cursor-pointer text-sm" data-view="reports"><i class="fa-solid fa-file-pdf w-5 text-center"></i>Reportes</div>
<div class="sidebar-item flex items-center gap-3 px-6 py-3 cursor-pointer text-sm" data-view="game"><i class="fa-solid fa-gamepad w-5 text-center"></i>Modo Descanso</div>
<div class="sidebar-item flex items-center gap-3 px-6 py-3 cursor-pointer text-sm" data-view="settings"><i class="fa-solid fa-gear w-5 text-center"></i>Configuración</div>
</nav>
<div class="p-6 border-t border-cllb">
<p class="text-[10px] text-cllm tracking-widest">CLLASKM v1.0</p>
</div>
</aside>

<!-- Overlay mobile -->
<div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>

<!-- Main -->
<main class="flex-1 min-h-screen flex flex-col">
<!-- Header -->
<header class="sticky top-0 z-30 bg-cll/95 backdrop-blur-sm border-b border-cllb px-4 lg:px-8 py-4 flex items-center justify-between">
<div class="flex items-center gap-4">
<button class="lg:hidden text-cllm hover:text-white" onclick="toggleSidebar()"><i class="fa-solid fa-bars text-xl"></i></button>
<h2 id="page-title" class="goth text-2xl lg:text-3xl text-white">Dashboard</h2>
</div>
<div class="flex items-center gap-3">
<span id="auth-status" class="text-[10px] text-cllm tracking-wider uppercase"></span>
<div class="w-2 h-2 rounded-full bg-green-500" id="conn-indicator"></div>
</div>
</header>

<!-- Content -->
<div id="content" class="flex-1 p-4 lg:p-8 fade-in"></div>
</main>

<!-- Modal -->
<div id="modal-overlay" class="fixed inset-0 z-50 modal-overlay flex items-center justify-center p-4 hidden">
<div id="modal-box" class="bg-cll2 border border-cllb w-full max-w-lg max-h-[90vh] overflow-y-auto"></div>
</div>

<!-- Toasts -->
<div id="toast-container" class="fixed top-4 right-4 z-[60] flex flex-col gap-2"></div>

<script>
// ============================================
// FIREBASE CONFIG
// ============================================
const firebaseConfig={apiKey:"AIzaSyCDmWUBk7bpTI-sIEYqHn_sTCaYTSuekLA",authDomain:"celulakmt.firebaseapp.com",databaseURL:"https://celulakmt-default-rtdb.firebaseio.com",projectId:"celulakmt",storageBucket:"celulakmt.firebasestorage.app",messagingSenderId:"623088700057",appId:"1:623088700057:web:fffb8fccbae5ff6d834608",measurementId:"G-CY1HY229XX"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const auth=firebase.auth();

// Auth anónima
let isAuth=false;
auth.signInAnonymously().then(()=>{isAuth=true;document.getElementById('auth-status').textContent='Conectado'}).catch(e=>{console.warn('Auth fallida:',e.message);document.getElementById('auth-status').textContent='Sin escritura';document.getElementById('conn-indicator').className='w-2 h-2 rounded-full bg-yellow-500'});
auth.onAuthStateChanged(u=>{if(u){isAuth=true}});

// ============================================
// ESTADO GLOBAL
// ============================================
const state={
  view:'dashboard',
  courses:{},
  categories:{},
  currentCourseId:null,
  courseSubView:'students',
  selectedDate:new Date().toISOString().split('T')[0],
  calMonth:new Date().getMonth(),
  calYear:new Date().getFullYear(),
  records:{},
  students:{},
  observations:{},
  charts:{},
  gameInstance:null
};

// ============================================
// UTILIDADES
// ============================================
function uid(){return db.ref().push().key}
function today(){return new Date().toISOString().split('T')[0]}
function nowTime(){return new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function formatDate(d){const p=d.split('-');const m=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];return`${p[2]} ${m[parseInt(p[1])-1]} ${p[0]}`}

function showToast(msg,type='success'){
  const c=document.getElementById('toast-container');
  const t=document.createElement('div');
  const colors={success:'border-green-500 bg-green-500/10',error:'border-red-500 bg-red-500/10',info:'border-blue-500 bg-blue-500/10'};
  t.className=`toast-enter border-l-4 ${colors[type]||colors.info} px-4 py-3 text-sm text-white`;
  t.textContent=msg;c.appendChild(t);
  setTimeout(()=>{t.classList.add('toast-exit');setTimeout(()=>t.remove(),300)},3000);
}

function showModal(html){
  document.getElementById('modal-box').innerHTML=html;
  document.getElementById('modal-overlay').classList.remove('hidden');
}
function hideModal(){document.getElementById('modal-overlay').classList.add('hidden')}
document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target.id==='modal-overlay')hideModal()});

function toggleSidebar(){
  const s=document.getElementById('sidebar');
  const o=document.getElementById('sidebar-overlay');
  s.classList.toggle('open');o.classList.toggle('hidden');
}

// ============================================
// FIREBASE - OPERACIONES
// ============================================
async function fbGet(path){
  try{const s=await db.ref(path).once('value');return s.val()}catch(e){console.error(e);return null}
}
async function fbSet(path,val){
  if(!isAuth){showToast('Sin permisos de escritura. Habilita Anonymous Auth en Firebase.','error');return false}
  try{await db.ref(path).set(val);return true}catch(e){console.error(e);showToast('Error al guardar: '+e.message,'error');return false}
}
async function fbRemove(path){
  if(!isAuth){showToast('Sin permisos de escritura','error');return false}
  try{await db.ref(path).remove();return true}catch(e){console.error(e);return false}
}
async function fbPush(path,val){
  if(!isAuth){showToast('Sin permisos de escritura','error');return null}
  try{const ref=db.ref(path).push();await ref.set(val);return ref.key}catch(e){console.error(e);return null}
}

// ============================================
// CARGA DE DATOS
// ============================================
async function loadData(){
  const[courses,categories]=await Promise.all([fbGet('courses'),fbGet('categories')]);
  state.courses=courses||{};
  state.categories=categories||{};
  // Si no hay categorías, crear las por defecto
  if(!categories){
    const defs=['Participó','Expuso','Entregó tarea'];
    for(let i=0;i<defs.length;i++){const id=uid();state.categories[id]={name:defs[i],order:i};fbSet('categories/'+id,state.categories[id])}
  }
  renderCurrentView();
}

// ============================================
// NAVEGACIÓN
// ============================================
function navigate(view,params={}){
  // Destruir juego si existe
  if(state.gameInstance){state.gameInstance.destroy();state.gameInstance=null}
  // Destruir charts
  Object.values(state.charts).forEach(c=>c.destroy());state.charts={};

  state.view=view;
  if(params.courseId)state.currentCourseId=params.courseId;
  if(params.subView)state.courseSubView=params.subView;

  // Actualizar sidebar
  document.querySelectorAll('.sidebar-item').forEach(el=>{
    el.classList.toggle('active',el.dataset.view===view||(view==='courseDetail'&&el.dataset.view==='courses'));
  });

  // Título
  const titles={dashboard:'Dashboard',courses:'Cursos',calendar:'Calendario',statistics:'Estadísticas',reports:'Reportes',game:'Modo Descanso',settings:'Configuración',courseDetail:''};
  if(view==='courseDetail'&&state.courses[state.currentCourseId]){
    const c=state.courses[state.currentCourseId];
    document.getElementById('page-title').textContent=c.name+' — '+c.paralelo;
  }else{
    document.getElementById('page-title').textContent=titles[view]||'CLLASKM';
  }

  renderCurrentView();
  // Cerrar sidebar mobile
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.add('hidden');
}

function renderCurrentView(){
  const c=document.getElementById('content');
  c.className='flex-1 p-4 lg:p-8 fade-in';
  switch(state.view){
    case'dashboard':renderDashboard(c);break;
    case'courses':renderCourses(c);break;
    case'courseDetail':renderCourseDetail(c);break;
    case'calendar':renderCalendar(c);break;
    case'statistics':renderStatistics(c);break;
    case'reports':renderReports(c);break;
    case'game':renderGame(c);break;
    case'settings':renderSettings(c);break;
    default:renderDashboard(c);
  }
}

// ============================================
// DASHBOARD
// ============================================
async function renderDashboard(container){
  const courses=state.courses;
  const keys=Object.keys(courses);
  let totalStudents=0,totalRecords=0;
  // Cargar conteos
  for(const k of keys){
    const studs=await fbGet('students/'+k);
    const recs=await fbGet('records/'+k);
    const sc=studs?Object.keys(studs).length:0;
    const rc=recs?Object.values(recs).reduce((a,v)=>{Object.values(v).forEach(r=>{a+=Object.keys(r).length});return a},0):0;
    courses[k]._studentCount=sc;courses[k]._recordCount=rc;
    totalStudents+=sc;totalRecords+=rc;
  }
  const todayRecs=await fbGet('records');
  let todayCount=0;
  if(todayRecs){Object.values(todayRecs).forEach(cv=>{const dv=cv[today()];if(dv)Object.values(dv).forEach(rv=>todayCount+=Object.keys(rv).length)})}

  container.innerHTML=`
  <div class="mb-8">
    <h3 class="goth text-5xl lg:text-7xl text-white mb-2 red-glow">CLLASKM</h3>
    <p class="text-cllm text-sm tracking-widest uppercase">Panel de control docente</p>
  </div>
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 lg:gap-4 mb-8">
    <div class="bg-cll3 border border-cllb p-4 lg:p-5 card-hover">
      <p class="text-[10px] text-cllm tracking-widest uppercase mb-1">Cursos</p>
      <p class="text-3xl font-bold">${keys.length}</p>
    </div>
    <div class="bg-cll3 border border-cllb p-4 lg:p-5 card-hover">
      <p class="text-[10px] text-cllm tracking-widest uppercase mb-1">Estudiantes</p>
      <p class="text-3xl font-bold">${totalStudents}</p>
    </div>
    <div class="bg-cll3 border border-cllb p-4 lg:p-5 card-hover">
      <p class="text-[10px] text-cllm tracking-widest uppercase mb-1">Registros hoy</p>
      <p class="text-3xl font-bold text-cllr">${todayCount}</p>
    </div>
    <div class="bg-cll3 border border-cllb p-4 lg:p-5 card-hover">
      <p class="text-[10px] text-cllm tracking-widest uppercase mb-1">Total registros</p>
      <p class="text-3xl font-bold">${totalRecords}</p>
    </div>
  </div>
  <div class="flex items-center justify-between mb-6">
    <h4 class="text-lg font-semibold">Mis Cursos</h4>
    <button class="btn-cll text-sm" onclick="modalCreateCourse()"><i class="fa-solid fa-plus mr-2"></i>Crear Curso</button>
  </div>
  <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
    ${keys.length===0?'<div class="col-span-full text-center py-16 text-cllm"><i class="fa-solid fa-graduation-cap text-4xl mb-4 block"></i><p>No hay cursos creados</p><p class="text-sm mt-1">Comienza creando tu primer curso</p></div>':''}
    ${keys.map(k=>{const c=courses[k];return`
    <div class="bg-cll3 border border-cllb p-5 card-hover cursor-pointer group" onclick="navigate('courseDetail',{courseId:'${k}'})">
      <div class="flex justify-between items-start mb-4">
        <div>
          <h5 class="font-bold text-lg group-hover:text-cllr transition-colors">${c.name}</h5>
          <p class="text-cllm text-sm">${c.paralelo}</p>
        </div>
        <i class="fa-solid fa-arrow-right text-cllm group-hover:text-cllr transition-colors"></i>
      </div>
      <div class="flex gap-4 text-xs text-cllm">
        <span><i class="fa-solid fa-users mr-1"></i>${c._studentCount||0} estudiantes</span>
        <span><i class="fa-solid fa-clipboard-check mr-1"></i>${c._recordCount||0} registros</span>
      </div>
    </div>`}).join('')}
  </div>`;
}

// ============================================
// CURSOS
// ============================================
function renderCourses(container){
  const keys=Object.keys(state.courses);
  container.innerHTML=`
  <div class="flex items-center justify-between mb-6">
    <p class="text-cllm text-sm">${keys.length} curso(s) registrado(s)</p>
    <button class="btn-cll text-sm" onclick="modalCreateCourse()"><i class="fa-solid fa-plus mr-2"></i>Crear Curso</button>
  </div>
  <div class="space-y-3">
    ${keys.length===0?'<div class="text-center py-20 text-cllm"><i class="fa-solid fa-folder-open text-4xl mb-4 block"></i><p>No hay cursos</p></div>':''}
    ${keys.map(k=>{const c=state.courses[k];return`
    <div class="bg-cll3 border border-cllb p-5 flex items-center justify-between card-hover">
      <div class="cursor-pointer flex-1" onclick="navigate('courseDetail',{courseId:'${k}'})">
        <h5 class="font-bold text-lg">${c.name}</h5>
        <p class="text-cllm text-sm">${c.paralelo}</p>
      </div>
      <div class="flex gap-2">
        <button class="btn-ghost text-xs" onclick="event.stopPropagation();modalEditCourse('${k}')"><i class="fa-solid fa-pen"></i></button>
        <button class="btn-ghost text-xs border-red-900 text-red-500 hover:bg-red-500 hover:text-white" onclick="event.stopPropagation();confirmDeleteCourse('${k}')"><i class="fa-solid fa-trash"></i></button>
      </div>
    </div>`}).join('')}
  </div>`;
}

function modalCreateCourse(){
  showModal(`
  <div class="p-6">
    <h3 class="goth text-2xl mb-6">Crear Curso</h3>
    <div class="space-y-4">
      <div><label class="text-xs text-cllm tracking-wider uppercase block mb-1">Nombre del curso</label><input id="mc-name" class="w-full" placeholder="Ej: Matemáticas"></div>
      <div><label class="text-xs text-cllm tracking-wider uppercase block mb-1">Paralelo</label><input id="mc-par" class="w-full" placeholder="Ej: A"></div>
    </div>
    <div class="flex justify-end gap-3 mt-6">
      <button class="btn-ghost text-sm" onclick="hideModal()">Cancelar</button>
      <button class="btn-cll text-sm" onclick="createCourse()">Crear</button>
    </div>
  </div>`);
}
async function createCourse(){
  const name=document.getElementById('mc-name').value.trim();
  const par=document.getElementById('mc-par').value.trim();
  if(!name){showToast('Ingresa el nombre del curso','error');return}
  const id=uid();
  await fbSet('courses/'+id,{name,paralelo:par||'Único',createdAt:Date.now()});
  state.courses[id]={name,paralelo:par||'Único',createdAt:Date.now()};
  hideModal();showToast('Curso creado correctamente');renderCurrentView();
}

function modalEditCourse(id){
  const c=state.courses[id];
  showModal(`<div class="p-6"><h3 class="goth text-2xl mb-6">Editar Curso</h3>
  <div class="space-y-4">
    <div><label class="text-xs text-cllm tracking-wider uppercase block mb-1">Nombre</label><input id="me-name" class="w-full" value="${c.name}"></div>
    <div><label class="text-xs text-cllm tracking-wider uppercase block mb-1">Paralelo</label><input id="me-par" class="w-full" value="${c.paralelo}"></div>
  </div>
  <div class="flex justify-end gap-3 mt-6">
    <button class="btn-ghost text-sm" onclick="hideModal()">Cancelar</button>
    <button class="btn-cll text-sm" onclick="editCourse('${id}')">Guardar</button>
  </div></div>`);
}
async function editCourse(id){
  const name=document.getElementById('me-name').value.trim();
  const par=document.getElementById('me-par').value.trim();
  if(!name){showToast('Ingresa el nombre','error');return}
  await fbSet('courses/'+id+'/name',name);
  await fbSet('courses/'+id+'/paralelo',par||'Único');
  state.courses[id].name=name;state.courses[id].paralelo=par||'Único';
  hideModal();showToast('Curso actualizado');renderCurrentView();
}

function confirmDeleteCourse(id){
  showModal(`<div class="p-6"><h3 class="goth text-2xl mb-4 text-cllr">Eliminar Curso</h3>
  <p class="text-cllm mb-6">Se eliminará el curso <strong class="text-white">${state.courses[id].name}</strong> y todos sus datos asociados. Esta acción no se puede deshacer.</p>
  <div class="flex justify-end gap-3">
    <button class="btn-ghost text-sm" onclick="hideModal()">Cancelar</button>
    <button class="btn-cll text-sm" onclick="deleteCourse('${id}')">Eliminar</button>
  </div></div>`);
}
async function deleteCourse(id){
  await fbRemove('courses/'+id);await fbRemove('students/'+id);await fbRemove('records/'+id);await fbRemove('observations/'+id);
  delete state.courses[id];hideModal();showToast('Curso eliminado');
  if(state.view==='courseDetail')navigate('courses');else renderCurrentView();
}

// ============================================
// DETALLE DE CURSO
// ============================================
async function renderCourseDetail(container){
  const cid=state.currentCourseId;
  const course=state.courses[cid];
  if(!course){navigate('courses');return}

  // Cargar datos del curso
  state.students[cid]=await fbGet('students/'+cid)||{};
  state.records[cid]=await fbGet('records/'+cid)||{};
  state.observations[cid]=await fbGet('observations/'+cid)||{};

  const sub=state.courseSubView;
  const tabs=[{id:'students',label:'Estudiantes',icon:'fa-users'},{id:'daily',label:'Registro Diario',icon:'fa-clipboard-check'},{id:'courseStats',label:'Estadísticas',icon:'fa-chart-pie'}];

  container.innerHTML=`
  <div class="flex gap-1 mb-6 border-b border-cllb overflow-x-auto">

// CALENDARIO
// ============================================
async function renderCalendar(container){
  const year=state.calYear;const month=state.calMonth;
  const mNames=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const startIdx=firstDay===0?6:firstDay-1; // Lunes=0

  // Cargar registros del mes
  let monthData={};
  for(const cid of Object.keys(state.courses)){
    const recs=await fbGet('records/'+cid)||{};
    Object.entries(recs).forEach(([date,dateRecs])=>{
      if(date.startsWith(`${year}-${String(month+1).padStart(2,'0')}`)){
        const count=Object.keys(dateRecs).length;
        monthData[date]=(monthData[date]||0)+count;
      }
    });
  }

  let grid='';
  const dayNames=['L','M','X','J','V','S','D'];
  dayNames.forEach(d=>{grid+=`<div class="text-center text-[10px] text-cllm py-2 uppercase tracking-wider">${d}</div>`});

  for(let i=0;i<startIdx;i++)grid+=`<div></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const count=monthData[dateStr]||0;
    const isToday=dateStr===today();
    grid+=`<div class="text-center py-2 lg:py-3 cursor-pointer border border-cllb hover:border-cllr transition-colors ${isToday?'bg-cllr/20 border-cllr':''}" onclick="selectCalDate('${dateStr}')">
      <div class="text-sm ${isToday?'text-cllr font-bold':'text-white'}">${d}</div>
      ${count>0?`<div class="text-[10px] text-cllr font-bold mt-0.5">${count}</div>`:''}
    </div>`;
  }

  container.innerHTML=`
  <div class="flex items-center justify-between mb-6">
    <button class="btn-ghost text-sm" onclick="state.calMonth--;if(state.calMonth<0){state.calMonth=11;state.calYear--}renderCurrentView()"><i class="fa-solid fa-chevron-left"></i></button>
    <h3 class="goth text-2xl">${mNames[month]} ${year}</h3>
    <button class="btn-ghost text-sm" onclick="state.calMonth++;if(state.calMonth>11){state.calMonth=0;state.calYear++}renderCurrentView()"><i class="fa-solid fa-chevron-right"></i></button>
  </div>
  <div class="grid grid-cols-7 gap-1 max-w-2xl">${grid}</div>
  <div id="cal-detail" class="mt-6"></div>`;
}

async function selectCalDate(dateStr){
  state.selectedDate=dateStr;
  const detail=document.getElementById('cal-detail');
  let html=`<h4 class="font-semibold mb-3">${formatDate(dateStr)}</h4><div class="space-y-2">`;
  let found=false;
  for(const[cid,course]of Object.entries(state.courses)){
    const recs=await fbGet('records/'+cid+'/'+dateStr)||{};
    const studs=await fbGet('students/'+cid)||{};
    const rKeys=Object.keys(recs);
    if(rKeys.length>0){
      found=true;
      html+=`<div class="bg-cll3 border border-cllb p-4"><h5 class="font-medium text-cllr mb-2">${course.name} — ${course.paralelo}</h5>`;
      rKeys.forEach(rk=>{const r=recs[rk];const sName=studs[r.studentId]?.name||'Desconocido';html+=`<p class="text-sm text-cllm"><span class="text-white">${sName}</span> — ${r.category} <span class="text-[10px]">${r.time||''}</span></p>`});
      html+=`</div>`;
    }
  }
  if(!found)html+=`<p class="text-cllm text-sm py-4 text-center">Sin registros en esta fecha</p>`;
  html+=`</div>`;
  detail.innerHTML=html;
}

// ============================================
// ESTADÍSTICAS
// ============================================
async function renderStatistics(container){
  const courses=state.courses;
  const cKeys=Object.keys(courses);
  if(cKeys.length===0){container.innerHTML='<div class="text-center py-20 text-cllm"><i class="fa-solid fa-chart-bar text-4xl mb-4 block"></i><p>Crea cursos para ver estadísticas</p></div>';return}

  // Recopilar datos globales
  let allStudentStats={}; // studentName -> {course, totals: {cat: count}}
  let courseStats={};
  let weeklyData={};

  for(const cid of cKeys){
    const studs=await fbGet('students/'+cid)||{};
    const recs=await fbGet('records/'+cid)||{};
    courseStats[cid]={total:0,byCategory:{},byStudent:{}};

    Object.entries(recs).forEach(([date,dateRecs])=>{
      Object.entries(dateRecs).forEach(([rid,r])=>{
        courseStats[cid].total++;
        courseStats[cid].byCategory[r.category]=(courseStats[cid].byCategory[r.category]||0)+1;
        const sName=studs[r.studentId]?.name||'?';
        courseStats[cid].byStudent[sName]=(courseStats[cid].byStudent[sName]||0)+1;

        // Semana
        const d=new Date(date);
        const weekStart=new Date(d);weekStart.setDate(d.getDate()-d.getDay()+1);
        const ws=weekStart.toISOString().split('T')[0];
        weeklyData[ws]=(weeklyData[ws]||0)+1;
      });
    });
  }

  // Ranking global
  let globalRank={};
  for(const cid of cKeys){
    if(!courseStats[cid])continue;
    Object.entries(courseStats[cid].byStudent).forEach(([name,count])=>{
      globalRank[name]=(globalRank[name]||0)+count;
    });
  }
  const rankArr=Object.entries(globalRank).sort((a,b)=>b[1]-a[1]).slice(0,10);

  container.innerHTML=`
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <div class="bg-cll3 border border-cllb p-5">
      <h4 class="text-sm text-cllm uppercase tracking-wider mb-4">Ranking de Participación</h4>
      <canvas id="chart-ranking" height="250"></canvas>
    </div>
    <div class="bg-cll3 border border-cllb p-5">
      <h4 class="text-sm text-cllm uppercase tracking-wider mb-4">Distribución por Categoría</h4>
      <canvas id="chart-categories" height="250"></canvas>
    </div>
    <div class="bg-cll3 border border-cllb p-5">
      <h4 class="text-sm text-cllm uppercase tracking-wider mb-4">Evolución Semanal</h4>
      <canvas id="chart-weekly" height="250"></canvas>
    </div>
    <div class="bg-cll3 border border-cllb p-5">
      <h4 class="text-sm text-cllm uppercase tracking-wider mb-4">Registros por Curso</h4>
      <canvas id="chart-courses" height="250"></canvas>
    </div>
  </div>
  ${rankArr.length>0?`
  <div class="mt-6 bg-cll3 border border-cllb p-5">
    <h4 class="text-sm text-cllm uppercase tracking-wider mb-4">Top 10 Participaciones</h4>
    <div class="space-y-2">
      ${rankArr.map(([name,count],i)=>`<div class="flex items-center gap-3"><span class="w-6 text-center font-bold ${i<3?'text-cllr':'text-cllm'}">${i+1}</span><span class="flex-1 text-sm">${name}</span><span class="font-bold text-sm">${count}</span><div class="w-24 h-2 bg-cll4"><div class="h-full bg-cllr" style="width:${Math.round(count/rankArr[0][1]*100)}%"></div></div></div>`).join('')}
    </div>
  </div>`:''}`;

  // Charts
  setTimeout(()=>{
    const chartOpts={responsive:true,plugins:{legend:{labels:{color:'#9CA3AF',font:{size:11}}}},scales:{x:{ticks:{color:'#6B7280',font:{size:10}},grid:{color:'#1E1E1E'}},y:{ticks:{color:'#6B7280',font:{size:10}},grid:{color:'#1E1E1E'}}}};

async function generatePDF(){
  const cid=document.getElementById('report-course')?.value;
  if(!cid){showToast('Selecciona un curso','error');return}

  const course=state.courses[cid];
  const studs=await fbGet('students/'+cid)||{};
  const recs=await fbGet('records/'+cid)||{};
  const obs=await fbGet('observations/'+cid)||{};
  const cats=state.categories;

  // Procesar datos
  const studArr=Object.entries(studs).sort((a,b)=>a[1].listNumber-b[1].listNumber);
  let byStudent={};let byCategory={};
  Object.values(recs).forEach(dateRecs=>{Object.values(dateRecs).forEach(r=>{
    byStudent[r.studentId]=(byStudent[r.studentId]||{});byStudent[r.studentId][r.category]=(byStudent[r.studentId][r.category]||0)+1;
    byCategory[r.category]=(byCategory[r.category]||0)+1;
  })});

  const{jsPDF}=window.jspdf;
  const doc=new jsPDF();

  // Fondo oscuro
  doc.setFillColor(10,10,10);doc.rect(0,0,210,297,'F');

  // Header CLLASKM
  doc.setTextColor(220,38,38);doc.setFontSize(36);doc.text('CLLASKM',105,25,{align:'center'});
  doc.setTextColor(150,150,150);doc.setFontSize(10);doc.text('SISTEMA DOCENTE — REPORTE ACADÉMICO',105,32,{align:'center'});

  // Línea roja
  doc.setDrawColor(220,38,38);doc.setLineWidth(0.5);doc.line(20,36,190,36);

  // Info curso
  doc.setTextColor(255,255,255);doc.setFontSize(16);doc.text(`${course.name} — ${course.paralelo}`,20,48);
  doc.setTextColor(150,150,150);doc.setFontSize(9);doc.text(`Fecha de generación: ${formatDate(today())}`,20,54);
  doc.text(`Total estudiantes: ${studArr.length} | Total registros: ${Object.values(recs).reduce((a,d)=>a+Object.keys(d).length,0)}`,20,59);

  // Tabla de estudiantes
  const tableBody=studArr.map(([sid,s])=>{
    const sRecs=byStudent[sid]||{};
    const total=Object.values(sRecs).reduce((a,b)=>a+b,0);
    const catCols=Object.keys(cats).map(ck=>sRecs[ck]||0);
    return[s.listNumber,s.name,...catCols,total];
  });

  const catHeaders=Object.keys(cats).map(ck=>cats[ck].name);

  doc.autoTable({
    startY:65,
    head:[['N.','Estudiante',...catHeaders,'Total']],
    body:tableBody,
    theme:'plain',
    styles:{fillColor:[22,22,22],textColor:[255,255,255],fontSize:8,lineColor:[40,40,40],lineWidth:0.5},
    headStyles:{fillColor:[30,30,30],textColor:[220,38,38],fontStyle:'bold',fontSize:8},
    alternateRowStyles:{fillColor:[16,16,16]},
    margin:{left:20,right:20}
  });

  // Ranking
  let finalY=doc.lastAutoTable.finalY+15;
  const rankArr=studArr.map(([sid,s])=>({name:s.name,total:Object.values(byStudent[sid]||{}).reduce((a,b)=>a+b,0)})).sort((a,b)=>b.total-a.total);

  if(finalY<250){
    doc.setTextColor(220,38,38);doc.setFontSize(12);doc.text('Ranking de Participación',20,finalY);
    finalY+=6;
    rankArr.slice(0,10).forEach((r,i)=>{
      doc.setTextColor(i<3?[220,38,38]:[150,150,150]);doc.setFontSize(9);
      doc.text(`${i+1}. ${r.name} — ${r.total} registro(s)`,25,finalY);
      finalY+=5;
    });
  }

  // Observaciones
  const allObs=[];
  Object.entries(obs).forEach(([sid,sObs])=>{Object.values(sObs).forEach(o=>{allObs.push({student:studs[sid]?.name||'?',text:o.text,date:o.date})})});

  if(allObs.length>0&&finalY<270){
    finalY+=5;doc.setTextColor(220,38,38);doc.setFontSize(12);doc.text('Observaciones',20,finalY);finalY+=6;
    allObs.slice(0,15).forEach(o=>{
      doc.setTextColor(150,150,150);doc.setFontSize(8);
      doc.text(`${o.student} (${o.date}): ${o.text}`,25,finalY,{maxWidth:155});finalY+=5;
    });
  }

  // Footer
  doc.setTextColor(80,80,80);doc.setFontSize(7);
  doc.text('Generado por CLLASKM — Sistema Docente Premium',105,290,{align:'center'});

  doc.save(`CLLASKM_${course.name}_${course.paralelo}_${today()}.pdf`);
  showToast('PDF generado correctamente');
}

      </div>
      <div class="text-right">
        <p class="text-xs text-cllm">Record</p>
        <p class="text-lg font-bold text-cllr" id="game-highscore">${localStorage.getItem('cllaskm_hs')||0}</p>
      </div>
    </div>
    <div class="bg-cll3 border border-cllb relative">
      <canvas id="gameCanvas" width="800" height="280" class="w-full" style="max-height:280px"></canvas>
      <div id="game-overlay" class="absolute inset-0 flex items-center justify-center bg-black/60">
        <div class="text-center">
          <h4 class="goth text-4xl red-glow mb-2">BURRITO RUN</h4>
          <p class="text-cllm text-sm mb-1">Espacio / Click — Saltar</p>
          <p class="text-cllm text-sm mb-4">Flecha abajo — Agacharse</p>
          <button class="btn-cll" onclick="startGame()">Iniciar</button>
        </div>
      </div>
    </div>
  </div>`;

  // Inicializar canvas
  const canvas=document.getElementById('gameCanvas');

class BurritoRunGame{
  constructor(canvas){
    this.canvas=canvas;this.ctx=canvas.getContext('2d');
    this.state='idle';this.score=0;this.highScore=parseInt(localStorage.getItem('cllaskm_hs')||'0');
    this.groundY=230;this.speed=4;this.gravity=0.6;this.frameCount=0;
    this.player={x:80,y:this.groundY,vy:0,width:36,height:44,ducking:false,duckH:22};
    this.obstacles=[];this.particles=[];this.groundOffset=0;
    this.animFrame=null;

    // Controles
    this.keyHandler=e=>{
      if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();this.jump()}
      if(e.code==='ArrowDown'){e.preventDefault();this.player.ducking=true}
    };
    this.keyUpHandler=e=>{if(e.code==='ArrowDown')this.player.ducking=false};
    this.clickHandler=()=>{if(this.state==='playing')this.jump()};
    document.addEventListener('keydown',this.keyHandler);
    document.addEventListener('keyup',this.keyUpHandler);
    this.canvas.addEventListener('click',this.clickHandler);
    this.canvas.addEventListener('touchstart',this.clickHandler);

    this.drawIdle();
  }

  drawIdle(){
    const c=this.ctx;
    c.fillStyle='#0A0A0A';c.fillRect(0,0,this.canvas.width,this.canvas.height);
    this.drawGround();
    this.drawPlayer();
  }

  start(){
    this.state='playing';this.score=0;this.speed=4;this.frameCount=0;
    this.player.y=this.groundY;this.player.vy=0;this.player.ducking=false;
    this.obstacles=[];this.particles=[];
    document.getElementById('game-overlay').style.display='none';
    this.loop();
  }

  loop(){
    if(this.state!=='playing')return;
    this.update();this.draw();
    this.animFrame=requestAnimationFrame(()=>this.loop());
  }

  update(){
    this.frameCount++;
    this.speed=4+Math.floor(this.score/500)*0.5;
    this.score++;

    // Jugador
    if(this.player.ducking){
      this.player.height=this.player.duckH;
    }else{
      this.player.height=44;
    }
    this.player.vy+=this.gravity;
    this.player.y+=this.player.vy;
    if(this.player.y>=this.groundY){this.player.y=this.groundY;this.player.vy=0}

    // Obstáculos
    if(this.frameCount%Math.max(50,90-Math.floor(this.score/200))===0){
      const types=['small','medium','tall'];
      const type=types[Math.floor(Math.random()*types.length)];
      const h=type==='small'?20:type==='medium'?35:50;
      const w=type==='small'?18:type==='medium'?22:28;
      this.obstacles.push({x:this.canvas.width+20,y:this.groundY+44-h,width:w,height:h,type});
    }

    this.obstacles.forEach(o=>o.x-=this.speed);
    this.obstacles=this.obstacles.filter(o=>o.x>-50);

    // Colisiones
    const p=this.player;
    const pH=p.ducking?p.duckH:44;
    const pTop=p.y+44-pH;
    this.obstacles.forEach(o=>{
      if(p.x+p.width>o.x&&p.x<o.x+o.width&&p.y+44>o.y&&pTop<o.y+o.height){
        this.gameOver();
      }
    });

    this.groundOffset=(this.groundOffset+this.speed)%20;
  }

  draw(){
    const c=this.ctx;
    c.fillStyle='#0A0A0A';c.fillRect(0,0,this.canvas.width,this.canvas.height);

    // Grid sutil
    c.strokeStyle='rgba(37,37,37,0.5)';c.lineWidth=0.5;
    for(let i=0;i<this.canvas.width;i+=40){c.beginPath();c.moveTo(i-this.groundOffset,0);c.lineTo(i-this.groundOffset,this.canvas.height);c.stroke()}

    this.drawGround();
    this.obstacles.forEach(o=>this.drawObstacle(o));
    this.drawPlayer();

    // Puntaje
    c.fillStyle='#DC2626';c.font='bold 16px Inter';c.textAlign='right';
    c.fillText(this.score.toString().padStart(6,'0'),this.canvas.width-20,30);
    c.textAlign='left';
  }

  drawGround(){
    const c=this.ctx;
    c.strokeStyle='#DC2626';c.lineWidth=2;
    c.beginPath();c.moveTo(0,this.groundY+44);c.lineTo(this.canvas.width,this.groundY+44);c.stroke();
    // Textura
    c.strokeStyle='rgba(220,38,38,0.15)';c.lineWidth=0.5;
    for(let i=0;i<this.canvas.width;i+=20){
      c.beginPath();c.moveTo(i-this.groundOffset,this.groundY+44);c.lineTo(i-this.groundOffset-8,this.groundY+52);c.stroke();
    }
  }

  drawPlayer(){
    const c=this.ctx;const p=this.player;
    const h=p.ducking?p.duckH:44;
    const drawY=p.y+44-h;

    // Cuerpo
    c.fillStyle='#FFFFFF';
    c.fillRect(p.x,drawY,p.width,h);

    // Detalle rojo
    c.fillStyle='#DC2626';
    c.fillRect(p.x,drawY,p.width,3);
    if(!p.ducking){
      c.fillRect(p.x+8,drawY+10,4,4);
      c.fillRect(p.x+20,drawY+10,4,4);
    }

    // Sombra
    c.fillStyle='rgba(220,38,38,0.1)';
    c.fillRect(p.x-2,this.groundY+44,p.width+4,4);
  }

  drawObstacle(o){
    const c=this.ctx;

    if(o.type==='small'){
      // Hoja de papel
      c.fillStyle='#E5E5E5';c.fillRect(o.x,o.y,o.width,o.height);
      c.strokeStyle='#9CA3AF';c.lineWidth=0.5;c.strokeRect(o.x,o.y,o.width,o.height);
      c.beginPath();c.moveTo(o.x+4,o.y+6);c.lineTo(o.x+o.width-4,o.y+6);c.stroke();
      c.beginPath();c.moveTo(o.x+4,o.y+12);c.lineTo(o.x+o.width-4,o.y+12);c.stroke();
    }else if(o.type==='medium'){
      // Libro
      c.fillStyle='#DC2626';c.fillRect(o.x,o.y,o.width,o.height);
      c.fillStyle='#991B1B';c.fillRect(o.x,o.y,4,o.height);
      c.fillStyle='#FFFFFF';c.fillRect(o.x+6,o.y+o.height/2-1,o.width-10,2);
    }else{
      // Cuaderno alto
      c.fillStyle='#FFFFFF';c.fillRect(o.x,o.y,o.width,o.height);
      c.fillStyle='#DC2626';c.fillRect(o.x+o.width-3,o.y,3,o.height);
      for(let i=4;i<o.height;i+=6){c.fillStyle='#D4D4D4';c.fillRect(o.x+3,o.y+i,o.width-8,0.5)}
    }
  }

  jump(){
    if(this.state!=='playing')return;
    if(this.player.y>=this.groundY){this.player.vy=-11}
  }

  gameOver(){
    this.state='gameover';
    if(this.score>this.highScore){
      this.highScore=this.score;
      localStorage.setItem('cllaskm_hs',this.highScore.toString());
    }
    const hsEl=document.getElementById('game-highscore');
    if(hsEl)hsEl.textContent=this.highScore;

    const c=this.ctx;
    c.fillStyle='rgba(0,0,0,0.7)';c.fillRect(0,0,this.canvas.width,this.canvas.height);
    c.fillStyle='#DC2626';c.font='bold 28px Inter';c.textAlign='center';
    c.fillText('FIN DEL JUEGO',this.canvas.width/2,this.canvas.height/2-20);
    c.fillStyle='#FFFFFF';c.font='16px Inter';
    c.fillText(`Puntaje: ${this.score}`,this.canvas.width/2,this.canvas.height/2+10);
    c.fillStyle='#9CA3AF';c.font='12px Inter';
    c.fillText('Clic o Espacio para reiniciar',this.canvas.width/2,this.canvas.height/2+35);
    c.textAlign='left';

    // Click para reiniciar
    const restartHandler=()=>{
      this.canvas.removeEventListener('click',restartHandler);
      this.canvas.removeEventListener('touchstart',restartHandler);
      document.removeEventListener('keydown',restartKeyHandler);
      this.start();
    };
    const restartKeyHandler=e=>{
      if(e.code==='Space'){e.preventDefault();restartHandler()}
    };
    setTimeout(()=>{
      this.canvas.addEventListener('click',restartHandler);
      this.canvas.addEventListener('touchstart',restartHandler);
      document.addEventListener('keydown',restartKeyHandler);
    },500);
  }

  destroy(){
    if(this.animFrame)cancelAnimationFrame(this.animFrame);
    document.removeEventListener('keydown',this.keyHandler);
    document.removeEventListener('keyup',this.keyUpHandler);
    if(this.canvas){
      this.canvas.removeEventListener('click',this.clickHandler);
      this.canvas.removeEventListener('touchstart',this.clickHandler);
    }
  }
}

function startGame(){
  if(state.gameInstance)state.gameInstance.start();
}

      <h4 class="text-lg font-semibold mb-4">Acerca de</h4>
      <div class="bg-cll3 border border-cllb p-5">
        <h5 class="goth text-2xl text-cllr red-glow mb-2">CLLASKM</h5>
        <p class="text-cllm text-sm">Sistema Docente Premium v1.0</p>
        <p class="text-cllm text-xs mt-2">Registro diario de participación, gestión académica visual, estadísticas inteligentes, reportes automáticos y más.</p>
      </div>
    </div>
    <div class="border-t border-cllb pt-8">
      <h4 class="text-lg font-semibold mb-4">Datos</h4>
      <div class="flex gap-3">
        <button class="btn-ghost text-sm" onclick="loadData()"><i class="fa-solid fa-rotate mr-2"></i>Recargar datos</button>
        <button class="btn-ghost text-sm border-red-900 text-red-500" onclick="confirmClearData()"><i class="fa-solid fa-trash mr-2"></i>Limpiar todo</button>
      </div>
    </div>
  </div>`;
}

function deleteCategoryConfirm(cid){
  showModal(`<div class="p-6"><h3 class="goth text-2xl mb-4 text-cllr">Eliminar Tipo</h3>
  <p class="text-cllm mb-6">Se eliminará el tipo <strong class="text-white">${state.categories[cid].name}</strong>.</p>
  <div class="flex justify-end gap-3">
    <button class="btn-ghost text-sm" onclick="hideModal()">Cancelar</button>
    <button class="btn-cll text-sm" onclick="deleteCategory('${cid}')">Eliminar</button>
  </div></div>`);
}

function confirmClearData(){
  showModal(`<div class="p-6"><h3 class="goth text-2xl mb-4 text-cllr">Limpiar Todos los Datos</h3>
  <p class="text-cllm mb-6">Esta acción eliminará todos los cursos, estudiantes, registros y configuraciones. No se puede deshacer.</p>
  <div class="flex justify-end gap-3">
    <button class="btn-ghost text-sm" onclick="hideModal()">Cancelar</button>
    <button class="btn-cll text-sm" onclick="clearAllData()">Limpiar todo</button>
  </div></div>`);
}
async function clearAllData(){
  await fbRemove('');state.courses={};state.categories={};state.students={};state.records={};state.observations={};
  hideModal();showToast('Datos eliminados');loadData();
}

// ============================================
// SIDEBAR NAV
// ============================================
document.querySelectorAll('.sidebar-item').forEach(item=>{
  item.addEventListener('click',()=>{
    const view=item.dataset.view;
    if(view)navigate(view);
  });
});

// ============================================
// INICIALIZACIÓN
// ============================================
(async function init(){
  await loadData();
  navigate('dashboard');
})();
</script>
