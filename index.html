// === SISTEMA DE AUDIO (Web Audio API) ===
const SFX={
  ctx:null,enabled:true,
  init(){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){this.enabled=false}},
  resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()},
  play(type){
    if(!this.enabled||!this.ctx)return;this.resume();
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.connect(g);g.connect(this.ctx.destination);
    const t=this.ctx.currentTime;
    switch(type){
      case'jump':o.type='square';o.frequency.setValueAtTime(350,t);o.frequency.linearRampToValueAtTime(700,t+0.1);g.gain.setValueAtTime(0.12,t);g.gain.linearRampToValueAtTime(0,t+0.15);o.start(t);o.stop(t+0.15);break;
      case'coin':o.type='square';o.frequency.setValueAtTime(880,t);o.frequency.setValueAtTime(1100,t+0.06);g.gain.setValueAtTime(0.1,t);g.gain.linearRampToValueAtTime(0,t+0.15);o.start(t);o.stop(t+0.15);break;
      case'hit':o.type='sawtooth';o.frequency.setValueAtTime(200,t);o.frequency.linearRampToValueAtTime(60,t+0.2);g.gain.setValueAtTime(0.15,t);g.gain.linearRampToValueAtTime(0,t+0.25);o.start(t);o.stop(t+0.25);break;
      case'powerup':o.type='square';o.frequency.setValueAtTime(440,t);o.frequency.linearRampToValueAtTime(880,t+0.1);o.frequency.linearRampToValueAtTime(1320,t+0.2);g.gain.setValueAtTime(0.1,t);g.gain.linearRampToValueAtTime(0,t+0.3);o.start(t);o.stop(t+0.3);break;
      case'die':o.type='sawtooth';o.frequency.setValueAtTime(400,t);o.frequency.linearRampToValueAtTime(80,t+0.5);g.gain.setValueAtTime(0.15,t);g.gain.linearRampToValueAtTime(0,t+0.6);o.start(t);o.stop(t+0.6);break;
      case'boss':o.type='square';o.frequency.setValueAtTime(100,t);o.frequency.setValueAtTime(150,t+0.1);o.frequency.setValueAtTime(100,t+0.2);g.gain.setValueAtTime(0.12,t);g.gain.linearRampToValueAtTime(0,t+0.3);o.start(t);o.stop(t+0.3);break;
      case'win':o.type='square';[523,659,784,1047].forEach((f,i)=>{o.frequency.setValueAtTime(f,t+i*0.12)});g.gain.setValueAtTime(0.1,t);g.gain.linearRampToValueAtTime(0,t+0.55);o.start(t);o.stop(t+0.55);break;
      case'shoot':o.type='square';o.frequency.setValueAtTime(900,t);o.frequency.linearRampToValueAtTime(200,t+0.08);g.gain.setValueAtTime(0.08,t);g.gain.linearRampToValueAtTime(0,t+0.1);o.start(t);o.stop(t+0.1);break;
    }
  }
};

  tracks:[
    // Nivel 1-2: melody synthwave
    ['E4',0,'G4',0,'A4',1,'G4',0,'E4',0,'D4',1,'C4',0,'D4',0,'E4',1,'G4',0,'A4',1,'B4',0,'A4',0,'G4',1,'E4',0,'D4',1,'C4',2],
    // Nivel 3-4: más oscuro
    ['A3',0,'C4',0,'E4',1,'D4',0,'C4',0,'A3',1,'F3',0,'A3',0,'C4',1,'E4',0,'D4',1,'C4',0,'A3',0,'E3',1,'F3',0,'G3',2],
    // Boss
    ['E3',0,'E3',0,'G3',0,'A3',1,'B3',0,'A3',0,'G3',0,'E3',1,'D3',0,'E3',0,'G3',0,'B3',1,'A3',0,'G3',0,'E3',0,'D3',2],
  ],
  trackIdx:0,noteIdx:0,timer:0,tempo:180,
  init(){this.ctx=SFX.ctx},
  play(ti){if(!this.ctx)return;this.stop();this.playing=true;this.trackIdx=ti||0;this.noteIdx=0;this.timer=0;this.tempo=180;this._sched()},
  _sched(){
    if(!this.playing)return;
    const tr=this.tracks[this.trackIdx%this.tracks.length];
    if(this.noteIdx>=tr.length)this.noteIdx=0;
    const n=tr[this.noteIdx],d=tr[this.noteIdx+1];
    if(typeof n==='string'&&this.notes[n]){
      const o=this.ctx.createOscillator(),g=this.ctx.createGain();
      o.type='square';o.frequency.value=this.notes[n];
      o.connect(g);g.connect(this.ctx.destination);
      const t=this.ctx.currentTime,dur=60/this.tempo*(d+1)*0.8;
      g.gain.setValueAtTime(0.04,t);g.gain.linearRampToValueAtTime(0,t+dur);
      o.start(t);o.stop(t+dur);
    }
    this.noteIdx+=2;this.timer=setTimeout(()=>this._sched(),60/this.tempo*1000*(d+1));
  },
  stop(){this.playing=false;clearTimeout(this.timer)}
};

document.addEventListener('keydown',e=>{const k=keyMap[e.code];if(k){Keys[k]=true;if(k==='jump'){jumpPressed=true;jumpReleased=false}e.preventDefault()}});
document.addEventListener('keyup',e=>{const k=keyMap[e.code];if(k){Keys[k]=false;if(k==='jump')jumpReleased=true}});

// Controles táctiles
function setupTouch(id,key){
  const el=document.getElementById(id);if(!el)return;
  const on=()=>{Keys[key]=true;if(key==='jump'){jumpPressed=true;jumpReleased=false}SFX.resume()};
  const off=()=>{Keys[key]=false;if(key==='jump')jumpReleased=true};
  el.addEventListener('touchstart',e=>{e.preventDefault();on()},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();off()},{passive:false});
  el.addEventListener('touchcancel',off);
}
setupTouch('bl','left');setupTouch('br','right');setupTouch('bj','jump');setupTouch('ba','action');setupTouch('bp','pause');

// === PARTÍCULAS ===
const particles=[];
function spawnParticles(x,y,col,count,spd,life){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,s=Math.random()*spd+0.5;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:life||30+Math.random()*20,maxLife:life||50,col,size:1+Math.random()*2});
  }
}
function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.life--;
    if(p.life<=0)particles.splice(i,1);
  }
}
function drawParticles(cx,cy){
  particles.forEach(p=>{
    const a=p.life/p.maxLife;
    ctx.globalAlpha=a;ctx.fillStyle=p.col;
    ctx.fillRect(Math.floor(p.x-cx),Math.floor(p.y-cy),p.size,p.size);
  });
  ctx.globalAlpha=1;
}

// === DEFINICIÓN DE NIVELES ===
// Formato: array 2D de caracteres
// . = vacío, # = sólido, - = plataforma, ^ = pinchos, ~ = lava
// C = núcleo energía, B = chip bonus, K = llave, P = inicio, E = salida
// 1-5 = spawns enemigos, T = checkpoint, W = power-up
// Los power-ups: W1=NeonBoost, W2=PlasmaJump, W3=ShieldMatrix, W4=PulseBlast
function parseLevel(strings){
  const tiles=[],enemies=[],items=[],checkpoints=[];
  let playerStart={x:2,y:10},exitPos={x:40,y:10};
  for(let r=0;r<strings.length;r++){
    tiles[r]=[];
    for(let c=0;c<strings[r].length;c++){
      const ch=strings[r][c];
      switch(ch){
        case'#':tiles[r][c]=1;break;
        case'-':tiles[r][c]=2;break;
        case'^':tiles[r][c]=3;break;
        case'~':tiles[r][c]=4;break;
        case'C':tiles[r][c]=0;items.push({type:'core',x:c*TS,y:r*TS});break;
        case'B':tiles[r][c]=0;items.push({type:'chip',x:c*TS,y:r*TS});break;
        case'K':tiles[r][c]=0;items.push({type:'key',x:c*TS,y:r*TS});break;
        case'P':tiles[r][c]=0;playerStart={x:c*TS,y:r*TS};break;
        case'E':tiles[r][c]=0;exitPos={x:c*TS,y:r*TS};break;
        case'T':tiles[r][c]=0;checkpoints.push({x:c*TS,y:r*TS});break;
        case'1':tiles[r][c]=0;enemies.push({type:'cube',x:c*TS,y:r*TS});break;
        case'2':tiles[r][c]=0;enemies.push({type:'drone',x:c*TS,y:r*TS});break;
        case'3':tiles[r][c]=0;enemies.push({type:'crawler',x:c*TS,y:r*TS});break;
        case'4':tiles[r][c]=0;enemies.push({type:'worm',x:c*TS,y:r*TS});break;
        case'5':tiles[r][c]=0;enemies.push({type:'bot',x:c*TS,y:r*TS});break;
        case'Z':tiles[r][c]=0;enemies.push({type:'boss',x:c*TS,y:r*TS});break;
        case'W':tiles[r][c]=0;items.push({type:'powerup',x:c*TS,y:r*TS,power:Math.floor(Math.random()*4)+1});break;
        case'w':tiles[r][c]=0;items.push({type:'powerup',x:c*TS,y:r*TS,power:1});break;
        case'x':tiles[r][c]=0;items.push({type:'powerup',x:c*TS,y:r*TS,power:2});break;
        case'y':tiles[r][c]=0;items.push({type:'powerup',x:c*TS,y:r*TS,power:3});break;
        case'z':tiles[r][c]=0;items.push({type:'powerup',x:c*TS,y:r*TS,power:4});break;
        default:tiles[r][c]=0;
      }
    }
  }
  return{tiles,enemies,items,checkpoints,playerStart,exitPos,width:strings[0].length,height:strings.length};
}

function createPlayer(x,y){

function createEnemy(type,x,y){
  const base={x,y,vx:0,vy:0,alive:true,hp:1,type,animFrame:0,animTimer:0,timer:0,dir:1};
  switch(type){
    case'cube':return{...base,w:14,h:14,vx:1,dir:1,hp:1};
    case'drone':return{...base,w:12,h:12,vy:0,startY:y,hp:1,flyT:Math.random()*100};

    case'worm':return{...base,w:14,h:14,emerged:false,emergeT:120+Math.random()*120,hp:1};
    case'bot':return{...base,w:14,h:18,vx:1.2,dir:1,hp:2};
    case'boss':return{...base,w:48,h:48,hp:30,phase:1,atkTimer:0,moveT:0};
    default:return base;

}

// === CARGAR NIVEL ===
function loadLevel(idx){
  G.level=idx;G.levelData=parseLevel(LEVEL_STRINGS[idx]);
  G.entities=[];G.projectiles=[];particles.length=0;
  const ld=G.levelData;
  G.player=createPlayer(ld.playerStart.x,ld.playerStart.y);
  G.checkpoint={x:ld.playerStart.x,y:ld.playerStart.y};
  ld.enemies.forEach(e=>{G.entities.push(createEnemy(e.type,e.x,e.y))});
  G.bossAlive=false;
  if(idx===4){
    // Boss
    const be=G.entities.find(e=>e.type==='boss');
    if(be){G.bossAlive=true;G.bossHP=30;G.bossMaxHP=30;G.bossPhase=1;G.bossX=be.x;G.bossY=be.y;G.bossAT=0}
  }
  G.camX=0;G.camY=0;G.glitchT=0;G.glitchActive=false;
  G.powerUp=null;G.powerUpT=0;
}

// === COLISIONES CON TILES ===
function tileAt(tx,ty){
  if(!G.levelData)return 0;
  const t=G.levelData.tiles;
  if(ty<0||ty>=t.length||tx<0||tx>=t[0].length)return 0;
  return t[ty][tx];
}
function isSolid(tx,ty){const v=tileAt(tx,ty);return v===1||v===3||v===4}
function isPlatform(tx,ty){return tileAt(tx,ty)===2}

function moveEntity(e,dx,dy){
  // Mover en X
  e.x+=dx;
  const txL=Math.floor(e.x/TS),txR=Math.floor((e.x+e.w-1)/TS);
  const tyT=Math.floor(e.y/TS),tyB=Math.floor((e.y+e.h-1)/TS);
  for(let ty=tyT;ty<=tyB;ty++){
    if(dx>0&&isSolid(txR,ty)){e.x=txR*TS-e.w;break}
    if(dx<0&&isSolid(txL,ty)){e.x=(txL+1)*TS;break}
  }
  // Mover en Y
  e.y+=dy;e.onGround=false;
  const txL2=Math.floor(e.x/TS),txR2=Math.floor((e.x+e.w-1)/TS);
  const tyT2=Math.floor(e.y/TS),tyB2=Math.floor((e.y+e.h-1)/TS);
  for(let tx=txL2;tx<=txR2;tx++){
    if(dy>0){
      if(isSolid(tx,tyB2)){e.y=tyB2*TS-e.h;e.vy=0;e.onGround=true}
      else if(isPlatform(tx,tyB2)&&e.y+e.h-e.vy<=tyB2*TS+2){e.y=tyB2*TS-e.h;e.vy=0;e.onGround=true}
    }
    if(dy<0&&isSolid(tx,tyT2)){e.y=(tyT2+1)*TS;e.vy=0}
  }
  // Peligro
  const cx=Math.floor((e.x+e.w/2)/TS),cy=Math.floor((e.y+e.h/2)/TS);
  if(tileAt(cx,cy)===3||tileAt(cx,cy)===4)damagePlayer(20);
}

// === DAÑO AL JUGADOR ===
function damagePlayer(amt){
  const p=G.player;if(!p||p.hurtT>0||G.invulnT>0)return;
  if(G.powerUp===3){G.powerUpT=Math.max(0,G.powerUpT-60);spawnParticles(p.x+p.w/2,p.y+p.h/2,C.green,8,2,20);SFX.play('hit');return}
  G.energy=Math.max(0,G.energy-amt);p.hurtT=40;SFX.play('hit');G.shakeT=8;
  spawnParticles(p.x+p.w/2,p.y+p.h/2,'#ff3366',6,2,20);
  if(G.energy<=0){
    G.lives--;p.state='dead';p.deadT=60;SFX.play('die');
    if(G.lives<=0){G.state='gameover';Music.stop();FB.saveScore('FERTO',G.score,G.level+1)}
    else{G.energy=G.maxEnergy;G.invulnT=90}
  }
}

// === ACTUALIZAR JUGADOR ===
function updatePlayer(){
  const p=G.player;if(!p)return;
  if(p.state==='dead'){
    p.deadT--;
    if(p.deadT<=0){
      if(G.lives>0){loadLevel(G.level);G.energy=G.maxEnergy}
    }
    return;
  }
  if(p.hurtT>0)p.hurtT--;
  if(G.invulnT>0)G.invulnT--;

  // Movimiento horizontal
  let targetVx=0;
  if(Keys.left)targetVx=-1;
  if(Keys.right)targetVx=1;

  const spd=G.powerUp===1?RUNSPD:MAXSPD;
  if(targetVx!==0){
    p.vx+=targetVx*ACCEL;
    if(p.vx>spd)p.vx=spd;if(p.vx<-spd)p.vx=-spd;
    p.facing=targetVx;
  }else{
    if(Math.abs(p.vx)<DECEL)p.vx=0;
    else p.vx-=Math.sign(p.vx)*DECEL;
  }

  // Gravedad
  p.vy+=GRAV;if(p.vy>MAXFALL)p.vy=MAXFALL;

  // Coyote time
  if(p.onGround)p.coyoteT=COYOTE;else p.coyoteT=Math.max(0,p.coyoteT-1);

  // Jump buffer
  if(jumpPressed&&jumpReleased){p.jumpBuf=JBUF;jumpReleased=false}
  if(p.jumpBuf>0)p.jumpBuf--;

  // Salto
  if(p.jumpBuf>0&&p.coyoteT>0){
    p.vy=JUMP;p.onGround=false;p.coyoteT=0;p.jumpBuf=0;
    SFX.play('jump');spawnParticles(p.x+p.w/2,p.y+p.h,'#00e5ff',5,1.5,15);
  }else if(G.powerUp===2&&jumpPressed&&p.jumpBuf>0&&!p.onGround&&p.doubleJump){
    p.vy=JUMP*0.85;p.doubleJump=false;p.jumpBuf=0;
    SFX.play('jump');spawnParticles(p.x+p.w/2,p.y+p.h,C.magenta,5,1.5,15);
  }

  if(p.onGround)p.doubleJump=G.powerUp===2;

  // Ataque (Pulse Blast)
  if(Keys.action&&G.powerUp===4&&G.frameCount%12===0){
    const px=p.x+(p.facing>0?p.w:-6);
    G.projectiles.push(createProjectile(px,p.y+p.h/2-2,p.facing*6,0,true,C.magenta));
    SFX.play('shoot');spawnParticles(px,p.y+p.h/2,C.magenta,3,1,10);
  }

  moveEntity(p,p.vx,p.vy);

  // Animación
  p.animTimer++;
  if(Math.abs(p.vx)>0.5&&p.onGround){
    p.state='walk';if(p.animTimer%8===0)p.animFrame=(p.animFrame+1)%4;
  }else if(!p.onGround){
    p.state=p.vy<0?'jump':'fall';p.animFrame=0;
  }else{
    p.state='idle';if(p.animTimer%30===0)p.animFrame=(p.animFrame+1)%2;
  }
  if(p.hurtT>0)p.state='hurt';

  // Recoger items
  const ld=G.levelData;
  for(let i=ld.items.length-1;i>=0;i--){
    const it=ld.items[i];if(it.collected)continue;
    if(Math.abs(p.x+p.w/2-it.x-TS/2)<14&&Math.abs(p.y+p.h/2-it.y-TS/2)<14){
      it.collected=true;SFX.play('coin');
      switch(it.type){
        case'core':G.cores++;G.score+=100;spawnParticles(it.x+TS/2,it.y+TS/2,C.primary,8,2,25);break;
        case'chip':G.score+=500;spawnParticles(it.x+TS/2,it.y+TS/2,C.orange,8,2,25);break;
        case'key':G.keys++;G.score+=250;spawnParticles(it.x+TS/2,it.y+TS/2,C.magenta,10,2,25);break;
        case'powerup':
          G.powerUp=it.power;G.powerUpT=600;SFX.play('powerup');
          spawnParticles(it.x+TS/2,it.y+TS/2,C.green,12,3,30);
          break;
      }
    }
  }

  // Checkpoints
  ld.checkpoints.forEach(cp=>{
    if(!cp.activated&&Math.abs(p.x-cp.x)<24&&Math.abs(p.y-cp.y)<24){
      cp.activated=true;G.checkpoint={x:cp.x,y:cp.y};
      spawnParticles(cp.x+TS/2,cp.y+TS/2,C.green,8,2,20);SFX.play('coin');
    }
  });

  // Salida
  if(Math.abs(p.x+p.w/2-ld.exitPos.x-TS/2)<14&&Math.abs(p.y+p.h/2-ld.exitPos.y-TS/2)<20){
    if(G.level<4){G.state='levelcomplete';SFX.play('win');Music.stop()}
    else{G.state='victory';SFX.play('win');Music.stop();FB.saveScore('FERTO',G.score,5)}
  }

  // Caer al vacío
  if(p.y>G.levelData.height*TS+32){damagePlayer(999)}

  // Power-up timer
  if(G.powerUpT>0){G.powerUpT--;if(G.powerUpT<=0)G.powerUp=null}

  // Límites del nivel
  if(p.x<0)p.x=0;if(p.x>G.levelData.width*TS-p.w)p.x=G.levelData.width*TS-p.w;
}

// === ACTUALIZAR ENEMIGOS ===
function updateEnemies(){
  const p=G.player;if(!p||p.state==='dead')return;
  G.entities.forEach(e=>{
    if(!e.alive)return;
    e.animTimer++;if(e.animTimer%15===0)e.animFrame=(e.animFrame+1)%4;
    switch(e.type){
      case'cube':
        e.x+=e.vx*e.dir;
        if(isSolid(Math.floor((e.x+(e.dir>0?e.w:0))/TS),Math.floor((e.y+e.h/2)/TS)))e.dir*=-1;
        if(!isSolid(Math.floor((e.x+(e.dir>0?e.w:0))/TS),Math.floor((e.y+e.h+2)/TS))&&e.onGround!==false)e.dir*=-1;
        break;
      case'drone':
        e.flyT+=0.04;e.y=e.startY+Math.sin(e.flyT)*20;
        e.x+=Math.cos(e.flyT*0.5)*0.5;
        break;
      case'crawler':
        e.x+=e.vx*e.dir;
        if(isSolid(Math.floor((e.x+(e.dir>0?e.w:0))/TS),Math.floor(e.y/TS)))e.dir*=-1;
        break;
      case'worm':
        e.emergeT--;
        if(e.emergeT<=0){e.emerged=!e.emerged;e.emergeT=e.emerged?80:120+Math.random()*80}
        break;
      case'bot':
        e.dir=p.x>e.x?1:-1;e.vx+=(e.dir*1.2-e.vx)*0.05;e.x+=e.vx;
        if(isSolid(Math.floor((e.x+(e.dir>0?e.w:0))/TS),Math.floor((e.y+e.h/2)/TS)))e.vx*=-0.5;
        break;
      case'boss':
        updateBoss(e);return;
    }
    // Colisión con jugador
    if(e.type!=='worm'||e.emerged){
      if(p.hurtT<=0&&G.invulnT<=0&&p.x+p.w>e.x&&p.x<e.x+e.w&&p.y+p.h>e.y&&p.y<e.y+e.h){
        // ¿Pisó al enemigo?
        if(p.vy>0&&p.y+p.h-e.y<8&&e.type!=='drone'){
          e.alive=false;p.vy=JUMP*0.6;G.score+=200;
          SFX.play('hit');spawnParticles(e.x+e.w/2,e.y+e.h/2,C.magenta,8,2,20);
        }else{damagePlayer(15)}
      }
    }
    // Proyectil del jugador
    G.projectiles.forEach(pr=>{
      if(!pr.alive||!pr.fromPlayer)return;
      if(e.type!=='worm'||e.emerged){
        if(pr.x+pr.w>e.x&&pr.x<e.x+e.w&&pr.y+pr.h>e.y&&pr.y<e.y+e.h){
          e.hp--;pr.alive=false;
          if(e.hp<=0){e.alive=false;G.score+=200;spawnParticles(e.x+e.w/2,e.y+e.h/2,C.magenta,8,2,20);SFX.play('hit')}
          else{spawnParticles(e.x+e.w/2,e.y+e.h/2,'#ffffff',4,1.5,15)}
        }
      }
    });
  });
}

// === JEFE FINAL ===
function updateBoss(e){
  const p=G.player;if(!p||p.state==='dead')return;
  G.bossAT++;
  // Fase basada en HP
  if(G.bossHP<=10)G.bossPhase=3;
  else if(G.bossHP<=20)G.bossPhase=2;

  // Movimiento
  e.x=G.bossX+Math.sin(G.bossAT*0.02)*40;
  e.y=G.bossY+Math.cos(G.bossAT*0.015)*20;

  // Ataques por fase
  const atkInterval=G.bossPhase===3?40:G.bossPhase===2?60:80;
  if(G.bossAT%atkInterval===0){
    // Disparar rayo
    const dx=p.x-e.x,dy=p.y-e.y,dist=Math.sqrt(dx*dx+dy*dy)||1;
    G.projectiles.push(createProjectile(e.x+e.w/2,e.y+e.h,dx/dist*3,dy/dist*3,false,C.magenta));
    SFX.play('boss');
  }
  if(G.bossPhase>=2&&G.bossAT%180===0){
    // Invocar enemigo
    G.entities.push(createEnemy('cube',e.x+Math.random()*40,e.y+e.h+8));
  }
  if(G.bossPhase>=3&&G.bossAT%120===0){
    // Colapsar plataforma - efecto visual
    G.shakeT=10;SFX.play('hit');
  }

  // Colisión con proyectiles del jugador
  G.projectiles.forEach(pr=>{
    if(!pr.alive||!pr.fromPlayer)return;
    if(pr.x+pr.w>e.x&&pr.x<e.x+e.w&&pr.y+pr.h>e.y&&pr.y<e.y+e.h){
      G.bossHP--;pr.alive=false;G.shakeT=4;
      spawnParticles(pr.x,pr.y,'#ffffff',5,2,15);SFX.play('hit');
      if(G.bossHP<=0){
        e.alive=false;G.bossAlive=false;G.score+=2000;
        spawnParticles(e.x+e.w/2,e.y+e.h/2,C.magenta,20,4,40);
        spawnParticles(e.x+e.w/2,e.y+e.h/2,C.primary,15,3,35);
        SFX.play('win');
      }
    }
  });

  // Colisión con jugador
  if(p.hurtT<=0&&G.invulnT<=0&&p.x+p.w>e.x&&p.x<e.x+e.w&&p.y+p.h>e.y&&p.y<e.y+e.h){
    if(p.vy>0&&p.y+p.h-e.y<12){G.bossHP-=2;p.vy=JUMP*0.6;G.shakeT=6;SFX.play('hit');spawnParticles(e.x+e.w/2,e.y,C.primary,8,2,20)}
    else damagePlayer(25);
  }
}

// === ACTUALIZAR PROYECTILES ===
function updateProjectiles(){
  for(let i=G.projectiles.length-1;i>=0;i--){
    const p=G.projectiles[i];
    p.x+=p.vx;p.y+=p.vy;p.life--;
    if(p.life<=0||p.x<G.camX-50||p.x>G.camX+VW+50||p.y<G.camY-50||p.y>G.camY+VH+50){p.alive=false}
    if(!p.alive){G.projectiles.splice(i,1);continue}
    // Proyectil enemigo contra jugador
    if(!p.fromPlayer){
      const pl=G.player;
      if(pl&&pl.state!=='dead'&&pl.hurtT<=0&&pl.x+pl.w>p.x&&pl.x<p.x+p.w&&pl.y+pl.h>p.y&&pl.y<p.y+p.h){
        damagePlayer(15);p.alive=false;G.projectiles.splice(i,1);
      }
    }
    // Proyectil contra tiles sólidos
    const tx=Math.floor(p.x/TS),ty=Math.floor(p.y/TS);
    if(isSolid(tx,ty)){p.alive=false;G.projectiles.splice(i,1)}
  }
}

// === CÁMARA ===
function updateCamera(){
  const p=G.player;if(!p)return;
  const targetX=p.x+p.w/2-VW/2;
  const targetY=p.y+p.h/2-VH/2;
  G.camX+=(targetX-G.camX)*0.1;
  G.camY+=(targetY-G.camY)*0.08;
  G.camX=Math.max(0,Math.min(G.camX,G.levelData.width*TS-VW));
  G.camY=Math.max(0,Math.min(G.camY,G.levelData.height*TS-VH));
  // Shake
  if(G.shakeT>0){G.shakeX=(Math.random()-0.5)*G.shakeT;G.shakeY=(Math.random()-0.5)*G.shakeT;G.shakeT--}
  else{G.shakeX=0;G.shakeY=0}
}

// === RENDERIZADO ===
function drawBg(){
  const lvl=G.level;
  // Gradiente de fondo
  const grd=ctx.createLinearGradient(0,0,0,VH);
  if(lvl===0){grd.addColorStop(0,'#0a0a1a');grd.addColorStop(1,'#1a0a2e')}
  else if(lvl===1){grd.addColorStop(0,'#0a0a1a');grd.addColorStop(1,'#0a1a2e')}
  else if(lvl===2){grd.addColorStop(0,'#0a0014');grd.addColorStop(1,'#1a0028')}
  else if(lvl===3){grd.addColorStop(0,'#1a0a0a');grd.addColorStop(1,'#0a0a1a')}
  else{grd.addColorStop(0,'#0a000a');grd.addColorStop(1,'#1a001a')}
  ctx.fillStyle=grd;ctx.fillRect(0,0,VW,VH);

  // Estrellas / grid parallax
  ctx.fillStyle='rgba(0,229,255,0.3)';
  for(let i=0;i<30;i++){
    const sx=((i*57+G.frameCount*0.1*(0.2+i%3*0.1))%VW);
    const sy=((i*43+i*17)%VH);
    ctx.fillRect(sx,sy,1,1);
  }
  // Grid synthwave parallax
  ctx.strokeStyle='rgba(255,0,170,0.08)';ctx.lineWidth=1;
  const gridOff=(G.camX*0.2)%40;
  for(let x=-gridOff;x<VW;x+=40){ctx.beginPath();ctx.moveTo(x,VH*0.6);ctx.lineTo(x,VH);ctx.stroke()}
  for(let y=VH*0.6;y<VH;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(VW,y);ctx.stroke()}

  // Edificios silueta parallax
  ctx.fillStyle='rgba(10,10,30,0.8)';
  const bldOff=G.camX*0.15;
  for(let i=0;i<12;i++){
    const bx=((i*55-bldOff)%700+700)%700-50;
    const bh=40+Math.sin(i*3.7)*25;
    ctx.fillRect(bx,VH*0.7-bh,30+Math.sin(i*2.3)*10,bh+VH*0.3);
    // Ventanas
    ctx.fillStyle='rgba(0,229,255,0.15)';
    for(let wy=VH*0.7-bh+4;wy<VH*0.7;wy+=8){
      for(let wx=bx+4;wx<bx+25;wx+=7){
        if(Math.sin(wx*wy)>0)ctx.fillRect(wx,wy,3,4);
      }
    }
    ctx.fillStyle='rgba(10,10,30,0.8)';
  }
}

function drawTiles(){
  const ld=G.levelData;const cx=Math.floor(G.camX),cy=Math.floor(G.camY);
  const sx=Math.max(0,Math.floor(cx/TS)),ex=Math.min(ld.width-1,Math.floor((cx+VW)/TS)+1);
  const sy=Math.max(0,Math.floor(cy/TS)),ey=Math.min(ld.height-1,Math.floor((cy+VH)/TS)+1);
  for(let ty=sy;ty<=ey;ty++){
    for(let tx=sx;tx<=ex;tx++){
      const v=ld.tiles[ty][tx];
      if(v===0)continue;
      const dx=tx*TS-cx,dy=ty*TS-cy;
      if(v===1){
        // Bloque sólido - estilo por nivel
        const colors=[['#1a1a3e','#2a2a5e'],['#1a2a3e','#2a3a5e'],['#1a1a28','#2a2a38'],['#2a1a1a','#3a2a2a'],['#1a0a1a','#2a1a2a']];
        ctx.fillStyle=colors[G.level%5][0];ctx.fillRect(dx,dy,TS,TS);
        ctx.fillStyle=colors[G.level%5][1];ctx.fillRect(dx+1,dy+1,TS-2,TS-2);
        // Borde brillante
        ctx.fillStyle=G.level===4?'rgba(255,0,170,0.3)':'rgba(0,229,255,0.15)';
        ctx.fillRect(dx,dy,TS,1);ctx.fillRect(dx,dy,1,TS);
      }else if(v===2){
        // Plataforma
        ctx.fillStyle='#2a2a5e';ctx.fillRect(dx,dy,TS,4);
        ctx.fillStyle=C.primary;ctx.fillRect(dx,dy,TS,1);
      }else if(v===3){
        // Pinchos
        ctx.fillStyle='#ff3366';
        for(let s=0;s<4;s++)ctx.fillRect(dx+s*4,dy+8,3,8);
        ctx.fillStyle='#ff6699';
        for(let s=0;s<4;s++)ctx.fillRect(dx+s*4,dy+8,3,2);
      }else if(v===4){
        // Lava/energía
        const lt=(G.frameCount*0.05+tx*0.3)%1;
        ctx.fillStyle=`rgba(255,0,100,${0.5+Math.sin(lt*Math.PI*2)*0.3})`;
        ctx.fillRect(dx,dy,TS,TS);
      }
    }
  }
}

function drawItems(){
  const cx=Math.floor(G.camX),cy=Math.floor(G.camY);
  G.levelData.items.forEach(it=>{
    if(it.collected)return;
    const dx=it.x-cx,dy=it.y-cy;
    if(dx<-TS||dx>VW+TS||dy<-TS||dy>VH+TS)return;
    const bob=Math.sin(G.frameCount*0.06+it.x*0.1)*3;
    switch(it.type){
      case'core':
        ctx.fillStyle=C.primary;ctx.fillRect(dx+4,dy+4+bob,8,8);
        ctx.fillStyle='#ffffff';ctx.fillRect(dx+5,dy+5+bob,3,3);
        break;
      case'chip':
        ctx.fillStyle=C.orange;ctx.fillRect(dx+3,dy+5+bob,10,6);
        ctx.fillStyle='#ffaa44';ctx.fillRect(dx+5,dy+6+bob,2,4);
        break;
      case'key':
        ctx.fillStyle=C.magenta;ctx.fillRect(dx+4,dy+3+bob,6,4);
        ctx.fillRect(dx+6,dy+7+bob,2,6);
        ctx.fillRect(dx+6,dy+11+bob,4,2);
        break;
      case'powerup':
        const pcols=[C.primary,C.magenta,C.green,C.orange];
        ctx.fillStyle=pcols[(it.power||1)-1];
        ctx.fillRect(dx+2,dy+2+bob,12,12);
        ctx.fillStyle='#ffffff';ctx.fillRect(dx+5,dy+5+bob,6,6);
        break;
    }
  });
  // Checkpoints
  G.levelData.checkpoints.forEach(cp=>{
    const dx=cp.x-cx,dy=cp.y-cy;
    ctx.fillStyle=cp.activated?C.green:'#333344';
    ctx.fillRect(dx+6,dy,4,16);
    ctx.fillStyle=cp.activated?C.primary:'#555566';
    ctx.fillRect(dx+3,dy,10,4);
  });
}

function drawFERTO(){
  const p=G.player;if(!p)return;
  const cx=Math.floor(G.camX),cy=Math.floor(G.camY);
  let dx=Math.floor(p.x-cx),dy=Math.floor(p.y-cy);
  // Parpadeo cuando dañado
  if(p.hurtT>0&&G.frameCount%4<2)return;
  if(G.invulnT>0&&G.frameCount%3<1)return;

  ctx.save();
  if(p.facing<0){ctx.translate(dx+p.w,dy);ctx.scale(-1,1);dx=0;dy=0}
  else{ctx.translate(dx,dy);dx=0;dy=0}

  const s=1; // escala pixel
  // Antena
  ctx.fillStyle=C.primary;ctx.fillRect(5*s,-4*s,2*s,4*s);
  ctx.fillStyle='#ffffff';ctx.fillRect(5*s,-5*s,2*s,2*s);

  // Cabeza
  ctx.fillStyle='#1a1a3e';ctx.fillRect(1*s,0*s,10*s,8*s);
  // LED rostro
  ctx.fillStyle='#0a1a2e';ctx.fillRect(2*s,1*s,8*s,6*s);
  // Ojos
  const eyeCol=p.hurtT>0?'#ff3366':G.powerUp===1?C.orange:G.powerUp===3?C.green:C.primary;
  ctx.fillStyle=eyeCol;
  const eyeOff=p.state==='walk'?Math.sin(G.frameCount*0.3)*1:0;
  ctx.fillRect(3*s,(2+eyeOff)*s,2*s,2*s);
  ctx.fillRect(7*s,(2+eyeOff)*s,2*s,2*s);
  // Boca
  if(p.state==='hurt'){ctx.fillStyle='#ff3366';ctx.fillRect(4*s,5*s,4*s,1*s)}
  else if(p.state==='jump'){ctx.fillStyle=C.primary;ctx.fillRect(4*s,5*s,4*s,1*s)}
  else{ctx.fillStyle=C.primary;ctx.fillRect(5*s,5*s,2*s,1*s)}

  // Cuerpo
  ctx.fillStyle='#2a2a5e';ctx.fillRect(2*s,8*s,8*s,6*s);
  // Detalle torso
  ctx.fillStyle=C.primary;ctx.fillRect(5*s,9*s,2*s,3*s);

  // Brazos
  const armSwing=p.state==='walk'?Math.sin(G.frameCount*0.3)*2:0;
  ctx.fillStyle='#3a3a6e';
  ctx.fillRect(0*s,(9+armSwing)*s,2*s,4*s);
  ctx.fillRect(10*s,(9-armSwing)*s,2*s,4*s);

  // Piernas
  const legOff=p.state==='walk'?Math.sin(G.frameCount*0.3)*2:0;
  ctx.fillStyle='#2a2a5e';
  ctx.fillRect(3*s,(14+legOff)*s,2*s,4*s);
  ctx.fillRect(7*s,(14-legOff)*s,2*s,4*s);

  // Botas neón
  ctx.fillStyle=C.primary;
  ctx.fillRect(2*s,(17+legOff)*s,3*s,3*s);
  ctx.fillRect(7*s,(17-legOff)*s,3*s,3*s);

  // Glow del power-up activo
  if(G.powerUp&&G.powerUpT>0){
    const gcols=[C.primary,C.magenta,C.green,C.orange];
    ctx.fillStyle=gcols[G.powerUp-1];ctx.globalAlpha=0.15+Math.sin(G.frameCount*0.1)*0.1;
    ctx.fillRect(-2*s,-6*s,16*s,26*s);ctx.globalAlpha=1;
  }

  ctx.restore();
}

function drawEnemy(e){
  const cx=Math.floor(G.camX),cy=Math.floor(G.camY);
  const dx=Math.floor(e.x-cx),dy=Math.floor(e.y-cy);
  if(dx<-60||dx>VW+60||dy<-60||dy>VH+60)return;

  switch(e.type){
    case'cube':
      ctx.fillStyle='#3a0a3a';ctx.fillRect(dx,dy,e.w,e.h);
      ctx.fillStyle=C.magenta;ctx.fillRect(dx+1,dy+1,e.w-2,e.h-2);
      ctx.fillStyle='#ff66aa';ctx.fillRect(dx+3,dy+3,3,3);ctx.fillRect(dx+8,dy+3,3,3);
      break;
    case'drone':
      ctx.fillStyle='#1a1a3e';ctx.fillRect(dx,dy+4,e.w,6);
      ctx.fillStyle=C.primary;
      ctx.fillRect(dx+2,dy,e.w-4,4);
      ctx.fillRect(dx-2,dy+6,3,2);ctx.fillRect(dx+e.w-1,dy+6,3,2);
      ctx.fillStyle='#ff3366';ctx.fillRect(dx+4,dy+5,2,2);
      break;
    case'crawler':
      ctx.fillStyle='#1a3a1a';ctx.fillRect(dx,dy,e.w,e.h);
      ctx.fillStyle=C.green;ctx.fillRect(dx+1,dy+1,e.w-2,e.h-2);
      ctx.fillStyle='#003300';ctx.fillRect(dx+2,dy+3,3,2);ctx.fillRect(dx+8,dy+3,3,2);
      break;
    case'worm':
      if(!e.emerged){
        ctx.fillStyle='rgba(106,13,173,0.3)';ctx.fillRect(dx+2,dy+6,e.w-4,e.h-6);
        ctx.fillStyle=C.violet;ctx.fillRect(dx+4,dy+8,2,2);
      }else{
        ctx.fillStyle=C.violet;ctx.fillRect(dx,dy,e.w,e.h);
        ctx.fillStyle='#ffffff';ctx.fillRect(dx+3,dy+3,3,3);ctx.fillRect(dx+8,dy+3,3,3);
        ctx.fillStyle='#2a0040';ctx.fillRect(dx+1,dy+1,e.w-2,2);
      }
      break;
    case'bot':
      ctx.fillStyle='#3a1a0a';ctx.fillRect(dx,dy,e.w,e.h);
      ctx.fillStyle=C.orange;ctx.fillRect(dx+1,dy+1,e.w-2,e.h-2);
      ctx.fillStyle='#ff0000';ctx.fillRect(dx+3,dy+4,3,2);ctx.fillRect(dx+8,dy+4,3,2);
      ctx.fillStyle='#1a1a3e';ctx.fillRect(dx+5,dy+e.h-4,4,4);
      break;
    case'boss':
      drawBoss(e,dx,dy);break;
  }
}

function drawBoss(e,dx,dy){
  // Cuerpo principal - cubos corruptos
  const phase=G.bossPhase;
  const t=G.frameCount*0.05;
  // Cubos flotantes
  for(let i=0;i<8;i++){
    const ox=Math.sin(t+i*0.8)*12;
    const oy=Math.cos(t+i*1.1)*8;
    const sz=8+Math.sin(t+i)*3;
    ctx.fillStyle=phase===3?'#ff0044':phase===2?C.magenta:'#6a0dad';
    ctx.globalAlpha=0.6+Math.sin(t+i)*0.3;
    ctx.fillRect(dx+e.w/2-sz/2+ox,dy+e.h/2-sz/2+oy,sz,sz);
  }
  ctx.globalAlpha=1;
  // Núcleo central
  ctx.fillStyle=phase===3?'#ff0044':phase===2?C.magenta:C.violet;
  ctx.fillRect(dx+12,dy+12,e.w-24,e.h-24);
  ctx.fillStyle=phase===3?'#ff6688':'#ffffff';
  ctx.fillRect(dx+18,dy+18,12,12);
  // Ojos
  ctx.fillStyle='#ff0000';
  ctx.fillRect(dx+16,dy+20,6,4);ctx.fillRect(dx+26,dy+20,6,4);
  // Aura
  ctx.strokeStyle=phase===3?'rgba(255,0,68,0.4)':phase===2?'rgba(255,0,170,0.3)':'rgba(106,13,173,0.3)';
  ctx.lineWidth=2;
  ctx.strokeRect(dx-4+Math.sin(t)*3,dy-4+Math.cos(t)*3,e.w+8,e.h+8);
  // Barra de vida del jefe
  const bw=60,bh=4,bx=dx+e.w/2-bw/2,by=dy-12;
  ctx.fillStyle='#330011';ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle=phase===3?'#ff0044':phase===2?C.magenta:C.violet;
  ctx.fillRect(bx,by,bw*(G.bossHP/G.bossMaxHP),bh);
  ctx.fillStyle='#ffffff';ctx.fillRect(bx,by,bw,1);
}

function drawProjectiles(){
  const cx=Math.floor(G.camX),cy=Math.floor(G.camY);
  G.projectiles.forEach(p=>{
    const dx=Math.floor(p.x-cx),dy=Math.floor(p.y-cy);
    ctx.fillStyle=p.col;ctx.fillRect(dx,dy,p.w,p.h);
    ctx.fillStyle='#ffffff';ctx.fillRect(dx+1,dy+1,p.w-2,p.h-2);
  });
}

function drawExit(){
  const ld=G.levelData;if(!ld)return;
  const cx=Math.floor(G.camX),cy=Math.floor(G.camY);
  const dx=ld.exitPos.x-cx,dy=ld.exitPos.y-cy;
  const pulse=Math.sin(G.frameCount*0.08)*0.3+0.7;
  ctx.fillStyle=`rgba(0,255,136,${pulse*0.3})`;ctx.fillRect(dx-2,dy-2,TS+4,TS+4);
  ctx.fillStyle=C.green;ctx.fillRect(dx,dy,TS,TS);
  ctx.fillStyle='#ffffff';ctx.fillRect(dx+3,dy+3,TS-6,TS-6);
  ctx.fillStyle=C.green;ctx.font='8px monospace';
  ctx.fillText(G.level<4?'EXIT':'WIN',dx-2,dy-4);
}

// === HUD ===
function drawHUD(){
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,VW,18);
  // Logo
  ctx.fillStyle=C.primary;ctx.font='bold 10px monospace';ctx.fillText('FERTO',4,12);
  // Vidas
  ctx.fillStyle=C.magenta;ctx.font='9px monospace';
  let hx=52;
  for(let i=0;i<G.lives;i++){ctx.fillText('♥',hx,12);hx+=10}
  // Energía
  ctx.fillStyle='#1a1a2e';ctx.fillRect(90,4,50,8);
  const ePct=G.energy/G.maxEnergy;
  ctx.fillStyle=ePct>0.5?C.primary:ePct>0.25?C.orange:'#ff3366';
  ctx.fillRect(90,4,50*ePct,8);
  ctx.strokeStyle=C.primary;ctx.strokeRect(90,4,50,8);
  // Score
  ctx.fillStyle='#ffffff';ctx.font='9px monospace';ctx.fillText(`${G.score}`,150,12);
  // Nivel
  ctx.fillStyle=C.violet;ctx.fillText(`L${G.level+1}`,210,12);
  // Cores
  ctx.fillStyle=C.primary;ctx.fillText(`◆${G.cores}`,240,12);
  // Keys
  if(G.keys>0){ctx.fillStyle=C.magenta;ctx.fillText(`♧${G.keys}`,275,12)}
  // Power-up
  if(G.powerUp){
    const pNames=['BOOST','D-JUMP','SHIELD','BLAST'];
    const pCols=[C.primary,C.magenta,C.green,C.orange];
    ctx.fillStyle=pCols[G.powerUp-1];ctx.font='8px monospace';
    ctx.fillText(pNames[G.powerUp-1],VW-60,12);
    // Timer bar
    const pPct=G.powerUpT/600;
    ctx.fillStyle=pCols[G.powerUp-1];ctx.fillRect(VW-60,14,50*pPct,2);
  }
}

// === MENÚ PRINCIPAL ===
function drawMenu(){
  // Fondo animado
  const grd=ctx.createLinearGradient(0,0,0,VH);
  grd.addColorStop(0,'#0a0014');grd.addColorStop(0.5,'#1a0028');grd.addColorStop(1,'#0a0a14');
  ctx.fillStyle=grd;ctx.fillRect(0,0,VW,VH);

  // Grid animado
  ctx.strokeStyle='rgba(255,0,170,0.12)';ctx.lineWidth=1;
  const gt=G.frameCount*0.5;
  for(let x=-gt%40;x<VW;x+=40){ctx.beginPath();ctx.moveTo(x,VH*0.55);ctx.lineTo(x,VH);ctx.stroke()}
  for(let y=VH*0.55;y<VH;y+=15){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(VW,y);ctx.stroke()}

  // Estrellas
  for(let i=0;i<50;i++){
    ctx.fillStyle=`rgba(0,229,255,${0.2+Math.sin(G.frameCount*0.02+i)*0.2})`;
    ctx.fillRect((i*73+G.frameCount*0.1)%VW,(i*47)%VH,1,1);
  }

  // Título FERTO
  const titleY=55+Math.sin(G.frameCount*0.03)*4;
  // Glow
  ctx.fillStyle=C.primary;ctx.globalAlpha=0.08;
  ctx.fillRect(VW/2-60,titleY-5,120,28);ctx.globalAlpha=1;
  // Texto
  ctx.fillStyle=C.primary;ctx.font='bold 32px monospace';ctx.textAlign='center';
  ctx.fillText('FERTO',VW/2,titleY+22);
  ctx.fillStyle='#ffffff';ctx.font='bold 31px monospace';
  ctx.fillText('FERTO',VW/2,titleY+21);
  // Subtítulo
  ctx.fillStyle=C.magenta;ctx.font='9px monospace';
  ctx.fillText('NEOTRON 2088',VW/2,titleY+36);

  // Opciones del menú
  const opts=['JUGAR','CONTINUAR','CONTROLES','PUNTOS'];
  opts.forEach((o,i)=>{
    const oy=120+i*20;
    const sel=G.menuSel===i;
    if(sel){
      ctx.fillStyle=C.primary;ctx.globalAlpha=0.15;
      ctx.fillRect(VW/2-60,oy-6,120,16);ctx.globalAlpha=1;
      ctx.fillStyle=C.primary;
      // Cursor
      ctx.fillText('▸',VW/2-50,oy+5);
    }
    ctx.fillStyle=sel?'#ffffff':'#555577';ctx.font=sel?'bold 11px monospace':'10px monospace';
    ctx.fillText(o,VW/2,oy+5);
  });

  ctx.textAlign='left';
  G.menuBlink++;
}

// === AJUSTE DE PANTALLA ===
function resize(){
  const w=window.innerWidth,h=window.innerHeight;
  const aspect=VW/VH;
  let cw,ch;
  if(w/h>aspect){ch=h;cw=h*aspect}else{cw=w;ch=w/aspect}
  canvas.width=VW;canvas.height=VH;
  canvas.style.width=Math.floor(cw)+'px';
  canvas.style.height=Math.floor(ch)+'px';
  scale=cw/VW;
}
window.addEventListener('resize',resize);

// === MANEJO DE ESTADOS DE ENTRADA ===
function handleMenuInput(){
  if(Keys.jump&&jumpReleased){
    jumpPressed=true;
    SFX.resume();
    switch(G.menuSel){
      case 0: // Jugar
        G.state='playing';G.lives=3;G.score=0;G.energy=G.maxEnergy;G.cores=0;G.keys=0;G.powerUp=null;G.powerUpT=0;
        loadLevel(0);Music.play(0);break;
      case 1: // Continuar
        G.state='playing';G.lives=Math.max(1,G.lives);G.energy=G.maxEnergy;
        loadLevel(G.level);Music.play(G.level%3);break;
      case 2: // Controles
        G.state='controls';break;
      case 3: // Leaderboard
        G.state='credits';FB.loadScores();break;
    }
  }
  if(Keys.pause){G.state='controls'}
}
function handlePlayingInput(){
  if(Keys.pause){G.state='paused';Music.stop()}
}
function handlePausedInput(){
  if(Keys.pause){G.state='playing';Music.play(G.level%3)}
}
function handleGameOverInput(){
  if(Keys.jump){G.state='menu';G.menuSel=0;FB.loadScores()}
}
function handleLevelCompleteInput(){
  if(Keys.jump){
    G.level++;G.energy=G.maxEnergy;
    loadLevel(G.level);
    G.state='playing';Music.play(G.level%3);
  }
}
function handleVictoryInput(){
  if(Keys.jump){G.state='menu';G.menuSel=0;FB.loadScores()}
}
function handleControlsInput(){
  if(Keys.pause||Keys.jump){G.state='menu'}
}
function handleCreditsInput(){
  if(Keys.pause||Keys.jump){G.state='menu'}
}

// Navegación menú con teclas
let menuCD=0;
function handleMenuNavigation(){
  if(menuCD>0){menuCD--;return}
  if(Keys.left||Keys.up){G.menuSel=(G.menuSel-1+4)%4;menuCD=10;SFX.play('coin')}
  if(Keys.right||Keys.down){G.menuSel=(G.menuSel+1)%4;menuCD=10;SFX.play('coin')}
}

// === BUCLE PRINCIPAL ===
function update(){
  G.frameCount++;
  switch(G.state){
    case'menu':handleMenuNavigation();handleMenuInput();break;
    case'playing':
      handlePlayingInput();
      updatePlayer();updateEnemies();updateProjectiles();updateParticles();updateCamera();
      break;
    case'paused':handlePausedInput();break;
    case'gameover':handleGameOverInput();updateParticles();break;
    case'levelcomplete':handleLevelCompleteInput();updateParticles();break;
    case'victory':handleVictoryInput();updateParticles();break;
    case'controls':handleControlsInput();break;
    case'credits':handleCreditsInput();break;
  }
  // Reset de input de salto
  if(!Keys.jump)jumpReleased=true;
  jumpPressed=false;
}

function render(){
  ctx.clearRect(0,0,VW,VH);
  switch(G.state){
    case'menu':drawMenu();break;
    case'playing':
      ctx.save();ctx.translate(G.shakeX,G.shakeY);
      drawBg();drawTiles();drawExit();drawItems();
      G.entities.forEach(e=>{if(e.alive)drawEnemy(e)});
      drawProjectiles();drawFERTO();drawParticles(G.camX,G.camY);
      ctx.restore();drawHUD();
      // Efecto glitch en nivel 3
      if(G.level===2&&G.frameCount%300<10){
        ctx.fillStyle=`rgba(255,0,170,${0.05+Math.random()*0.1})`;
        ctx.fillRect(0,Math.random()*VH,VW,2+Math.random()*6);
      }
      break;
    case'paused':drawBg();drawTiles();drawFERTO();drawHUD();drawPause();break;
    case'gameover':drawGameOver();drawParticles(0,0);break;
    case'levelcomplete':drawLevelComplete();drawParticles(0,0);break;
    case'victory':drawVictory();drawParticles(0,0);break;
    case'controls':drawControls();break;
    case'credits':drawLeaderboard();break;
  }
}

function gameLoop(){
  update();render();requestAnimationFrame(gameLoop);
}

// === TOQUE EN PANTALLA PARA MENÚ ===
canvas.addEventListener('click',()=>{
  SFX.resume();
  if(G.state==='menu'){jumpPressed=true;Keys.jump=true;setTimeout(()=>{Keys.jump=false},100)}
  else if(G.state==='gameover'||G.state==='victory'){jumpPressed=true;Keys.jump=true;setTimeout(()=>{Keys.jump=false},100)}
  else if(G.state==='levelcomplete'){jumpPressed=true;Keys.jump=true;setTimeout(()=>{Keys.jump=false},100)}
  else if(G.state==='controls'||G.state==='credits'){Keys.pause=true;setTimeout(()=>{Keys.pause=false},100)}
});

// Swipe para menú
let touchStartY=0;
canvas.addEventListener('touchstart',e=>{touchStartY=e.touches[0].clientY},{passive:true});
canvas.addEventListener('touchend',e=>{
  const dy=e.changedTouches[0].clientY-touchStartY;
  if(Math.abs(dy)>30){
    if(dy<0)G.menuSel=Math.min(3,G.menuSel+1);
    else G.menuSel=Math.max(0,G.menuSel-1);
    SFX.play('coin');
  }
},{passive:true});

// === INICIALIZACIÓN ===
function init(){
  resize();SFX.init();Music.init();
  FB.signInAnon();FB.loadScores();
  G.state='menu';G.menuSel=0;
  gameLoop();
}
window.onload=init;
