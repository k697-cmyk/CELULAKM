<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLLASKM – Administración Docente</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{colors:{sRed:'#da251d',sBlack:'#0a0a0a',sDark:'#111111',sCard:'#1a1a1a',sBorder:'#2a2a2a',sMuted:'#777'},fontFamily:{display:['"Bebas Neue"','sans-serif'],body:['"Inter"','sans-serif']}}}}
</script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#111}
::-webkit-scrollbar-thumb{background:#da251d;border-radius:3px}
body{background:#0a0a0a;color:#fff;font-family:'Inter',sans-serif;overflow-x:hidden}
.nav-link.active{background:#da251d22;color:#da251d;border-left:3px solid #da251d}
.nav-link:not(.active){border-left:3px solid transparent}
.logo-box{background:#da251d;display:inline-block;padding:6px 18px;border:2px solid #fff;animation:logoPulse 3s ease-in-out infinite}
@keyframes logoPulse{0%,100%{box-shadow:0 0 0 0 rgba(218,37,29,.4)}50%{box-shadow:0 0 20px 4px rgba(218,37,29,.2)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideRight{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.anim-fadeUp{animation:fadeUp .4s ease both}
.anim-fadeIn{animation:fadeIn .3s ease both}
.anim-slideRight{animation:slideRight .4s ease both}
.anim-scaleIn{animation:scaleIn .3s ease both}
.stagger-1{animation-delay:.05s}.stagger-2{animation-delay:.1s}.stagger-3{animation-delay:.15s}.stagger-4{animation-delay:.2s}
.card-hover{transition:all .2s ease}
.card-hover:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(218,37,29,.15);border-color:#da251d44}
.btn-red{background:#da251d;color:#fff;font-weight:700;transition:all .15s ease}
.btn-red:hover{background:#b91c1c;transform:scale(1.02)}
.btn-red:active{transform:scale(.98)}
.btn-outline{border:1.5px solid #2a2a2a;color:#ccc;transition:all .15s ease}
.btn-outline:hover{border-color:#da251d;color:#da251d}
.record-btn{font-size:.7rem;padding:4px 10px;border-radius:4px;font-weight:600;transition:all .12s ease;border:1.5px solid #2a2a2a;background:transparent;color:#aaa;cursor:pointer;white-space:nowrap}
.record-btn:hover{border-color:#da251d;color:#da251d;transform:scale(1.05)}
.record-btn:active{transform:scale(.95);background:#da251d22}
.toast{animation:toastIn .3s ease,toastOut .3s ease 2.7s both}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(40px)}}
.modal-enter{animation:scaleIn .25s ease}
.cal-day{transition:all .15s ease}.cal-day:hover{background:#da251d22}
.cal-day.has-records{background:#da251d33;border-color:#da251d}
.cal-day.today{border:2px solid #da251d}
input,textarea,select{background:#1a1a1a;border:1.5px solid #2a2a2a;color:#fff;border-radius:6px;padding:10px 14px;font-family:'Inter',sans-serif;font-size:.875rem;transition:border-color .15s ease;outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:#da251d}
.stat-card{position:relative;overflow:hidden}
.stat-card::after{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;opacity:.07;background:#da251d}
table{border-collapse:separate;border-spacing:0}
th{background:#1a1a1a;color:#999;font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em}
td,th{padding:10px 14px;border-bottom:1px solid #2a2a2a;text-align:left}
tr:hover td{background:#ffffff05}
@media(max-width:1023px){#sidebar{transform:translateX(-100%)}#sidebar.open{transform:translateX(0)}}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:#da251d;animation:pulse 1.5s ease infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
</style>
</head>
<body class="flex min-h-screen">

<!-- Sidebar -->
<aside id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-sDark border-r border-sBorder z-50 transition-transform duration-300 lg:translate-x-0 flex flex-col">
<div class="p-5 border-b border-sBorder">
<div class="logo-box cursor-pointer" onclick="navigateTo('dashboard')">
<span class="font-display text-white text-2xl tracking-[.18em]">CLLASKM</span>
</div>
<p class="text-sMuted text-xs mt-2 tracking-wider">ADMINISTRACION DOCENTE</p>
</div>
<nav class="flex-1 p-3 space-y-1" id="nav-links">
<a data-nav="dashboard" class="nav-link active flex items-center gap-3 px-4 py-3 rounded cursor-pointer text-sm font-medium"><i class="fas fa-th-large w-5 text-center"></i><span>Dashboard</span></a>
<a data-nav="courses" class="nav-link flex items-center gap-3 px-4 py-3 rounded cursor-pointer text-sm font-medium"><i class="fas fa-graduation-cap w-5 text-center"></i><span>Cursos</span></a>
<a data-nav="calendar" class="nav-link flex items-center gap-3 px-4 py-3 rounded cursor-pointer text-sm font-medium"><i class="fas fa-calendar-alt w-5 text-center"></i><span>Calendario</span></a>
<a data-nav="statistics" class="nav-link flex items-center gap-3 px-4 py-3 rounded cursor-pointer text-sm font-medium"><i class="fas fa-chart-bar w-5 text-center"></i><span>Estadisticas</span></a>
<a data-nav="reports" class="nav-link flex items-center gap-3 px-4 py-3 rounded cursor-pointer text-sm font-medium"><i class="fas fa-file-pdf w-5 text-center"></i><span>Reportes</span></a>
<a data-nav="config" class="nav-link flex items-center gap-3 px-4 py-3 rounded cursor-pointer text-sm font-medium"><i class="fas fa-cog w-5 text-center"></i><span>Configuracion</span></a>
</nav>
<div class="p-4 border-t border-sBorder text-xs text-sMuted">
<div class="flex items-center gap-2"><div class="pulse-dot"></div><span>En linea</span></div>
</div>
</aside>

<!-- Overlay movil -->
<div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>

<!-- Contenido principal -->
<div class="flex-1 lg:ml-64 min-h-screen flex flex-col">
<header class="sticky top-0 z-30 bg-sBlack/85 backdrop-blur-lg border-b border-sBorder px-4 sm:px-6 py-4 flex items-center justify-between">
<div class="flex items-center gap-4">
<button onclick="toggleSidebar()" class="lg:hidden text-white text-xl"><i class="fas fa-bars"></i></button>
<h1 id="page-title" class="font-display text-xl sm:text-2xl tracking-wider">DASHBOARD</h1>
</div>
<div class="text-sMuted text-xs sm:text-sm" id="date-display"></div>
</header>
<main id="content" class="flex-1 p-4 sm:p-6"></main>
</div>

<!-- Modal -->
<div id="modal-overlay" class="fixed inset-0 bg-black/75 z-[60] flex items-center justify-center p-4 hidden" onclick="event.target===this&&closeModal()">
<div id="modal-content" class="bg-sDark border border-sBorder rounded-lg max-w-lg w-full max-h-[90vh] overflow-y-auto modal-enter"></div>
</div>

<!-- Toasts -->
<div id="toast-container" class="fixed bottom-6 right-6 z-[70] space-y-2 pointer-events-none"></div>

<!-- Pantalla de carga -->
<div id="loading-screen" class="fixed inset-0 bg-sBlack z-[100] flex flex-col items-center justify-center">
<div class="logo-box mb-6"><span class="font-display text-white text-4xl tracking-[.2em]">CLLASKM</span></div>
<div class="w-48 h-1 bg-sBorder rounded overflow-hidden"><div class="h-full bg-sRed rounded" style="animation:loadBar 1.5s ease forwards"></div></div>
<style>@keyframes loadBar{0%{width:0}100%{width:100%}}</style>
</div>

<script>
/* =========================================
   FIREBASE - Inicialización
   ========================================= */
const firebaseConfig={apiKey:"AIzaSyCDmWUBk7bpTI-sIEYqHn_sTCaYTSuekLA",authDomain:"celulakmt.firebaseapp.com",databaseURL:"https://celulakmt-default-rtdb.firebaseio.com",projectId:"celulakmt",storageBucket:"celulakmt.firebasestorage.app",messagingSenderId:"623088700057",appId:"1:623088700057:web:fffb8fccbae5ff6d834608",measurementId:"G-CY1HY229XX"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
let authReady=false;

/* Autenticación anónima para permitir escrituras */
firebase.auth().signInAnonymously().then(()=>{authReady=true;initApp()}).catch(e=>{console.error('Auth error:',e);authReady=true;initApp()});

/* =========================================
   ESTADO GLOBAL
   ========================================= */
const state={
    currentView:'dashboard',
    courses:{},
    students:{},
    records:{},
    observations:{},
    customButtons:{},
    selectedCourseId:null,
    calendarDate:new Date(),
    searchQuery:'',
    charts:{}
};

/* =========================================
   UTILIDADES
   ========================================= */
function uid(){return db.ref().push().key}
function now(){const d=new Date();return{date:d.toISOString().split('T')[0],time:d.toTimeString().split(' ')[0],timestamp:d.getTime()}}
function formatDate(ds){if(!ds)return'';const p=ds.split('-');return`${p[2]}/${p[1]}/${p[0]}`}
function getCourse(id){return state.courses[id]||null}
function getStudents(courseId){return Object.entries(state.students[courseId]||{}).sort((a,b)=>(a[1].listNumber||0)-(b[1].listNumber||0))}
function getRecords(courseId,studentId){return Object.entries(state.records[courseId]?.[studentId]||[])}
function getAllRecords(courseId){const r=[];Object.entries(state.records[courseId]||{}).forEach(([,sRecs])=>{Object.entries(sRecs||{}).forEach(([,rec])=>{r.push(rec)})});return r}
function getObservations(courseId,studentId){return Object.entries(state.observations[courseId]?.[studentId]||{}).sort((a,b)=>(b[1].timestamp||0)-(a[1].timestamp||0))}
function getStudentRecordCounts(courseId){
    const counts={};
    const btns=Object.values(state.customButtons).sort((a,b)=>(a.order||0)-(b.order||0));
    getStudents(courseId).forEach(([sId,s])=>{counts[sId]={name:s.name,listNumber:s.listNumber,total:0,byType:{}};btns.forEach(b=>{counts[sId].byType[b.label]=0});getRecords(courseId,sId).forEach(([,r])=>{counts[sId].total++;if(counts[sId].byType[r.type]!==undefined)counts[sId].byType[r.type]++})});
    return counts;
}

/* =========================================
   TOAST
   ========================================= */
function showToast(msg,type='success'){
    const c=document.getElementById('toast-container');
    const colors={success:'border-green-500 bg-green-500/10',error:'border-red-500 bg-red-500/10',info:'border-blue-500 bg-blue-500/10'};
    const icons={success:'fa-check-circle text-green-400',error:'fa-exclamation-circle text-red-400',info:'fa-info-circle text-blue-400'};
    const t=document.createElement('div');
    t.className=`toast pointer-events-auto flex items-center gap-3 px-5 py-3 rounded-lg border ${colors[type]||colors.success} backdrop-blur-sm`;
    t.innerHTML=`<i class="fas ${icons[type]||icons.success}"></i><span class="text-sm font-medium">${msg}</span>`;
    c.appendChild(t);
    setTimeout(()=>t.remove(),3000);
}

/* =========================================
   MODAL
   ========================================= */
function openModal(html){
    document.getElementById('modal-content').innerHTML=html;
    document.getElementById('modal-overlay').classList.remove('hidden');
}
function closeModal(){document.getElementById('modal-overlay').classList.add('hidden')}

/* =========================================
   SIDEBAR
   ========================================= */
function toggleSidebar(){
    const s=document.getElementById('sidebar');
    const o=document.getElementById('sidebar-overlay');
    s.classList.toggle('open');
    o.classList.toggle('hidden');
}

/* =========================================
   NAVEGACIÓN
   ========================================= */
function navigateTo(view,params={}){
    state.currentView=view;
    if(params.courseId)state.selectedCourseId=params.courseId;
    if(params.date)state.calendarDate=params.date;
    state.searchQuery='';
    /* Actualizar nav activo */
    document.querySelectorAll('.nav-link').forEach(l=>{l.classList.toggle('active',l.dataset.nav===view)});
    /* Cerrar sidebar en móvil */
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.add('hidden');
    /* Destruir charts previos */
    Object.values(state.charts).forEach(c=>{try{c.destroy()}catch(e){}});
    state.charts={};
    render();
}

/* =========================================
   FIREBASE LISTENERS
   ========================================= */
function setupListeners(){
    db.ref('courses').on('value',snap=>{state.courses=snap.val()||{};render()});
    db.ref('students').on('value',snap=>{state.students=snap.val()||{};render()});
    db.ref('records').on('value',snap=>{state.records=snap.val()||{};render()});
    db.ref('observations').on('value',snap=>{state.observations=snap.val()||{};render()});
    db.ref('customButtons').on('value',snap=>{
        state.customButtons=snap.val()||{};
        /* Crear botones por defecto si no existen */
        if(Object.keys(state.customButtons).length===0){initDefaultButtons()}
        render();
    });
}

function initDefaultButtons(){
    const defaults=['Participo','Expuso','Entrego tarea'];
    defaults.forEach((label,i)=>{db.ref('customButtons/'+uid()).set({label,order:i})});
}

/* =========================================
   CRUD - CURSOS
   ========================================= */
function createCourse(name,paralelo){
    const id=uid();db.ref('courses/'+id).set({name,paralelo,createdAt:Date.now()});showToast('Curso creado');closeModal();return id;
}
function updateCourse(id,name,paralelo){db.ref('courses/'+id).update({name,paralelo});showToast('Curso actualizado');closeModal()}
function deleteCourse(id){
    openModal(`<div class="p-6"><h3 class="font-display text-xl tracking-wider mb-4">ELIMINAR CURSO</h3><p class="text-sMuted text-sm mb-6">Se eliminaran todos los estudiantes, registros y observaciones.</p><div class="flex gap-3 justify-end"><button onclick="closeModal()" class="btn-outline px-5 py-2 rounded text-sm">Cancelar</button><button onclick="confirmDeleteCourse('${id}')" class="btn-red px-5 py-2 rounded text-sm">Eliminar</button></div></div>`);
}
function confirmDeleteCourse(id){
    db.ref('courses/'+id).remove();
    db.ref('students/'+id).remove();
    db.ref('records/'+id).remove();
    db.ref('observations/'+id).remove();
    closeModal();showToast('Curso eliminado','info');navigateTo('dashboard');
}

/* =========================================
   CRUD - ESTUDIANTES
   ========================================= */
function addStudent(courseId,listNumber,name){
    const id=uid();db.ref('students/'+courseId+'/'+id).set({listNumber:parseInt(listNumber),name});showToast('Estudiante agregado');closeModal();
}
function updateStudent(courseId,sId,listNumber,name){
    db.ref('students/'+courseId+'/'+sId).update({listNumber:parseInt(listNumber),name});showToast('Estudiante actualizado');closeModal();
}
function deleteStudent(courseId,sId){
    db.ref('students/'+courseId+'/'+sId).remove();
    db.ref('records/'+courseId+'/'+sId).remove();
    db.ref('observations/'+courseId+'/'+sId).remove();
    showToast('Estudiante eliminado','info');
}

/* =========================================
   REGISTROS
   ========================================= */
function addRecord(courseId,studentId,type){
    const t=now();db.ref('records/'+courseId+'/'+studentId+'/'+uid()).set({type,date:t.date,time:t.time,timestamp:t.timestamp});
    showToast(`${type} registrado`);
}

/* =========================================
   OBSERVACIONES
   ========================================= */
function addObservation(courseId,studentId,text){
    if(!text.trim())return;const t=now();db.ref('observations/'+courseId+'/'+studentId+'/'+uid()).set({text:text.trim(),date:t.date,time:t.time,timestamp:t.timestamp});showToast('Observacion guardada');closeModal();
}
function openObservations(courseId,studentId,studentName){
    const obs=getObservations(courseId,studentId);
    let obsHtml=obs.length?obs.map(([,o])=>`<div class="border-b border-sBorder py-3 last:border-0"><p class="text-sm">${o.text}</p><span class="text-xs text-sMuted">${formatDate(o.date)} ${o.time||''}</span></div>`).join(''):'<p class="text-sMuted text-sm py-4 text-center">Sin observaciones</p>';
    openModal(`<div class="p-6"><h3 class="font-display text-xl tracking-wider mb-1">OBSERVACIONES</h3><p class="text-sMuted text-sm mb-4">${studentName}</p><div class="max-h-48 overflow-y-auto mb-4">${obsHtml}</div><textarea id="obs-text" placeholder="Escribir observacion..." rows="3" class="mb-4"></textarea><button onclick="addObservation('${courseId}','${studentId}',document.getElementById('obs-text').value)" class="btn-red w-full py-2 rounded text-sm">Guardar Observacion</button></div>`);
}

/* =========================================
   BOTONES PERSONALIZADOS
   ========================================= */
function addCustomButton(label){
    const id=uid();const order=Object.keys(state.customButtons).length;
    db.ref('customButtons/'+id).set({label,order});showToast('Boton agregado');closeModal();
}
function deleteCustomButton(id){db.ref('customButtons/'+id).remove();showToast('Boton eliminado','info')}

/* =========================================
   RENDER PRINCIPAL
   ========================================= */
let renderTimeout=null;
function render(){
    clearTimeout(renderTimeout);
    renderTimeout=setTimeout(_render,50);
}
function _render(){
    const viewTitles={dashboard:'DASHBOARD',courses:'CURSOS','course-detail':'CURSO',calendar:'CALENDARIO',statistics:'ESTADISTICAS',reports:'REPORTES',config:'CONFIGURACION'};
    document.getElementById('page-title').textContent=viewTitles[state.currentView]||'CLLASKM';
    const d=new Date();
    document.getElementById('date-display').textContent=d.toLocaleDateString('es-ES',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
    const content=document.getElementById('content');
    switch(state.currentView){
        case 'dashboard':content.innerHTML=renderDashboard();break;
        case 'courses':content.innerHTML=renderCourses();break;
        case 'course-detail':content.innerHTML=renderCourseDetail();break;
        case 'calendar':content.innerHTML=renderCalendar();break;
        case 'statistics':content.innerHTML=renderStatistics();setTimeout(initCharts,100);break;
        case 'reports':content.innerHTML=renderReports();break;
        case 'config':content.innerHTML=renderConfig();break;
        default:content.innerHTML=renderDashboard();
    }
}

/* =========================================
   VISTA: DASHBOARD
   ========================================= */
function renderDashboard(){
    const courseList=Object.entries(state.courses);
    let totalStudents=0;let totalRecords=0;const today=now().date;
    let todayRecords=0;
    courseList.forEach(([cId])=>{
        totalStudents+=Object.keys(state.students[cId]||{}).length;
        const recs=state.records[cId]||{};
        Object.values(recs).forEach(sRecs=>{Object.values(sRecs||{}).forEach(r=>{totalRecords++;if(r.date===today)todayRecords++})});
    });
    return `
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
        <div class="stat-card bg-sCard border border-sBorder rounded-lg p-5 anim-fadeUp stagger-1">
            <p class="text-sMuted text-xs uppercase tracking-wider mb-1">Cursos</p>
            <p class="font-display text-4xl text-white">${courseList.length}</p>
        </div>
        <div class="stat-card bg-sCard border border-sBorder rounded-lg p-5 anim-fadeUp stagger-2">
            <p class="text-sMuted text-xs uppercase tracking-wider mb-1">Estudiantes</p>
            <p class="font-display text-4xl text-white">${totalStudents}</p>
        </div>
        <div class="stat-card bg-sCard border border-sBorder rounded-lg p-5 anim-fadeUp stagger-3">
            <p class="text-sMuted text-xs uppercase tracking-wider mb-1">Registros hoy</p>
            <p class="font-display text-4xl text-sRed">${todayRecords}</p>
        </div>
        <div class="stat-card bg-sCard border border-sBorder rounded-lg p-5 anim-fadeUp stagger-4">
            <p class="text-sMuted text-xs uppercase tracking-wider mb-1">Total registros</p>
            <p class="font-display text-4xl text-white">${totalRecords}</p>
        </div>
    </div>
    <div class="flex items-center justify-between mb-6">
        <h2 class="font-display text-2xl tracking-wider">MIS CURSOS</h2>
        <button onclick="openCreateCourseModal()" class="btn-red px-6 py-3 rounded-lg text-sm flex items-center gap-2"><i class="fas fa-plus"></i> Crear Curso</button>
    </div>
    ${courseList.length===0?`
    <div class="text-center py-20 anim-fadeUp">
        <div class="w-20 h-20 mx-auto mb-4 rounded-full bg-sCard border border-sBorder flex items-center justify-center"><i class="fas fa-graduation-cap text-3xl text-sMuted"></i></div>
        <p class="text-sMuted mb-4">No tienes cursos aun</p>
        <button onclick="openCreateCourseModal()" class="btn-red px-8 py-3 rounded-lg text-sm">Crear primer curso</button>
    </div>`:`
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
        ${courseList.map(([cId,c],i)=>`
        <div class="bg-sCard border border-sBorder rounded-lg p-5 card-hover cursor-pointer anim-fadeUp stagger-${(i%4)+1}" onclick="navigateTo('course-detail',{courseId:'${cId}'})">
            <div class="flex items-start justify-between mb-3">
                <div><h3 class="font-bold text-lg">${c.name}</h3><span class="text-sRed text-sm font-semibold">${c.paralelo}</span></div>
                <div class="flex gap-1" onclick="event.stopPropagation()">
                    <button onclick="openEditCourseModal('${cId}')" class="text-sMuted hover:text-white text-xs p-1"><i class="fas fa-pen"></i></button>
                    <button onclick="deleteCourse('${cId}')" class="text-sMuted hover:text-sRed text-xs p-1"><i class="fas fa-trash"></i></button>
                </div>
            </div>
            <div class="flex gap-4 text-xs text-sMuted">
                <span><i class="fas fa-users mr-1"></i>${Object.keys(state.students[cId]||{}).length} estudiantes</span>
                <span><i class="fas fa-clipboard-list mr-1"></i>${getAllRecords(cId).length} registros</span>
            </div>
        </div>`).join('')}
    </div>`}`;
}

/* =========================================
   VISTA: CURSOS
   ========================================= */

/* =========================================
   VISTA: CALENDARIO
   ========================================= */
function renderCalendar(){
    const d=state.calendarDate;
    const year=d.getFullYear(),month=d.getMonth();
    const firstDay=new Date(year,month,1).getDay();
    const daysInMonth=new Date(year,month+1,0).getDate();
    const today=new Date();const todayStr=today.toISOString().split('T')[0];
    const monthNames=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    const dayNames=['Do','Lu','Ma','Mi','Ju','Vi','Sa'];
    /* Contar registros por día */
    const recordsByDay={};
    Object.values(state.records).forEach(courseRecs=>{
        Object.values(courseRecs).forEach(sRecs=>{Object.values(sRecs||{}).forEach(r=>{if(r.date){recordsByDay[r.date]=(recordsByDay[r.date]||0)+1}})});
    });
    let daysHtml='';
    /* Espacios vacíos antes del día 1 */
    for(let i=0;i<firstDay;i++)daysHtml+=`<div class="p-2 min-h-[70px]"></div>`;
    for(let day=1;day<=daysInMonth;day++){
        const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const recCount=recordsByDay[dateStr]||0;
        const isToday=dateStr===todayStr;
        daysHtml+=`<div class="cal-day border border-sBorder rounded-lg p-2 min-h-[70px] ${recCount?'has-records':''} ${isToday?'today':''}" onclick="showDayDetail('${dateStr}')">
            <div class="flex items-center justify-between mb-1"><span class="text-sm font-medium ${isToday?'text-sRed':'text-white'}">${day}</span>${recCount?`<span class="text-[10px] bg-sRed text-white px-1.5 py-0.5 rounded-full font-bold">${recCount}</span>`:''}</div>
            ${recCount?'<div class="text-[10px] text-sMuted"><i class="fas fa-clipboard-check text-sRed mr-1"></i>Actividad</div>':''}
        </div>`;
    }
    return `
    <div class="anim-fadeUp">
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-4">
                <button onclick="state.calendarDate=new Date(state.calendarDate.getFullYear(),state.calendarDate.getMonth()-1,1);render()" class="btn-outline w-10 h-10 rounded-lg flex items-center justify-center"><i class="fas fa-chevron-left"></i></button>
                <h2 class="font-display text-2xl tracking-wider">${monthNames[month]} ${year}</h2>
                <button onclick="state.calendarDate=new Date(state.calendarDate.getFullYear(),state.calendarDate.getMonth()+1,1);render()" class="btn-outline w-10 h-10 rounded-lg flex items-center justify-center"><i class="fas fa-chevron-right"></i></button>
            </div>
            <button onclick="state.calendarDate=new Date();render()" class="btn-outline px-4 py-2 rounded text-sm">Hoy</button>
        </div>
        <div class="bg-sCard border border-sBorder rounded-lg p-4">
            <div class="grid grid-cols-7 gap-1 mb-2">${dayNames.map(d=>`<div class="text-center text-xs text-sMuted font-semibold uppercase py-1">${d}</div>`).join('')}</div>
            <div class="grid grid-cols-7 gap-1">${daysHtml}</div>
        </div>
    </div>`;
}

function showDayDetail(dateStr){
    const details=[];
    Object.entries(state.courses).forEach(([cId,course])=>{
        const recs=state.records[cId]||{};
        Object.entries(recs).forEach(([sId,sRecs])=>{
            Object.values(sRecs||{}).forEach(r=>{
                if(r.date===dateStr){
                    const student=(state.students[cId]||{})[sId];
                    if(student)details.push({course:course.name+' - '+course.paralelo,student:student.name,type:r.type,time:r.time||''});
                }
            });
        });
    });
    const html=details.length?details.map(d=>`<div class="border-b border-sBorder py-3 last:border-0"><div class="flex items-center gap-2 mb-1"><span class="bg-sRed/20 text-sRed text-xs px-2 py-0.5 rounded font-semibold">${d.type}</span><span class="text-xs text-sMuted">${d.time}</span></div><p class="text-sm font-medium">${d.student}</p><p class="text-xs text-sMuted">${d.course}</p></div>`).join(''):'<p class="text-sMuted text-sm text-center py-6">Sin actividad este dia</p>';
    openModal(`<div class="p-6"><h3 class="font-display text-xl tracking-wider mb-1">ACTIVIDAD DEL DIA</h3><p class="text-sMuted text-sm mb-4">${formatDate(dateStr)}</p>${html}</div>`);
}

function initCharts(){
    const cId=state.selectedCourseId;
    if(!cId||!getCourse(cId))return;
    const counts=getStudentRecordCounts(cId);
    const entries=Object.entries(counts).sort((a,b)=>b[1].total-a[1].total);
    const btns=Object.values(state.customButtons).sort((a,b)=>(a.order||0)-(b.order||0));
    const colors=['#da251d','#ff6b35','#ffc107','#4caf50','#2196f3','#9c27b0','#e91e63','#00bcd4','#8bc34a','#ff5722'];

    /* Gráfico de barras */
    const barCtx=document.getElementById('chart-bar');
    if(barCtx){
        state.charts.bar=new Chart(barCtx,{type:'bar',data:{labels:entries.map(([,c])=>c.name.substring(0,15)),datasets:[{label:'Total registros',data:entries.map(([,c])=>c.total),backgroundColor:'#da251d',borderRadius:4,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#777',font:{size:10}},grid:{color:'#2a2a2a'}},y:{ticks:{color:'#777'},grid:{color:'#2a2a2a'}}}}});
    }

    /* Gráfico de dona */
    const doughCtx=document.getElementById('chart-doughnut');
    if(doughCtx){
        const typeCounts={};btns.forEach(b=>{typeCounts[b.label]=0});
        entries.forEach(([,c])=>{Object.entries(c.byType).forEach(([t,v])=>{typeCounts[t]=(typeCounts[t]||0)+v})});
        state.charts.doughnut=new Chart(doughCtx,{type:'doughnut',data:{labels:Object.keys(typeCounts),datasets:[{data:Object.values(typeCounts),backgroundColor:colors.slice(0,Object.keys(typeCounts).length),borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#aaa',padding:12,font:{size:11}}}}}});
    }

    /* Gráfico de línea - actividad semanal */
    const lineCtx=document.getElementById('chart-line');
    if(lineCtx){
        const weekData=[];const labels=[];
        for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const ds=d.toISOString().split('T')[0];labels.push(d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric'}));let count=0;Object.values(state.records[cId]||{}).forEach(sRecs=>{Object.values(sRecs||{}).forEach(r=>{if(r.date===ds)count++})});weekData.push(count)}
        state.charts.line=new Chart(lineCtx,{type:'line',data:{labels,datasets:[{label:'Registros',data:weekData,borderColor:'#da251d',backgroundColor:'rgba(218,37,29,0.1)',fill:true,tension:.4,pointBackgroundColor:'#da251d',pointRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#777'},grid:{color:'#2a2a2a'}},y:{ticks:{color:'#777'},grid:{color:'#2a2a2a'},beginAtZero:true}}}});
    }

    /* Ranking */
    const rankEl=document.getElementById('ranking-list');
    if(rankEl){
        const top=entries.slice(0,10);
        const maxTotal=top[0]?.[1]?.total||1;
        rankEl.innerHTML=top.length?top.map(([sId,c],i)=>`<div class="flex items-center gap-3 py-2 ${i>0?'border-t border-sBorder':''}"><span class="font-display text-lg ${i<3?'text-sRed':'text-sMuted'} w-8">${i+1}</span><span class="flex-1 text-sm font-medium truncate">${c.name}</span><div class="w-24 h-2 bg-sBorder rounded-full overflow-hidden"><div class="h-full bg-sRed rounded-full" style="width:${Math.max(2,(c.total/maxTotal)*100)}%"></div></div><span class="text-sm font-display text-sRed w-8 text-right">${c.total}</span></div>`).join(''):'<p class="text-sMuted text-sm text-center py-4">Sin datos</p>';
    }

    /* Menor participación */
    const lowEl=document.getElementById('lowest-list');
    if(lowEl){
        const lowest=entries.filter(([,c])=>c.total>0).slice().sort((a,b)=>a[1].total-b[1].total).slice(0,5);
        lowEl.innerHTML=lowest.length?`<div class="grid sm:grid-cols-5 gap-3">${lowest.map(([sId,c])=>`<div class="bg-sBlack border border-sBorder rounded-lg p-4 text-center"><p class="text-sm font-medium truncate mb-1">${c.name}</p><p class="font-display text-2xl text-sRed">${c.total}</p><p class="text-xs text-sMuted">registros</p></div>`).join('')}</div>`:'<p class="text-sMuted text-sm text-center py-4">Sin datos suficientes</p>';
    }
}

/* =========================================
   EXPORTAR PDF
   ========================================= */
function exportCoursePDF(cId){
    const course=getCourse(cId);if(!course)return;
    const students=getStudents(cId);
    const btns=Object.values(state.customButtons).sort((a,b)=>(a.order||0)-(b.order||0));
    const counts=getStudentRecordCounts(cId);
    const allRecs=getAllRecords(cId);
    const{jsPDF}=window.jspdf;
    const doc=new jsPDF();
    let y=15;

    /* Header con logo CLLASKM */
    doc.setFillColor(218,37,29);
    doc.rect(14,y,55,14,'F');
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold');
    doc.setFontSize(18);
    doc.text('CLLASKM',41.5,y+10,{align:'center'});
    doc.setTextColor(0,0,0);
    doc.setFontSize(10);
    doc.setFont('helvetica','normal');
    doc.text(`Curso: ${course.name} - ${course.paralelo}`,75,y+5);
    doc.text(`Fecha: ${new Date().toLocaleDateString('es-ES')}`,75,y+11);
    y+=22;

    /* Línea separadora */
    doc.setDrawColor(218,37,29);doc.setLineWidth(0.8);doc.line(14,y,196,y);y+=8;

    /* Resumen */
    doc.setFontSize(12);doc.setFont('helvetica','bold');doc.text('Resumen General',14,y);y+=7;
    doc.setFontSize(9);doc.setFont('helvetica','normal');
    doc.text(`Total de estudiantes: ${students.length}`,14,y);y+=5;
    doc.text(`Total de registros: ${allRecs.length}`,14,y);y+=5;
    const avg=students.length?(allRecs.length/students.length).toFixed(1):'0';
    doc.text(`Promedio de registros por estudiante: ${avg}`,14,y);y+=10;

    /* Tabla de estudiantes */
    doc.setFontSize(12);doc.setFont('helvetica','bold');doc.text('Registro de Estudiantes',14,y);y+=5;
    const tableHead=[['#','Nombre',...btns.map(b=>b.label),'Total']];
    const tableBody=students.map(([sId,s])=>{
        const ct=counts[sId]||{total:0,byType:{}};
        return[s.listNumber,s.name,...btns.map(b=>ct.byType[b.label]||0),ct.total];
    });
    doc.autoTable({startY:y,head:tableHead,body:tableBody,theme:'grid',headStyles:{fillColor:[218,37,29],textColor:[255,255,255],fontStyle:'bold',fontSize:8},bodyStyles:{fontSize:8},alternateRowStyles:{fillColor:[245,245,245]},margin:{left:14,right:14}});
    y=doc.lastAutoTable.finalY+10;

    /* Ranking */
    if(y>240){doc.addPage();y=15}
    doc.setFontSize(12);doc.setFont('helvetica','bold');doc.text('Ranking de Participacion',14,y);y+=5;
    const sorted=Object.entries(counts).sort((a,b)=>b[1].total-a[1].total);
    const rankHead=[['Pos','Estudiante','Total']];
    const rankBody=sorted.map(([sId,c],i)=>[i+1,c.name,c.total]);
    doc.autoTable({startY:y,head:rankHead,body:rankBody,theme:'grid',headStyles:{fillColor:[218,37,29],textColor:[255,255,255],fontStyle:'bold',fontSize:8},bodyStyles:{fontSize:8},margin:{left:14,right:14}});
    y=doc.lastAutoTable.finalY+10;

    /* Observaciones */
    const obsData=[];
    students.forEach(([sId,s])=>{
        const obs=getObservations(cId,sId);
        if(obs.length){obs.forEach(([,o])=>{obsData.push([s.name,o.text,formatDate(o.date)])})}
    });
    if(obsData.length){
        if(y>230){doc.addPage();y=15}
        doc.setFontSize(12);doc.setFont('helvetica','bold');doc.text('Observaciones',14,y);y+=5;
        doc.autoTable({startY:y,head:[['Estudiante','Observacion','Fecha']],body:obsData,theme:'grid',headStyles:{fillColor:[218,37,29],textColor:[255,255,255],fontStyle:'bold',fontSize:8},bodyStyles:{fontSize:8},columnStyles:{1:{cellWidth:80}},margin:{left:14,right:14}});
    }

    /* Footer */
    const pageCount=doc.internal.getNumberOfPages();
    for(let i=1;i<=pageCount;i++){doc.setPage(i);doc.setFontSize(7);doc.setTextColor(150);doc.text('Generado por CLLASKM – Administracion Docente',105,290,{align:'center'})}

    doc.save(`CLLASKM_${course.name}_${course.paralelo}.pdf`);
    showToast('PDF exportado exitosamente');
}

/* =========================================
   INICIALIZACIÓN
   ========================================= */
function initApp(){
    setupListeners();
    /* Ocultar pantalla de carga */
    setTimeout(()=>{const ls=document.getElementById('loading-screen');if(ls){ls.style.transition='opacity .5s';ls.style.opacity='0';setTimeout(()=>ls.remove(),500)}},1600);
    /* Navegación por clic en sidebar */
    document.querySelectorAll('#nav-links .nav-link').forEach(link=>{
        link.addEventListener('click',()=>{navigateTo(link.dataset.nav)});
    });
    /* Atajos de teclado */
    document.addEventListener('keydown',e=>{
        if(e.key==='Escape')closeModal();
    });
}

/* Si auth ya estaba listo */
if(authReady)initApp();

document.addEventListener('click',e=>{
    /* Nada extra por ahora, los onclick inline cubren las necesidades */
});
</script>
