<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#0a0a0a}::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:3px}
body{font-family:'Cinzel',serif;background:#080808;color:#ddd;overflow-x:hidden;min-height:100vh}

/* ===== SPLASH ===== */
#splash{position:fixed;inset:0;z-index:9999;background:#080808;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s ease,visibility 1s ease}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
.logo-main{font-family:'Cinzel Decorative',serif;font-size:clamp(2.8rem,12vw,7rem);color:#fff;position:relative;opacity:0;animation:logoIn 1.2s ease-out forwards;letter-spacing:4px}
.logo-main::before,.logo-main::after{content:attr(data-text);position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.logo-main::before{color:#dc2626;animation:g1 .12s infinite;clip-path:inset(0 0 68% 0)}
.logo-main::after{color:#440000;animation:g2 .18s infinite;clip-path:inset(68% 0 0 0)}
@keyframes logoIn{0%{opacity:0;transform:scale(.75);filter:blur(10px)}50%{opacity:.8;transform:scale(1.03);filter:blur(1px)}100%{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes g1{0%,100%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}}
@keyframes g2{0%,100%{transform:translate(1px,-1px)}50%{transform:translate(-1px,1px)}}
.logo-sub{font-family:'Cinzel Decorative',serif;font-size:clamp(1.6rem,6vw,3.5rem);color:#dc2626;letter-spacing:8px;opacity:0;animation:fadeUp .8s ease-out forwards}
.tagline{font-family:'Cinzel',serif;font-size:clamp(.6rem,1.6vw,.85rem);color:#555;letter-spacing:3px;text-transform:uppercase;margin-top:16px;opacity:0;animation:fadeUp .8s ease-out forwards}
@keyframes fadeUp{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
.smk{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(220,38,38,.06)0%,transparent 70%);filter:blur(50px);pointer-events:none;animation:drift 8s infinite ease-out}
@keyframes drift{0%{transform:translateY(50vh)scale(.4);opacity:0}30%{opacity:1}100%{transform:translateY(-20vh)scale(1.2);opacity:0}}

/* ===== LAYOUT ===== */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;background:#0b0b0b;border-right:1px solid #1a1a1a;z-index:5000;overflow-y:auto;transition:transform .3s ease}
.main-area{margin-left:250px;min-height:100vh;padding:0 20px 90px 20px}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);width:280px}
  .sidebar.open{transform:translateX(0)}
  .main-area{margin-left:0;padding:0 12px 90px 12px}
}
.sb-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:4999;display:none}
.sb-overlay.open{display:block}
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;border-top:1px solid #1a1a1a;z-index:4000;padding:4px 0 env(safe-area-inset-bottom);justify-content:space-around;align-items:center}
@media(max-width:768px){.bottom-nav{display:flex}}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 8px;color:#555;font-size:.52rem;cursor:pointer;transition:color .2s;font-family:'Cinzel',serif}

.hamburger{display:none;cursor:pointer;padding:8px;color:#888;font-size:1.15rem}
@media(max-width:768px){.hamburger{display:block}}

.cd{background:linear-gradient(145deg,#121212,#181818);border:1px solid #262626;border-radius:10px;transition:border-color .3s,box-shadow .3s}
.cd:hover{border-color:#dc262640;box-shadow:0 0 16px rgba(220,38,38,.06)}
.btn-p{background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;border:none;border-radius:7px;padding:9px 18px;font-family:'Cinzel',serif;font-weight:700;cursor:pointer;transition:all .25s;text-transform:uppercase;letter-spacing:.8px;font-size:.75rem}
.btn-p:hover{box-shadow:0 0 22px rgba(220,38,38,.3);transform:translateY(-1px)}
.btn-p:active{transform:scale(.96)}
.btn-s{background:transparent;color:#777;border:1px solid #2a2a2a;border-radius:7px;padding:7px 14px;font-family:'Cinzel',serif;font-weight:600;cursor:pointer;transition:all .25s;font-size:.7rem}
.btn-s:hover{border-color:#dc2626;color:#dc2626}
.inp{background:#0f0f0f;border:1px solid #262626;border-radius:7px;padding:9px 12px;color:#ddd;font-family:'Cinzel',serif;font-size:.8rem;width:100%;transition:border-color .3s}
.inp:focus{outline:none;border-color:#dc2626;box-shadow:0 0 0 2px rgba(220,38,38,.1)}
.inp::placeholder{color:#3a3a3a}
.rb{padding:5px 9px;border-radius:5px;font-size:.62rem;font-weight:700;cursor:pointer;transition:all .2s;border:1px solid #262626;background:#161616;color:#aaa;text-transform:uppercase;letter-spacing:.3px;font-family:'Cinzel',serif}
.rb:hover{border-color:#dc2626;color:#dc2626}
.rb:active{transform:scale(.94)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot-h{background:#22c55e;box-shadow:0 0 5px #22c55e80}
.dot-m{background:#eab308;box-shadow:0 0 5px #eab30880}
.dot-l{background:#ef4444;box-shadow:0 0 5px #ef444480}
.sync-d{width:8px;height:8px;border-radius:50%;display:inline-block}
.sync-on{background:#22c55e;box-shadow:0 0 6px rgba(34,197,94,.5);animation:pls 2s infinite}
.sync-sv{background:#eab308;box-shadow:0 0 6px rgba(234,179,8,.5);animation:pls 1s infinite}
.sync-er{background:#ef4444;box-shadow:0 0 6px rgba(239,68,68,.5)}
@keyframes pls{0%,100%{opacity:1}50%{opacity:.3}}
.bar-bg{height:5px;border-radius:3px;background:#1a1a1a;overflow:hidden;flex:1}
.bar-fill{height:100%;border-radius:3px;transition:width .5s}
.cal-d{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #1e1e1e;border-radius:5px;cursor:pointer;transition:all .2s;font-size:.75rem;position:relative;gap:1px}
.cal-d:hover{border-color:#dc262680}
.cal-d.tod{border-color:#dc2626;background:rgba(220,38,38,.07)}
.cal-d.act::after{content:'';position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:#dc2626}
.live-mode{position:fixed;inset:0;z-index:6000;background:#080808;overflow-y:auto}
.undo-btn{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);z-index:5500;background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;padding:10px 20px;border-radius:40px;font-size:.75rem;font-weight:700;cursor:pointer;box-shadow:0 4px 18px rgba(220,38,38,.3);animation:fadeUp .3s;font-family:'Cinzel',serif;border:none}

/* Modal */
.modal-bg{position:fixed;inset:0;z-index:7777;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:14px;animation:fadeIn .2s}
.modal-box{background:#111;border:1px solid #262626;border-radius:12px;padding:22px;max-width:460px;width:100%;max-height:85vh;overflow-y:auto;animation:mIn .25s}
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
@keyframes mIn{0%{opacity:0;transform:scale(.93)translateY(14px)}100%{opacity:1;transform:scale(1)translateY(0)}}

/* Toast */
.toast-wrap{position:fixed;bottom:20px;right:14px;z-index:8888;display:flex;flex-direction:column;gap:6px;max-width:320px}
.toast-item{padding:11px 14px;border-radius:8px;color:#fff;font-size:.74rem;font-weight:600;display:flex;align-items:center;gap:8px;animation:fadeIn .3s;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.toast-ok{background:linear-gradient(135deg,#166534,#14532d);border:1px solid #22c55e50}
.toast-err{background:linear-gradient(135deg,#991b1b,#7f1d1d);border:1px solid #ef444450}
.toast-warn{background:linear-gradient(135deg,#713f12,#612f0c);border:1px solid #f59e0b50}
.toast-info{background:linear-gradient(135deg,#1e3a5f,#172554);border:1px solid #3b82f650}

/* Responsive table/cards */
.tbl-wrap{overflow-x:auto}
@media(max-width:768px){.tbl-wrap{display:none!important}.mob-cards{display:flex!important}}
@media(min-width:769px){.mob-cards{display:none!important}}

@media print{.no-print{display:none!important}}
</style>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const {useState,useEffect,useRef,useMemo,createContext,useContext}=React;

// ===== UTILIDADES =====
const DEF_BTNS=['Participo','Expuso','Entrego Tarea','Respondio','Leyo','Investigo','Presento Trabajo'];
const SP='klis123_';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const getNow=()=>{const d=new Date();return{date:d.toISOString().split('T')[0],time:d.toTimeString().slice(0,8),timestamp:d.getTime()}};
const loadL=(k,f)=>{try{const v=localStorage.getItem(SP+k);return v?JSON.parse(v):f}catch(e){return f}};
const saveL=(k,v)=>{try{localStorage.setItem(SP+k,JSON.stringify(v))}catch(e){}};

// ===== CONTEXTOS =====
const AppCtx=createContext();
const useApp=()=>useContext(AppCtx);
const ToastCtx=createContext();
const useToast=()=>useContext(ToastCtx);

// ===== DATA PROVIDER =====
function DataProvider({children}){
  const[courses,setCourses]=useState(()=>loadL('courses',[]));
  const[students,setStudents]=useState(()=>loadL('students',[]));
  const[records,setRecords]=useState(()=>loadL('records',[]));
  const[obs,setObs]=useState(()=>loadL('obs',[]));
  const[cBtns,setCBtns]=useState(()=>loadL('cBtns',[]));
  const[settings,setSettings]=useState(()=>loadL('settings',{teacherName:''}));
  const[syncSt,setSyncSt]=useState('er');
  const[undoStack,setUndoStack]=useState([]);

  useEffect(()=>saveL('courses',courses),[courses]);
  useEffect(()=>saveL('students',students),[students]);
  useEffect(()=>saveL('records',records),[records]);
  useEffect(()=>saveL('obs',obs),[obs]);
  useEffect(()=>saveL('cBtns',cBtns),[cBtns]);
  useEffect(()=>saveL('settings',settings),[settings]);

  // Firebase sync
  useEffect(()=>{
    if(!dbRef||!fbUid)return;
    setSyncSt('sv');
    dbRef.child('data').set({courses,students,records,obs,cBtns,settings,updatedAt:Date.now()})
      .then(()=>setSyncSt('on')).catch(()=>setSyncSt('er'));
  },[courses,students,records,obs,cBtns,settings]);

  useEffect(()=>{
    if(!dbRef)return;
    dbRef.child('data').once('value').then(snap=>{
      const d=snap.val();if(!d)return;
      if(d.courses&&d.courses.length)setCourses(d.courses);
      if(d.students&&d.students.length)setStudents(d.students);
      if(d.records&&d.records.length)setRecords(d.records);
      if(d.obs&&d.obs.length)setObs(d.obs);
      if(d.cBtns&&d.cBtns.length)setCBtns(d.cBtns);
      if(d.settings)setSettings(p=>({...p,...d.settings}));
      setSyncSt('on');
    }).catch(()=>setSyncSt('er'));
  },[]);

  const addCourse=c=>setCourses(p=>[...p,{...c,id:uid(),createdAt:Date.now()}]);
  const updCourse=(id,d)=>setCourses(p=>p.map(x=>x.id===id?{...x,...d}:x));
  const delCourse=id=>{setCourses(p=>p.filter(x=>x.id!==id));setStudents(p=>p.filter(x=>x.courseId!==id));setRecords(p=>p.filter(x=>x.courseId!==id));setObs(p=>p.filter(x=>x.courseId!==id))};
  const dupCourse=id=>{const c=courses.find(x=>x.id===id);if(!c)return;const nc={...c,id:uid(),name:c.name+' (copia)',createdAt:Date.now()};setCourses(p=>[...p,nc]);const dup=students.filter(s=>s.courseId===id).map(s=>({...s,id:uid(),courseId:nc.id}));if(dup.length)setStudents(p=>[...p,...dup])};

  const addStudent=s=>{const id=uid();setStudents(p=>[...p,{...s,id,createdAt:Date.now()}]);return id};
  const updStudent=(id,d)=>setStudents(p=>p.map(x=>x.id===id?{...x,...d}:x));
  const delStudent=id=>{setStudents(p=>p.filter(x=>x.id!==id));setRecords(p=>p.filter(x=>x.studentId!==id));setObs(p=>p.filter(x=>x.studentId!==id))};

  const addRecord=r=>{
    const t=Date.now();
    if(records.some(x=>x.studentId===r.studentId&&x.courseId===r.courseId&&x.type===r.type&&Math.abs(x.timestamp-t)<5000))return'dup';
    const rec={...r,id:uid(),...getNow()};
    setRecords(p=>[...p,rec]);
    setUndoStack(p=>[...p,{type:'add',id:rec.id}]);
    return rec.id;
  };
  const delRecord=id=>{const rec=records.find(x=>x.id===id);if(rec)setUndoStack(p=>[...p,{type:'del',data:rec}]);setRecords(p=>p.filter(x=>x.id!==id))};
  const undoLast=()=>{if(!undoStack.length)return false;const last=undoStack[undoStack.length-1];setUndoStack(p=>p.slice(0,-1));if(last.type==='add')setRecords(p=>p.filter(x=>x.id!==last.id));else if(last.type==='del')setRecords(p=>[...p,last.data]);return true};

  const addObs=o=>setObs(p=>[...p,{...o,id:uid(),...getNow()}]);
  const delObs=id=>setObs(p=>p.filter(x=>x.id!==id));
  const addCBtn=n=>setCBtns(p=>[...p,{id:uid(),name:n}]);
  const rmCBtn=id=>setCBtns(p=>p.filter(x=>x.id!==id));
  const updSettings=d=>setSettings(p=>({...p,...d}));

  const courseStudents=cid=>students.filter(s=>s.courseId===cid).sort((a,b)=>(a.listNumber||0)-(b.listNumber||0));
  const partCount=(sid,cid)=>records.filter(r=>r.studentId===sid&&r.courseId===cid).length;
  const partLevel=(sid,cid)=>{const c=partCount(sid,cid);return c>=8?'h':c>=3?'m':'l'};

  return <AppCtx.Provider value={{courses,students,records,obs,cBtns,settings,syncSt,undoStack,
    addCourse,updCourse,delCourse,dupCourse,addStudent,updStudent,delStudent,
    addRecord,delRecord,undoLast,addObs,delObs,addCBtn,rmCBtn,updSettings,
    courseStudents,partCount,partLevel}}>
    {children}
  </AppCtx.Provider>
}

// ===== TOAST PROVIDER =====
function ToastProvider({children}){
  const[toasts,setToasts]=useState([]);
  const addToast=useCallback((msg,type='ok',action=null,dur=4000)=>{
    const id=uid();setToasts(p=>[...p,{id,msg,type,action}]);
    if(dur>0)setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),dur);
  },[]);
  const removeToast=useCallback(id=>setToasts(p=>p.filter(t=>t.id!==id)),[]);
  return <ToastCtx.Provider value={{addToast,removeToast}}>
    {children}
    <div className="toast-wrap">
      {toasts.map(t=>{
        const ic=t.type==='ok'?'fa-check-circle':t.type==='err'?'fa-circle-exclamation':t.type==='warn'?'fa-triangle-exclamation':'fa-circle-info';
        return <div key={t.id} className={`toast-item toast-${t.type}`}>
          <i className={`fa-solid ${ic}`} style={{flexShrink:0}}/>
          <span style={{flex:1}}>{t.msg}</span>
          {t.action&&<button onClick={t.action.fn} style={{background:'rgba(255,255,255,.1)',border:'none',color:'#fff',padding:'3px 10px',borderRadius:4,cursor:'pointer',fontFamily:'Cinzel',fontWeight:700,fontSize:'.65rem'}}>{t.action.label}</button>}
          <button onClick={()=>removeToast(t.id)} style={{background:'none',border:'none',color:'#666',cursor:'pointer',fontSize:'1rem'}}>&times;</button>
        </div>
      })}
    </div>
  </ToastCtx.Provider>
}

// ===== MODAL COMPONENTS =====
function Modal({open,title,onClose,children}){
  if(!open)return null;
  return <div className="modal-bg" onClick={onClose}>
    <div className="modal-box" onClick={e=>e.stopPropagation()}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
        <h3 style={{fontFamily:'Cinzel',serif,fontSize:'.95rem',fontWeight:700,color:'#dc2626'}}>{title}</h3>
        <button onClick={onClose} style={{background:'none',border:'none',color:'#555',cursor:'pointer',fontSize:'1.1rem'}}><i className="fa-solid fa-xmark"/></button>
      </div>
      {children}
    </div>
  </div>
}

function Confirm({open,title,msg,onOk,onNo}){
  if(!open)return null;
  return <div className="modal-bg" onClick={onNo}>
    <div className="modal-box" onClick={e=>e.stopPropagation()}>
      <h3 style={{fontFamily:'Cinzel',fontSize:'.9rem',fontWeight:700,color:'#dc2626',marginBottom:8}}>{title||'Confirmar'}</h3>
      <p style={{fontSize:'.78rem',color:'#888',marginBottom:18}}>{msg||'Deseas continuar?'}</p>
      <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
        <button className="btn-s" onClick={onNo}>Cancelar</button>
        <button className="btn-p" onClick={onOk}>Confirmar</button>
      </div>
    </div>
  </div>
}

function SyncInd(){
  const{syncSt}=useApp();
  const cls=syncSt==='on'?'sync-on':syncSt==='sv'?'sync-sv':'sync-er';
  const lbl=syncSt==='on'?'Sincronizado':syncSt==='sv'?'Guardando':'Sin conexion';
  return <div style={{display:'flex',alignItems:'center',gap:5,fontSize:'.62rem',color:'#444'}}><span className={`sync-d ${cls}`}/>{lbl}</div>
}

// ===== SIDEBAR =====
function Sidebar({page,setPage,open,setOpen}){
  const{settings}=useApp();
  const items=[
    {id:'dashboard',ic:'fa-gauge-high',lb:'Dashboard'},
    {id:'courses',ic:'fa-book-open',lb:'Cursos'},
    {id:'calendar',ic:'fa-calendar-days',lb:'Calendario'},
    {id:'stats',ic:'fa-chart-bar',lb:'Estadisticas'},
    {id:'reports',ic:'fa-file-export',lb:'Reportes'},
    {id:'history',ic:'fa-clock-rotate-left',lb:'Historial'},
    {id:'settings',ic:'fa-gear',lb:'Configuracion'},
  ];
  return <>
    <div className={`sb-overlay ${open?'open':''}`} onClick={()=>setOpen(false)}/>
    <aside className={`sidebar ${open?'open':''}`}>
      <div style={{padding:'16px 14px',borderBottom:'1px solid #1a1a1a'}}>

// ===== CURSOS =====
function Courses({setPage,setCid}){
  const{courses,addCourse,updCourse,delCourse,dupCourse}=useApp();
  const{addToast}=useToast();
  const[mOpen,setMOpen]=useState(false);
  const[edit,setEdit]=useState(null);
  const[fm,setFm]=useState({name:'',parallel:'',level:'',subject:''});
  const[cfm,setCfm]=useState({open:false,id:null});

  const openNew=()=>{setFm({name:'',parallel:'',level:'',subject:''});setEdit(null);setMOpen(true)};
  const openEd=c=>{setFm({name:c.name,parallel:c.parallel||'',level:c.level||'',subject:c.subject||''});setEdit(c);setMOpen(true)};
  const save=()=>{
    if(!fm.name.trim()){addToast('Nombre obligatorio','err');return}
    if(edit){updCourse(edit.id,fm);addToast('Curso actualizado')}else{addCourse(fm);addToast('Curso creado')}
    setMOpen(false);
  };

  return <div>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:8}}>
      <h2 style={{fontFamily:'Cinzel',fontSize:'1.1rem',fontWeight:700}}>Cursos</h2>
      <button id="btn-new-course" className="btn-p" onClick={openNew}><i className="fa-solid fa-plus" style={{marginRight:4}}/>Nuevo Curso</button>
    </div>
    {courses.length===0?<div className="cd" style={{padding:32,textAlign:'center'}}>
      <i className="fa-solid fa-book-open" style={{fontSize:'2rem',color:'#1a1a1a',marginBottom:8}}/>
      <p style={{color:'#3a3a3a',fontSize:'.78rem'}}>Sin cursos creados</p>
    </div>:<div style={{display:'grid',gap:10,gridTemplateColumns:'repeat(auto-fill,minmax(250px,1fr))'}}>
      {courses.map(c=>(<div key={c.id} className="cd" style={{padding:14}}>
        <div style={{cursor:'pointer',marginBottom:8}} onClick={()=>{setCid(c.id);setPage('courseDetail')}}>
          <div style={{fontFamily:'Cinzel',fontWeight:700,color:'#ddd',fontSize:'.88rem'}}>{c.name}</div>
          <div style={{fontSize:'.6rem',color:'#444',marginTop:2}}>{[c.parallel,c.level,c.subject].filter(Boolean).join(' · ')}</div>
        </div>
        <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
          <button className="btn-s" style={{fontSize:'.58rem',padding:'4px 8px'}} onClick={()=>openEd(c)}><i className="fa-solid fa-pen" style={{marginRight:2}}/>Editar</button>
          <button className="btn-s" style={{fontSize:'.58rem',padding:'4px 8px'}} onClick={()=>{dupCourse(c.id);addToast('Curso duplicado')}}><i className="fa-solid fa-copy" style={{marginRight:2}}/>Duplicar</button>
          <button className="btn-s" style={{fontSize:'.58rem',padding:'4px 8px',borderColor:'#991b1b',color:'#ef4444'}} onClick={()=>setCfm({open:true,id:c.id})}><i className="fa-solid fa-trash" style={{marginRight:2}}/>Eliminar</button>
        </div>
      </div>))}
    </div>}
    <Modal open={mOpen} title={edit?'Editar Curso':'Nuevo Curso'} onClose={()=>setMOpen(false)}>
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        <div><label style={{fontSize:'.62rem',color:'#666',display:'block',marginBottom:2}}>Nombre</label><input className="inp" value={fm.name} onChange={e=>setFm(p=>({...p,name:e.target.value}))} placeholder="Ej: Historia"/></div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
          <div><label style={{fontSize:'.62rem',color:'#666',display:'block',marginBottom:2}}>Paralelo</label><input className="inp" value={fm.parallel} onChange={e=>setFm(p=>({...p,parallel:e.target.value}))} placeholder="Ej: B"/></div>
          <div><label style={{fontSize:'.62rem',color:'#666',display:'block',marginBottom:2}}>Nivel</label><input className="inp" value={fm.level} onChange={e=>setFm(p=>({...p,level:e.target.value}))} placeholder="Ej: 4to Secundaria"/></div>
        </div>
        <div><label style={{fontSize:'.62rem',color:'#666',display:'block',marginBottom:2}}>Materia</label><input className="inp" value={fm.subject} onChange={e=>setFm(p=>({...p,subject:e.target.value}))} placeholder="Ej: Ciencias Sociales"/></div>
        <button className="btn-p" style={{width:'100%',marginTop:4}} onClick={save}>{edit?'Guardar':'Crear Curso'}</button>
      </div>
    </Modal>
    <Confirm open={cfm.open} title="Eliminar Curso" msg="Se eliminaran estudiantes, registros y observaciones." onOk={()=>{delCourse(cfm.id);setCfm({open:false,id:null});addToast('Curso eliminado')}} onNo={()=>setCfm({open:false,id:null})}/>
  </div>
}

// ===== DETALLE DE CURSO =====
function CourseDetail({courseId,setPage}){
  const{courses,students,records,obs,cBtns,addStudent,updStudent,delStudent,addRecord,delRecord,addObs,delObs,addCBtn,rmCBtn,partCount,partLevel,courseStudents}=useApp();
  const{addToast}=useToast();
  const course=courses.find(c=>c.id===courseId);
  const cSt=courseStudents(courseId);
  const[stMo,setStMo]=useState(false);
  const[editSt,setEditSt]=useState(null);
  const[fm,setFm]=useState({listNumber:'',fullName:'',obstxt:''});
  const[obsMo,setObsMo]=useState(null);
  const[obsTxt,setObsTxt]=useState('');
  const[histMo,setHistMo]=useState(null);
  const[cfmDel,setCfmDel]=useState({open:false,id:null});
  const[search,setSearch]=useState('');
  const[filter,setFilter]=useState('all');
  const[live,setLive]=useState(false);
  const[cbMo,setCbMo]=useState(false);
  const[newBn,setNewBn]=useState('');
  const[undoId,setUndoId]=useState(null);
  const utRef=useRef(null);

  const allB=[...DEF_BTNS,...cBtns.map(b=>b.name)];
  const filtered=cSt.filter(s=>{
    if(search&&!s.fullName.toLowerCase().includes(search.toLowerCase()))return false;
    if(filter==='today'){const t=new Date().toISOString().split('T')[0];return records.some(r=>r.studentId===s.id&&r.date===t)}
    if(filter==='week'){const n=Date.now();return records.some(r=>r.studentId===s.id&&n-r.timestamp<604800000)}
    if(filter==='month'){const n=Date.now();return records.some(r=>r.studentId===s.id&&n-r.timestamp<2592000000)}
    if(filter==='nopart')return partCount(s.id,courseId)===0;
    if(filter==='obs')return obs.some(o=>o.studentId===s.id);
    if(filter==='low')return partLevel(s.id,courseId)==='l';
    return true;
  });

  const saveSt=()=>{
    if(!fm.fullName.trim()){addToast('Nombre obligatorio','err');return}
    if(editSt){updStudent(editSt.id,{listNumber:parseInt(fm.listNumber)||0,fullName:fm.fullName});if(fm.obstxt?.trim())addObs({studentId:editSt.id,courseId,obsType:'initial',text:fm.obstxt});addToast('Estudiante actualizado')}
    else{const sid=addStudent({listNumber:parseInt(fm.listNumber)||0,fullName:fm.fullName,courseId});if(fm.obstxt?.trim())addObs({studentId:sid,courseId,obsType:'initial',text:fm.obstxt});addToast('Estudiante agregado')}
    setStMo(false);
  };

  const doRec=(sid,type)=>{
    const r=addRecord({studentId:sid,courseId,type});
    if(r==='dup'){addToast('Registro duplicado detectado','warn');return}
    addToast('Registro: '+type,'ok',{label:'DESHACER',fn:()=>{delRecord(r);addToast('Deshecho','info')}},8000);
    setUndoId(r);clearTimeout(utRef.current);utRef.current=setTimeout(()=>setUndoId(null),8000);
  };

  const doUndo=()=>{if(undoId){delRecord(undoId);setUndoId(null);addToast('Registro deshecho','info')}};
  const doAddObs=()=>{if(!obsTxt.trim())return;addObs({studentId:obsMo,courseId,text:obsTxt});setObsTxt('');setObsMo(null);addToast('Observacion guardada')};
  const doAddCb=()=>{if(!newBn.trim())return;addCBtn(newBn.trim());setNewBn('');setCbMo(false);addToast('Boton agregado')};

  const expCSV=()=>{
    const hdr='Nro,Nombre,'+allB.join(',')+',Total\n';
    const rows=cSt.map(s=>{const c=allB.map(b=>records.filter(r=>r.studentId===s.id&&r.courseId===courseId&&r.type===b).length);return(s.listNumber||'')+',"'+s.fullName+'",'+c.join(',')+','+partCount(s.id,courseId)}).join('\n');
    const b=new Blob(['\ufeff'+hdr+rows],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(course?.name||'curso')+'.csv';a.click();addToast('CSV exportado');
  };

  const expPDF=()=>{
    const{jsPDF}=window.jspdf;const doc=new jsPDF();
    doc.setFillColor(10,10,10);doc.rect(0,0,220,300,'F');
    doc.setFont('helvetica','bold');doc.setTextColor(220,38,38);doc.setFontSize(24);doc.text('KLIS123',105,20,{align:'center'});
    doc.setFontSize(12);doc.text('CLLASKM',105,30,{align:'center'});
    doc.setFontSize(7);doc.setTextColor(130);doc.text('Control Docente Inteligente',105,37,{align:'center'});
    doc.setDrawColor(220,38,38);doc.line(20,41,190,41);
    doc.setTextColor(200);doc.setFontSize(11);doc.text(course?.name||'',105,50,{align:'center'});
    doc.setFontSize(7);doc.setTextColor(110);doc.text([course?.parallel,course?.level,course?.subject].filter(Boolean).join(' · '),105,56,{align:'center'});
    doc.text('Fecha: '+new Date().toLocaleDateString(),105,61,{align:'center'});
    const td=cSt.map(s=>{const c=allB.map(b=>records.filter(r=>r.studentId===s.id&&r.courseId===courseId&&r.type===b).length);return[s.listNumber||'',s.fullName,...c,partCount(s.id,courseId)]});
    doc.autoTable({startY:67,head:[['Nro','Nombre',...allB,'Total']],body:td,theme:'grid',styles:{fillColor:[14,14,14],textColor:[190,190,190],fontSize:5.5,font:'helvetica',cellPadding:1.5},headStyles:{fillColor:[40,10,10],textColor:[220,38,38],fontStyle:'bold',fontSize:5},alternateRowStyles:{fillColor:[18,18,18]}});
    doc.save('KLIS123_'+(course?.name||'curso')+'.pdf');addToast('PDF exportado');
  };

  if(!course)return <div className="cd" style={{padding:24,textAlign:'center'}}><p style={{color:'#444'}}>Curso no encontrado</p><button className="btn-p" style={{marginTop:10}} onClick={()=>setPage('courses')}>Volver</button></div>;

  if(live)return <div className="live-mode">
    <div style={{padding:'10px 14px',background:'#0a0a0a',borderBottom:'1px solid #1a1a1a',display:'flex',justifyContent:'space-between',alignItems:'center',position:'sticky',top:0,zIndex:10}}>
      <div><span style={{fontFamily:'Cinzel',fontWeight:700,color:'#ddd',fontSize:'.82rem'}}>{course.name}</span><span style={{color:'#dc2626',marginLeft:6,fontSize:'.65rem',fontWeight:700'}}>EN VIVO</span></div>
      <button className="btn-s" style={{fontSize:'.62rem',padding:'4px 10px'}} onClick={()=>setLive(false)}><i className="fa-solid fa-xmark" style={{marginRight:3}}/>Salir</button>
    </div>
    <div style={{padding:8}}>
      {cSt.map(s=>{const lv=partLevel(s.id,courseId);return(<div key={s.id} className="cd" style={{padding:10,marginBottom:6}}>
        <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:6}}>
          <span className={`dot dot-${lv}`}/><span style={{fontSize:'.8rem',color:'#ddd',fontWeight:600}}>{s.fullName}</span>
          <span style={{fontFamily:'Cinzel',color:'#dc2626',fontSize:'.72rem',fontWeight:700,marginLeft:'auto'}}>{partCount(s.id,courseId)}</span>
        </div>
        <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>{allB.map(b=><button key={b} className="rb" onClick={()=>doRec(s.id,b)}>{b}</button>)}</div>
      </div>)})}
    </div>
  </div>;

  const maxCnt=Math.max(1,...cSt.map(s=>partCount(s.id,courseId)));

  return <div>
    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14,flexWrap:'wrap'}}>
      <button className="btn-s" onClick={()=>setPage('courses')}><i className="fa-solid fa-arrow-left" style={{marginRight:3}}/>Cursos</button>
      <div style={{flex:1}}>
        <h2 style={{fontFamily:'Cinzel',fontSize:'1rem',fontWeight:700,color:'#ddd'}}>{course.name}</h2>
        <div style={{fontSize:'.6rem',color:'#444'}}>{[course.parallel,course.level,course.subject].filter(Boolean).join(' · ')}</div>
      </div>
      <button className="btn-p" style={{fontSize:'.68rem'}} onClick={()=>setLive(true)}><i className="fa-solid fa-bolt" style={{marginRight:3}}/>En Vivo</button>
    </div>

    <div style={{display:'flex',gap:6,marginBottom:10,flexWrap:'wrap'}}>
      <button className="btn-p" style={{fontSize:'.65rem'}} onClick={()=>{setFm({listNumber:'',fullName:'',obstxt:''});setEditSt(null);setStMo(true)}}><i className="fa-solid fa-user-plus" style={{marginRight:3}}/>Agregar Estudiante</button>
      <button className="btn-s" style={{fontSize:'.6rem'}} onClick={expPDF}><i className="fa-solid fa-file-pdf" style={{marginRight:3}}/>PDF</button>
      <button className="btn-s" style={{fontSize:'.6rem'}} onClick={expCSV}><i className="fa-solid fa-file-csv" style={{marginRight:3}}/>CSV</button>
      <button className="btn-s" style={{fontSize:'.6rem'}} onClick={()=>setCbMo(true)}><i className="fa-solid fa-plus" style={{marginRight:3}}/>Boton</button>
    </div>

    <div style={{display:'flex',gap:6,marginBottom:10,flexWrap:'wrap'}}>
      <div style={{flex:1,minWidth:160,position:'relative'}}>
        <i className="fa-solid fa-search" style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'#333',fontSize:'.72rem'}}/>
        <input className="inp" style={{paddingLeft:30}} placeholder="Buscar estudiante..." value={search} onChange={e=>setSearch(e.target.value)}/>
      </div>
      <select className="inp" style={{width:'auto',minWidth:120}} value={filter} onChange={e=>setFilter(e.target.value)}>

// ===== CALENDARIO =====
function Calendar(){
  const{records,students}=useApp();
  const[yr,setYr]=useState(new Date().getFullYear());
  const[mo,setMo]=useState(new Date().getMonth());
  const[sel,setSel]=useState(null);
  const dim=new Date(yr,mo+1,0).getDate();
  const fd=new Date(yr,mo,1).getDay();
  const mns=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const dns=['Do','Lu','Ma','Mi','Ju','Vi','Sa'];
  const today=new Date().toISOString().split('T')[0];
  const recs4=d=>{const ds=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');return records.filter(r=>r.date===ds)};
  const days=[];for(let i=0;i<fd;i++)days.push(null);for(let d=1;d<=dim;d++)days.push(d);
  const selR=sel?recs4(sel):[];

  return <div>
    <h2 style={{fontFamily:'Cinzel',fontSize:'1.1rem',fontWeight:700,marginBottom:14}}>Calendario</h2>
    <div className="cd" style={{padding:12}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
        <button className="btn-s" onClick={()=>{if(mo===0){setMo(11);setYr(y=>y-1)}else setMo(m=>m-1)}}><i className="fa-solid fa-chevron-left"/></button>
        <h3 style={{fontFamily:'Cinzel',fontWeight:700,color:'#ddd',fontSize:'.88rem'}}>{mns[mo]} {yr}</h3>
        <button className="btn-s" onClick={()=>{if(mo===11){setMo(0);setYr(y=>y+1)}else setMo(m=>m+1)}}><i className="fa-solid fa-chevron-right"/></button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginBottom:3}}>
        {dns.map(d=><div key={d} style={{textAlign:'center',fontSize:'.55rem',color:'#333',padding:2}}>{d}</div>)}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2}}>
        {days.map((d,i)=>{if(!d)return <div key={'e'+i}/>;
          const ds=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
          const rc=recs4(d);const isTd=ds===today;
          return <div key={d} className={`cal-d ${isTd?'tod':''} ${rc.length?'act':''}`} onClick={()=>setSel(d)}>
            <span style={{color:isTd?'#dc2626':'#999',fontWeight:isTd?700:400}}>{d}</span>
            {rc.length>0&&<span style={{fontSize:'.45rem',color:'#dc2626'}}>{rc.length}</span>}
          </div>
        })}
      </div>
    </div>
    {sel&&<div className="cd" style={{padding:12,marginTop:8}}>
      <h3 style={{fontFamily:'Cinzel',fontWeight:700,color:'#ddd',fontSize:'.8rem',marginBottom:6}}>Registros del {sel} de {mns[mo]}</h3>
      {selR.length?selR.map(r=>{const s=students.find(x=>x.id===r.studentId);return(<div key={r.id} style={{display:'flex',alignItems:'center',gap:6,padding:'4px 0',borderBottom:'1px solid #1a1a1a'}}>
        <span style={{fontSize:'.7rem',color:'#bbb',flex:1}}>{s?.fullName||'?'}</span>
        <span style={{fontSize:'.6rem',color:'#dc2626',fontWeight:700}}>{r.type}</span>
        <span style={{fontSize:'.52rem',color:'#333'}}>{r.time}</span>
      </div>)):<p style={{color:'#333',fontSize:'.7rem',textAlign:'center',padding:8}}>Sin registros</p>}
    </div>}
  </div>
}

// ===== ESTADISTICAS =====
function Stats(){
  const{courses,students,records}=useApp();
  const[selC,setSelC]=useState('all');
  const r1=useRef(null),r2=useRef(null),r3=useRef(null);
  const c1=useRef(null),c2=useRef(null),c3=useRef(null);
  const fR=selC==='all'?records:records.filter(r=>r.courseId===selC);

  const rank=useMemo(()=>{const c={};fR.forEach(r=>{c[r.studentId]=(c[r.studentId]||0)+1});return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([sid,cnt])=>{const s=students.find(x=>x.id===sid);return{name:s?.fullName||'?',cnt}})},[fR,students]);
  const types=useMemo(()=>{const c={};fR.forEach(r=>{c[r.type]=(c[r.type]||0)+1});return Object.entries(c).map(([type,cnt])=>({type,cnt}))},[fR]);
  const weekly=useMemo(()=>{const n=Date.now();const w=[];for(let i=6;i>=0;i--){const s=n-(i+1)*604800000,e=n-i*604800000;const cnt=fR.filter(r=>r.timestamp>=s&&r.timestamp<e).length;const d=new Date(s);w.push({lb:d.getDate()+'/'+(d.getMonth()+1),cnt})}return w},[fR]);

  useEffect(()=>{
    if(c1.current)c1.current.destroy();if(c2.current)c2.current.destroy();if(c3.current)c3.current.destroy();
    const x1=r1.current?.getContext('2d'),x2=r2.current?.getContext('2d'),x3=r3.current?.getContext('2d');
    if(x1)c1.current=new Chart(x1,{type:'bar',data:{labels:rank.map(d=>d.name.slice(0,12)),datasets:[{data:rank.map(d=>d.cnt),backgroundColor:'rgba(220,38,38,.6)',borderColor:'#dc2626',borderWidth:1,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{grid:{color:'#1a1a1a'},ticks:{color:'#444',font:{size:8}}},y:{grid:{display:false},ticks:{color:'#777',font:{size:8,family:'Cinzel'}}}}}});
    if(x2)c2.current=new Chart(x2,{type:'doughnut',data:{labels:types.map(d=>d.type),datasets:[{data:types.map(d=>d.cnt),backgroundColor:['#dc2626','#ef4444','#f87171','#991b1b','#7f1d1d','#b91c1c','#fca5a5','#fecaca'],borderColor:'#111',borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#666',font:{size:8,family:'Cinzel'},padding:6}}}}});
    if(x3)c3.current=new Chart(x3,{type:'line',data:{labels:weekly.map(d=>d.lb),datasets:[{data:weekly.map(d=>d.cnt),borderColor:'#dc2626',backgroundColor:'rgba(220,38,38,.06)',fill:true,tension:.4,pointBackgroundColor:'#dc2626',pointRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'#1a1a1a'},ticks:{color:'#444',font:{size:8}}},y:{grid:{color:'#1a1a1a'},ticks:{color:'#444',font:{size:8}},beginAtZero:true}}}});
    return()=>{c1.current?.destroy();c2.current?.destroy();c3.current?.destroy()};
  },[rank,types,weekly]);

  return <div>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14,flexWrap:'wrap',gap:6}}>
      <h2 style={{fontFamily:'Cinzel',fontSize:'1.1rem',fontWeight:700}}>Estadisticas</h2>
      <select className="inp" style={{width:'auto'}} value={selC} onChange={e=>setSelC(e.target.value)}>
        <option value="all">Todos los cursos</option>
        {courses.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
      </select>
    </div>
    {fR.length===0?<div className="cd" style={{padding:32,textAlign:'center'}}><i className="fa-solid fa-chart-bar" style={{fontSize:'2rem',color:'#1a1a1a',marginBottom:8}}/><p style={{color:'#333'}}>Sin datos suficientes</p></div>
    :<div style={{display:'flex',flexDirection:'column',gap:14}}>
      <div className="cd" style={{padding:12}}>
        <h3 style={{fontFamily:'Cinzel',fontSize:'.68rem',fontWeight:700,color:'#555',letterSpacing:1,marginBottom:8}}>Ranking</h3>
        <div style={{height:Math.max(160,rank.length*28)}}><canvas ref={r1}/></div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(240px,1fr))',gap:14}}>
        <div className="cd" style={{padding:12}}>
          <h3 style={{fontFamily:'Cinzel',fontSize:'.68rem',fontWeight:700,color:'#555',letterSpacing:1,marginBottom:8}}>Tipos de Registro</h3>
          <div style={{height:200}}><canvas ref={r2}/></div>
        </div>
        <div className="cd" style={{padding:12}}>
          <h3 style={{fontFamily:'Cinzel',fontSize:'.68rem',fontWeight:700,color:'#555',letterSpacing:1,marginBottom:8}}>Evolucion Semanal</h3>
          <div style={{height:200}}><canvas ref={r3}/></div>
        </div>
      </div>
    </div>}
  </div>
}

// ===== REPORTES =====
function Reports(){
  const{courses,students,records,obs}=useApp();
  const{addToast}=useToast();
  const[selC,setSelC]=useState('');

  const expPDF=()=>{
    const c=courses.find(x=>x.id===selC);if(!c){addToast('Selecciona un curso','err');return}
    const cs=students.filter(s=>s.courseId===c.id).sort((a,b)=>(a.listNumber||0)-(b.listNumber||0));
    const cr=records.filter(r=>r.courseId===c.id);
    const{jsPDF}=window.jspdf;const doc=new jsPDF();
    doc.setFillColor(10,10,10);doc.rect(0,0,220,300,'F');
    doc.setFont('helvetica','bold');doc.setTextColor(220,38,38);doc.setFontSize(24);doc.text('KLIS123',105,20,{align:'center'});
    doc.setFontSize(12);doc.text('CLLASKM',105,30,{align:'center'});
    doc.setFontSize(7);doc.setTextColor(120);doc.text('Control Docente Inteligente',105,37,{align:'center'});
    doc.setDrawColor(220,38,38);doc.line(20,41,190,41);
    doc.setTextColor(200);doc.setFontSize(11);doc.text(c.name,105,50,{align:'center'});
    doc.setFontSize(7);doc.setTextColor(100);
    doc.text([c.parallel,c.level,c.subject].filter(Boolean).join(' · '),105,56,{align:'center'});
    doc.text('Generado: '+new Date().toLocaleString(),105,61,{align:'center'});
    const td=cs.map(s=>{const c2=DEF_BTNS.map(b=>cr.filter(r=>r.studentId===s.id&&r.type===b).length);const t=c2.reduce((a,b)=>a+b,0);const o=obs.filter(x=>x.studentId===s.id).map(x=>x.text).join('; ');return[s.listNumber||'',s.fullName,...c2,t,o]});
    doc.autoTable({startY:67,head:[['Nro','Nombre',...DEF_BTNS,'Total','Obs']],body:td,theme:'grid',styles:{fillColor:[14,14,14],textColor:[190,190,190],fontSize:5,font:'helvetica',cellPadding:1.5},headStyles:{fillColor:[40,10,10],textColor:[220,38,38],fontStyle:'bold',fontSize:4.5},alternateRowStyles:{fillColor:[18,18,18]}});
    doc.save('KLIS123_'+c.name+'.pdf');addToast('PDF exportado');
  };

  const expCSV=()=>{
    const c=courses.find(x=>x.id===selC);if(!c){addToast('Selecciona un curso','err');return}
    const cs=students.filter(s=>s.courseId===c.id).sort((a,b)=>(a.listNumber||0)-(b.listNumber||0));
    const cr=records.filter(r=>r.courseId===c.id);
    const hdr='Nro,Nombre,'+DEF_BTNS.join(',')+',Total,Observaciones\n';
    const rows=cs.map(s=>{const c2=DEF_BTNS.map(b=>cr.filter(r=>r.studentId===s.id&&r.type===b).length);const t=c2.reduce((a,b)=>a+b,0);const o=obs.filter(x=>x.studentId===s.id).map(x=>'"'+x.text+'"').join('; ');return(s.listNumber||'')+',"'+s.fullName+'",'+c2.join(',')+','+t+',"'+o+'"'}).join('\n');
    const b=new Blob(['\ufeff'+hdr+rows],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=c.name+'_reporte.csv';a.click();addToast('CSV exportado');
  };

  return <div>
    <h2 style={{fontFamily:'Cinzel',fontSize:'1.1rem',fontWeight:700,marginBottom:14}}>Reportes</h2>
    <div className="cd" style={{padding:16}}>
      <div style={{marginBottom:10}}>
        <label style={{fontSize:'.6rem',color:'#555',display:'block',marginBottom:2}}>Seleccionar Curso</label>
        <select className="inp" value={selC} onChange={e=>setSelC(e.target.value)}>
          <option value="">-- Seleccionar --</option>
          {courses.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
      </div>
      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
        <button className="btn-p" onClick={expPDF}><i className="fa-solid fa-file-pdf" style={{marginRight:4}}/>Exportar PDF</button>
        <button className="btn-s" onClick={expCSV}><i className="fa-solid fa-file-csv" style={{marginRight:4}}/>Exportar CSV</button>
      </div>
      {selC&&(()=>{const c=courses.find(x=>x.id===selC);const cs=students.filter(s=>s.courseId===selC);const cr=records.filter(r=>r.courseId===selC);return(
        <div style={{marginTop:12,borderTop:'1px solid #1a1a1a',paddingTop:10}}>
          <div style={{display:'grid',gap:8,gridTemplateColumns:'repeat(auto-fit,minmax(90px,1fr))'}}>
            <div style={{textAlign:'center'}}><div style={{fontSize:'.52rem',color:'#444',textTransform:'uppercase'}}>Estudiantes</div><div style={{fontFamily:'Cinzel',color:'#dc2626',fontSize:'1.3rem',fontWeight:900}}>{cs.length}</div></div>
            <div style={{textAlign:'center'}}><div style={{fontSize:'.52rem',color:'#444',textTransform:'uppercase'}}>Registros</div><div style={{fontFamily:'Cinzel',color:'#22c55e',fontSize:'1.3rem',fontWeight:900}}>{cr.length}</div></div>
            <div style={{textAlign:'center'}}><div style={{fontSize:'.52rem',color:'#444',textTransform:'uppercase'}}>Promedio</div><div style={{fontFamily:'Cinzel',color:'#3b82f6',fontSize:'1.3rem',fontWeight:900}}>{cs.length?(cr.length/cs.length).toFixed(1):'0'}</div></div>
          </div>
        </div>
      )})()}
    </div>
  </div>
}

// ===== HISTORIAL =====
function History(){
  const{records,students,courses}=useApp();
  const[fC,setFC]=useState('all');const[fT,setFT]=useState('all');const[search,setSearch]=useState('');
  const filtered=records.filter(r=>{
    if(fC!=='all'&&r.courseId!==fC)return false;
    if(fT!=='all'&&r.type!==fT)return false;
    if(search){const s=students.find(x=>x.id===r.studentId);if(!s||!s.fullName.toLowerCase().includes(search.toLowerCase()))return false}
    return true;
  }).sort((a,b)=>b.timestamp-a.timestamp);
  const types=[...new Set(records.map(r=>r.type))];

  return <div>
    <h2 style={{fontFamily:'Cinzel',fontSize:'1.1rem',fontWeight:700,marginBottom:14}}>Historial</h2>
    <div style={{display:'flex',gap:5,marginBottom:10,flexWrap:'wrap'}}>
      <input className="inp" style={{flex:1,minWidth:140}} placeholder="Buscar..." value={search} onChange={e=>setSearch(e.target.value)}/>
      <select className="inp" style={{width:'auto'}} value={fC} onChange={e=>setFC(e.target.value)}>
        <option value="all">Todos los cursos</option>{courses.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
      </select>
      <select className="inp" style={{width:'auto'}} value={fT} onChange={e=>setFT(e.target.value)}>
        <option value="all">Todos</option>{types.map(t=><option key={t} value={t}>{t}</option>)}
      </select>
    </div>
    <div className="cd">
      {filtered.slice(0,50).map(r=>{const s=students.find(x=>x.id===r.studentId);const c=courses.find(x=>x.id===r.courseId);return(
        <div key={r.id} style={{display:'flex',alignItems:'center',gap:6,padding:'7px 10px',borderBottom:'1px solid #161616'}}>
          <span className="dot dot-h"/>
          <div style={{flex:1}}><div style={{fontSize:'.7rem',color:'#bbb'}}>{s?.fullName||'?'}</div><div style={{fontSize:'.52rem',color:'#333'}}>{c?.name||'?'}</div></div>
          <span style={{fontSize:'.6rem',color:'#dc2626',fontWeight:700}}>{r.type}</span>
          <span style={{fontSize:'.52rem',color:'#333',minWidth:65,textAlign:'right'}}>{r.date?.slice(5)} {r.time}</span>
        </div>
      )})}
      {filtered.length===0&&<div style={{padding:24,textAlign:'center',color:'#333'}}>Sin registros</div>}
      {filtered.length>50&&<div style={{padding:6,textAlign:'center',color:'#333',fontSize:'.6rem'}}>Mostrando 50 de {filtered.length}</div>}
    </div>
  </div>
}

// ===== CONFIGURACION =====
function Settings(){
  const{settings,updSettings,cBtns,addCBtn,rmCBtn}=useApp();
  const{addToast}=useToast();
  const[nb,setNb]=useState('');

  return <div>
    <h2 style={{fontFamily:'Cinzel',fontSize:'1.1rem',fontWeight:700,marginBottom:14}}>Configuracion</h2>
    <div style={{display:'flex',flexDirection:'column',gap:10,maxWidth:420}}>
      <div className="cd" style={{padding:14}}>
        <h3 style={{fontFamily:'Cinzel',fontSize:'.78rem',fontWeight:700,color:'#dc2626',marginBottom:10}}>General</h3>
        <div><label style={{fontSize:'.58rem',color:'#555',display:'block',marginBottom:2}}>Nombre del docente</label><input className="inp" value={settings.teacherName} onChange={e=>updSettings({teacherName:e.target.value})} placeholder="Tu nombre"/></div>
      </div>
      <div className="cd" style={{padding:14}}>
        <h3 style={{fontFamily:'Cinzel',fontSize:'.78rem',fontWeight:700,color:'#dc2626',marginBottom:10}}>Botones de Registro</h3>
        <div style={{marginBottom:6}}>
          <div style={{fontSize:'.55rem',color:'#444',marginBottom:3}}>Predeterminados:</div>
          <div style={{display:'flex',gap:3,flexWrap:'wrap'}}>{DEF_BTNS.map(b=><span key={b} className="rb" style={{cursor:'default'}}>{b}</span>)}</div>
        </div>
        <div style={{fontSize:'.55rem',color:'#444',marginBottom:3}}>Personalizados:</div>
        {cBtns.map(b=><div key={b.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'3px 0',borderBottom:'1px solid #1a1a1a'}}>
          <span style={{fontSize:'.7rem',color:'#bbb'}}>{b.name}</span>
          <button style={{background:'none',border:'none',color:'#991b1b',cursor:'pointer'}} onClick={()=>{rmCBtn(b.id);addToast('Boton eliminado','info')}}><i className="fa-solid fa-trash"/></button>
        </div>)}
        <div style={{display:'flex',gap:5,marginTop:6}}>
          <input className="inp" style={{flex:1}} placeholder="Nuevo boton" value={nb} onChange={e=>setNb(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&nb.trim()){addCBtn(nb.trim());setNb('');addToast('Boton agregado')}}}/>
          <button className="btn-p" onClick={()=>{if(nb.trim()){addCBtn(nb.trim());setNb('');addToast('Boton agregado')}}}>Agregar</button>
        </div>
      </div>
      <div className="cd" style={{padding:14}}>
        <h3 style={{fontFamily:'Cinzel',fontSize:'.78rem',fontWeight:700,color:'#dc2626',marginBottom:10}}>Atajos de Teclado</h3>
        <div style={{display:'flex',flexDirection:'column',gap:4,fontSize:'.68rem',color:'#555'}}>
          <div><kbd style={{background:'#1a1a1a',padding:'1px 4px',borderRadius:2,color:'#888',fontSize:'.6rem'}}>N</kbd> Nuevo estudiante</div>
          <div><kbd style={{background:'#1a1a1a',padding:'1px 4px',borderRadius:2,color:'#888',fontSize:'.6rem'}}>C</kbd> Nuevo curso</div>
          <div><kbd style={{background:'#1a1a1a',padding:'1px 4px',borderRadius:2,color:'#888',fontSize:'.6rem'}}>Ctrl+Z</kbd> Deshacer</div>
          <div><kbd style={{background:'#1a1a1a',padding:'1px 4px',borderRadius:2,color:'#888',fontSize:'.6rem'}}>Ctrl+P</kbd> Exportar</div>
        </div>
      </div>
      <div className="cd" style={{padding:14}}>
        <h3 style={{fontFamily:'Cinzel',fontSize:'.78rem',fontWeight:700,color:'#dc2626',marginBottom:10}}>Datos</h3>
        <button className="btn-s" style={{width:'100%'}} onClick={()=>{if(confirm('Eliminar TODOS los datos locales?')){Object.keys(localStorage).filter(k=>k.startsWith(SP)).forEach(k=>localStorage.removeItem(k));window.location.reload()}}}><i className="fa-solid fa-trash" style={{marginRight:4}}/>Limpiar datos locales</button>
      </div>
    </div>
  </div>
}

// ===== APP PRINCIPAL =====
function App(){
  const[page,setPage]=useState('dashboard');
  const[cid,setCid]=useState(null);
  const[sbOpen,setSbOpen]=useState(false);
  const{undoLast}=useApp();

  useEffect(()=>{
    const h=e=>{
      if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;
      if(e.ctrlKey&&e.key==='z'){e.preventDefault();if(undoLast()){}return}
      if(e.ctrlKey&&e.key==='p'){e.preventDefault();setPage('reports');return}
      if(e.key==='n'){setPage('courses');return}
      if(e.key==='c'&&!e.ctrlKey){setPage('courses');return}
    };
    window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);
  },[undoLast]);

  const renderPage=()=>{
    switch(page){
      case 'dashboard':return <Dashboard setPage={setPage} setCid={setCid}/>;
      case 'courses':return <Courses setPage={setPage} setCid={setCid}/>;
      case 'courseDetail':return <CourseDetail courseId={cid} setPage={setPage}/>;
      case 'calendar':return <Calendar/>;
      case 'stats':return <Stats/>;
      case 'reports':return <Reports/>;
      case 'history':return <History/>;
      case 'settings':return <Settings/>;
      default:return <Dashboard setPage={setPage} setCid={setCid}/>;
    }
  };

  return <div style={{minHeight:'100vh'}}>
    <Sidebar page={page} setPage={setPage} open={sbOpen} setOpen={setSbOpen}/>
    <div className="main-area">
      <header className="no-print" style={{display:'flex',alignItems:'center',gap:8,padding:'10px 0',borderBottom:'1px solid #1a1a1a',marginBottom:14}}>
        <div className="hamburger" onClick={()=>setSbOpen(!sbOpen)}><i className="fa-solid fa-bars"/></div>
        <div style={{flex:1}}/>
        <SyncInd/>
      </header>
      {renderPage()}
    </div>
    <BottomNav page={page} setPage={setPage}/>
  </div>
}

// ===== RENDER =====
const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<DataProvider><ToastProvider><App/></ToastProvider></DataProvider>);
</script>
</body>
</html>
